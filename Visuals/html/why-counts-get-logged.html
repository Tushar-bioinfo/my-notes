*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:var(--f-disp);font-size:18px;line-height:1.55;-webkit-font-smoothing:antialiased;
  padding:28px 16px 64px;transition:background .2s,color .2s}
b,strong{font-weight:700}
code{font-family:var(--f-mono);font-size:.92em}
.mono{font-family:var(--f-mono)}
a{color:var(--c1)}

/* header: compact so the stage owns the screen */
.top{max-width:var(--stage-w);margin:0 auto 22px;display:flex;align-items:flex-end;gap:20px;flex-wrap:wrap;
  border-bottom:3px solid var(--line);padding-bottom:16px}
.top .tx{flex:1;min-width:260px}
.eyebrow{display:inline-block;font-family:var(--f-mono);font-weight:700;font-size:12px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink);background:var(--surf2);border:2px solid var(--line);box-shadow:3px 3px 0 var(--line);padding:3px 10px;margin-bottom:12px}
h1{color:var(--tint);font-size:clamp(26px,3.4vw,40px);font-weight:900;text-transform:uppercase;letter-spacing:-.025em;line-height:1}
.sub{font-family:var(--f-mono);font-size:14px;color:var(--muted);margin-top:8px}.sub::before{content:"// ";color:var(--acc)}

/* the stage card: the figure is the hero */
.card{position:relative;max-width:var(--stage-w);margin:0 auto 40px;background:var(--surf);border:3px solid var(--line);
  box-shadow:8px 8px 0 var(--line-dim);padding:20px 22px 18px}
.head{display:flex;align-items:baseline;gap:14px;min-height:34px;padding-right:44px;margin-bottom:12px}
.phase{font:700 11px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink);background:var(--surf2);border:2px solid var(--line);padding:2px 8px;white-space:nowrap}
.stitle{font-size:38px;font-weight:800;letter-spacing:-.01em;line-height:1.15}
.fig{position:relative;background:var(--fig);border:0;overflow:hidden}
.fig svg,.fig canvas{display:block;width:100%;height:auto;max-height:none;margin:0 auto}
.fig svg text{font-family:var(--f-disp)}
.fig svg .mono{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace}
.ib{position:absolute;top:16px;right:18px;width:32px;height:32px;border:2px solid var(--line);background:var(--surf2);color:var(--ink);
  font:900 15px var(--f-mono);cursor:pointer;box-shadow:3px 3px 0 var(--line)}
.ib[aria-expanded=true]{background:var(--line);color:var(--bg)}

/* figure + step strip: the strip is the figure's bottom edge; chevrons appear on the figure's sides on hover */
.figwrap{position:relative}
.strip{position:relative;display:flex;gap:10px;margin-top:6px;height:14px;align-items:flex-start}
.sg{display:flex;gap:3px;min-width:0}
.seg{flex:1;min-width:6px;height:6px;padding:0;border:0;background:var(--line-dim);cursor:pointer;position:relative;transition:height .15s}
.seg::after{content:"";position:absolute;inset:-6px 0}   /* bigger hit area */
.seg i{display:block;height:100%;width:0;background:var(--tint)}
.strip:hover .seg{height:8px}
.seg[aria-selected=true]{box-shadow:0 0 0 1px var(--acc)}
.seg:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
.tip{position:absolute;bottom:18px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .12s;
  font:700 11px var(--f-mono);letter-spacing:.04em;color:var(--ink);background:var(--surf2);border:1px solid var(--line-dim);padding:3px 8px}
.tip.on{opacity:1}
.gh{position:absolute;top:calc(50% - 40px);width:44px;height:64px;border:0;background:color-mix(in srgb,var(--surf) 70%,transparent);color:var(--ink);
  font:900 26px var(--f-mono);cursor:pointer;opacity:0;transition:opacity .15s}
.gh.prev{left:0}.gh.next{right:0}
.figwrap:hover .gh:not(:disabled),.gh:focus-visible{opacity:.85}
.gh:disabled{display:none}
@media (hover:none){.gh:not(:disabled){opacity:.55}}

/* controls: one quiet line; drag the value sideways, or use the thin track that shows on hover */
.ctl{display:flex;flex-wrap:wrap;align-items:center;gap:8px 30px;margin:12px 0 0;padding:0 2px}
.kn{position:relative;display:inline-flex;align-items:baseline;gap:9px;font:700 15px var(--f-mono);letter-spacing:.02em;text-transform:uppercase;color:var(--muted);padding-bottom:8px}
.kv{font:700 18px var(--f-mono);letter-spacing:0;text-transform:none;color:var(--ink);border-bottom:2px dotted var(--muted);cursor:ew-resize;user-select:none;touch-action:none;min-width:2ch}
.kn input{position:absolute;left:0;right:0;bottom:-6px;width:100%;height:14px;margin:0;opacity:0;accent-color:var(--muted);cursor:pointer;transition:opacity .15s}
.kn:hover input,.kn.drag input,.kn input:focus-visible{opacity:1}
.kn.drag .kv{color:var(--ink)}
.kb{margin-left:auto;display:inline-flex;align-items:center;gap:7px;font:700 15px var(--f-mono);letter-spacing:.02em;text-transform:uppercase;color:var(--muted);
  background:none;border:0;border-bottom:2px dotted var(--line-dim);padding:2px 0 6px;cursor:pointer}

.kb:hover{color:var(--ink)}.kb:active span{transform:rotate(-180deg)}

.side.open{transform:none}
.side .lead{font-size:19px;line-height:1.6;color:var(--ink);margin:0 0 24px;border-left:3px solid var(--tint);padding:2px 0 2px 14px}
.side .phase{color:var(--tint);border-color:var(--tint-lo);background:none}
.side strong{color:var(--tint-hi)}
.side li::marker{color:var(--tint)}
.side .sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}

.side .st{font-size:23px;font-weight:850;line-height:1.25;margin-bottom:18px}
.side section{padding:24px 0;border-top:1px solid var(--tint-lo)}
.side h4{font:700 12px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--acc);margin-bottom:14px}

.side .wx{font:16px/1.6 var(--f-mono);color:var(--ink);background:color-mix(in srgb,var(--tint) 9%,var(--surf2));border-left:3px solid var(--acc);padding:12px 16px}

.flip{cursor:pointer}.flip .a{display:none;margin-top:10px;padding-top:10px;border-top:2px dashed var(--line-dim)}.flip.on .a{display:block}

.sec{display:block;max-width:var(--stage-w);margin:40px auto 16px;font:700 13px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);border-bottom:2px solid var(--line-dim);padding-bottom:6px}

/* calc engine extras */
.fig .katex{font-size:1em}
.fig .katex svg{height:inherit;max-height:none;margin:0}  /* KaTeX draws radicals with inner SVGs; the stage rule above must not resize them */
.fig foreignObject div{color:var(--ink);font-family:var(--f-disp);line-height:1.2}
.foot{max-width:var(--stage-w);margin:30px auto 0;font:500 12px var(--f-mono);color:var(--dim)}

@media (max-width:700px){
  body{padding:18px 12px 48px;font-size:17px}
  .card{padding:14px 12px;box-shadow:5px 5px 0 var(--acc)}

}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.fig svg text{font-variant-numeric:tabular-nums}

    if (st.op !== 'show') drawFormula(g, geo, s.live, TS, s.heroOp);
  }

  // ---------- one operation ----------
  function drawOp(g, st, pl, t, TS, sc) {
    const dk = deckGeo(g); let geo = dk.geo.get(st);
    if (geo && geo.split) geo = pl.rest != null ? geo.out : geo.in;   // split step: first click(s) inputs, the wave the output
    if (!geo) { if (st.title && !P.calcFallback.includes(st.title)) P.calcFallback.push(st.title); return; }
    const s = stateOf(st, pl, t, sc);
    if (geo.kind === 'gd') drawGD(g, st, s, TS, stackSpec(st, TS) || columnSpec(st, TS), geo); else drawGrid(g, st, s, TS, geo);
  }

  // ---------- where a statistic falls on its distribution ----------
  function drawDist(g, st, pl, t, TS) {
    const prm = st.params, x = st.x, disc = ['pois', 'nb', 'binom'].includes(st.dist);
    const left = st.src ? 420 : 90;
    if (st.src) { const [nm, i, j] = st.src, T = TS[nm], cw = 66, ch = 40;
      const R = T.data.length, C = T.data[0].length, mx = 60 + (T.rows ? 70 : 0), my = (g.H - R * ch) / 2;
      g.text(mx + C * cw / 2, my - 48, T.label, { size: 18, anchor: 'middle', weight: 750, fill: T.color });
      g.matrix(mx, my, T.disp, { cw, ch, rows: T.rows, cols: T.cols, fmt: v => v, size: 18, cell: (a, b) => a === i && b === j ? { fill: fcol(T.color), stroke: T.color, sw: 3, color: T.color } : { op: .5, top: .5 } }); }
    let pdf, lo, hi;
    if (st.dist === 'norm') { const m = prm.mu ?? 0, s = prm.sd ?? 1; pdf = v => ST.normPdf(v, m, s); lo = Math.min(m - 4 * s, x - s); hi = Math.max(m + 4 * s, x + s); }
    else if (st.dist === 't') { pdf = v => ST.tPdf(v, prm.df); lo = Math.min(-5, x - 1); hi = Math.max(5, x + 1); }
    else if (st.dist === 'chi2') { const k = prm.df; pdf = v => ST.gammaPdf(v, k / 2, .5); lo = 0; hi = Math.max(k + 5 * Math.sqrt(2 * k), x * 1.15); }
    else { const pm = st.dist === 'pois' ? k => ST.poisPmf(k, prm.lam) : st.dist === 'nb' ? k => ST.nbPmf(k, prm.mu, prm.phi) : k => ST.binomPmf(k, prm.n, prm.p);
      pdf = pm; const mu = prm.lam ?? prm.mu ?? prm.n * prm.p; lo = 0; hi = Math.max(Math.ceil(mu * 2.6 + 6), x + 3); if (st.dist === 'binom') hi = prm.n; }
    const ymax = disc ? Math.max(...P.range(lo, hi, hi - lo + 1).map(k => pdf(Math.round(k)))) : Math.max(...P.range(lo, hi, 200).map(pdf));
    const ax = g.axes({ x: left, y: 120, w: g.W - left - 80, h: 380, xd: [lo, hi], yd: [0, ymax * 1.15], xt: 6, yt: 3, xl: st.xlabel || 'value', yl: disc ? 'probability' : 'density', size: 17 });
    const sh = P.seg(t, .3, 1), inTail = v => st.tail === 'upper' ? v >= x : st.tail === 'lower' ? v <= x : Math.abs(v) >= Math.abs(x);
    if (disc) { const ks = []; for (let k = Math.ceil(lo); k <= hi; k++) ks.push(k);
      g.bars(ks.map(k => [k, pdf(k)]), ax, { bw: .8, fill: (k) => inTail(k) && sh > 0 ? 'f3' : 'f1', stroke: 'c1' }); }
    else {
      g.area(pdf, ax, lo, hi, { fill: 'f1' });
      if (sh > 0) { if (st.tail !== 'lower') g.area(pdf, ax, st.tail === 'two' ? Math.abs(x) : x, hi, { fill: 'c3', op: .55 * sh });
        if (st.tail !== 'upper') g.area(pdf, ax, lo, st.tail === 'two' ? -Math.abs(x) : x, { fill: 'c3', op: .55 * sh }); }
      g.curve(pdf, ax, lo, hi, { stroke: 'c1', sw: 3, free: true }); }
    const X = ax.sx(x);
    g.line(X, ax.y - 6, X, ax.y + ax.h, { stroke: 'c3', sw: 3, free: true });
    g.text(X, ax.y - 22, `observed ${P.fmt(x)}`, { size: 20, anchor: X > g.W - 180 ? 'end' : 'middle', fill: 'c3', weight: 750 });
    if (sh > .5) g.text(ax.x + ax.w, ax.y + 30, `p = ${P.fmt(st.p, 3)}`, { size: 28, anchor: 'end', weight: 800, fill: 'c3', mono: true });
    if (st.tex) g.tex(g.W / 2, 50, st.tex, { size: 28, w: 900, h: 60 });
  }
})();
</script>
<script>
// Values recovered from the original SVG geometry; provenance is in data/*_points.json.
// Kit axes, marks and annotations replace the embedded SVG presentation.
const F = PROFF_DATA.facts;
Proff.page({ title: 'Why counts get logged', sub: `${F.n_genes.toLocaleString()} simulated genes × 6 samples`, eyebrow: 'data story' });
const RX = 930;
const H = PROFF_DATA.hist_points, M = PROFF_DATA.meanvar_points, L = PROFF_DATA.logsd_points;
const SUP = { '0': '⁰', '1': '¹', '2': '²', '3': '³', '4': '⁴', '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹', '-': '⁻' };
const logTick = v => v === 1 ? '1' : v === 10 ? '10' : '10' + [...String(Math.round(Math.log10(v)))].map(c => SUP[c]).join('');
const axes = (g, data, labels) => g.axes({ x: 110, y: 70, w: 790, h: 500,
  xd: data.axes.xlim, yd: data.axes.ylim, xlog: data.axes.xlog, ylog: data.axes.ylog,
  ...(data.axes.xlog ? { fmtx: logTick } : {}), ...(data.axes.ylog ? { fmty: logTick } : {}), ...labels });
// Clip reference polylines at the plot boundary by intersection in transformed coordinates.
// This preserves the source line shape; points always go through ax.pt without clamping.
const reference = (g, ax, data, line, style) => {
  const X = v => data.axes.xlog ? Math.log10(v) : v;
  const Y = v => data.axes.ylog ? Math.log10(v) : v;
  const invX = v => data.axes.xlog ? 10 ** v : v;
  const top = data.axes.ylim[1], pts = [];
  line.points.forEach(([x, y], i) => {
    if (y <= top) pts.push([ax.sx(x), ax.sy(y)]);
    else if (i && line.points[i - 1][1] <= top) {
      const [px, py] = line.points[i - 1], t = (Y(top) - Y(py)) / (Y(y) - Y(py));
      pts.push([ax.sx(invX(X(px) + t * (X(x) - X(px)))), ax.sy(top)]);
    }
  });
  g.poly(pts, { sw: 3, ...style });
};

Proff.scene({
  title: 'Most genes receive few reads.',
  info: { read: [`${F.zeros} genes have zero reads. This histogram omits zero and one-read genes; the percentage includes them.`] },
  steps: [
    { title: 'Most genes receive few reads.', cap: 'Reads per gene in one sample. The horizontal axis uses a log scale to show the long tail.' },
    { title: 'Most genes stay below 100 reads.', cap: `${Math.round(F.frac_under_100 * 100)}% of genes get fewer than 100 reads. The bracket marks the positive counts below 100.` },
    { title: 'One gene dominates the raw scale.', cap: `The largest count is ${F.max.toLocaleString()} reads. A plain horizontal scale would squeeze most genes against zero.` },
  ],
  draw(g, k) {
    const A = axes(g, H, { xl: 'reads per gene', yl: 'genes', xt: [1, 10, 100, 1000, 10000, 100000], yt: [0, 20, 40, 60, 80] });
    H.bars.forEach(b => {
      if (!b.count) return;
      g.rect(A.sx(b.left), A.sy(b.count), A.sx(b.right) - A.sx(b.left), A.sy(0) - A.sy(b.count), { fill: Proff.shade.seq[1], stroke: 'none' });
    });
    if (k === 0) g.note(RX, 104, 'raw counts');
    if (k === 1) {
      const y = A.sy(F.hist_top * 1.08);
      g.brace(A.sx(1), y, A.sx(100), y, '', { stroke: 'c2' });
      g.note(RX, 458, 'low-count genes');
      g.hero(RX, 538, `${Math.round(F.frac_under_100 * 100)}%`, { size: 72, anchor: 'start' });
    }
    if (k === 2) {
      // Mark the existing maximum bin without adding a leader through the data.
      g.line(A.sx(F.max), A.y + A.h - 34, A.sx(F.max), A.y + A.h - 8, { stroke: 'c2', sw: 3 });
      g.note(RX, 458, 'maximum reads');
      g.hero(RX, 538, F.max.toLocaleString(), { size: 64, anchor: 'start' });
    }
  }
});

Proff.scene({
  title: 'Count variance outgrows the mean.',
  steps: [
    { title: 'Count variance outgrows the mean.', cap: 'Each dot is a simulated gene: its average count and variance across six samples.',
      info: { read: ['Both axes use log scales. Equal steps represent equal fold changes.', 'Variance measures how widely the sample counts spread.'] } },
    { title: 'Poisson noise predicts less variance.', cap: 'Pure counting noise follows the Poisson model: variance equals mean.',
      info: { read: ['The lower line is the Poisson prediction.', 'The gene cloud rises above it as counts increase.'] } },
    { title: 'Extra spread grows with squared mean.', cap: 'The upper curve adds extra variation: variance equals mean plus dispersion times mean squared.',
      info: { read: [`φ means dispersion: extra spread beyond counting noise. It is ${F.phi} in this negative binomial simulation.`, 'At high counts, tenfold more reads gives about one hundredfold more variance.'] } },
  ],
  draw(g, k) {
    const A = axes(g, M, { xl: 'mean count', yl: 'count variance', xt: [1, 100, 10000, 100000], yt: [0.1, 10, 1000, 100000, 10000000, 1000000000] });
    M.points.forEach(([x, y]) => A.pt(x, y, { r: 7, fill: 'ink', op: .3 }));
    const poisson = k === 1 ? 'c2' : 'c1', extra = k === 2 ? 'c2' : 'ink';
    reference(g, A, M, M.lines[0], { stroke: poisson, dash: '10 7' });
    reference(g, A, M, M.lines[1], { stroke: extra });
    if (k >= 1) g.note(RX, A.sy(1e5), 'Poisson', { fill: poisson });
    if (k >= 2) g.note(RX, 104, 'mean + φ·mean²', { fill: extra });
  }
});

Proff.scene({
  title: 'Logs level the high-count spread.',
  info: { text: 'SD means standard deviation: the typical spread among samples.' },
  steps: [
    { title: 'Logs level the high-count spread.', cap: 'The same genes after log₂(count + 1). The vertical axis now shows standard deviation rather than variance.' },
    { title: 'High-count spread settles near one level.', cap: `Above roughly 5 on this horizontal scale, standard deviation stays near ${F.flat_sd.toFixed(2)}.`,
      info: { read: ['The dashed line marks the typical high-count spread.', 'Logging compresses large counts more than small counts.'] } },
    { title: 'Low counts retain uneven spread.', cap: 'Logging does not remove the uneven spread at low counts. The outlined region marks these genes.',
      info: { read: ['Adding one makes zero counts possible on the transformed scale.', 'A log transform alone does not fully stabilize low-count variation.'] } },
  ],
  draw(g, k) {
    const A = axes(g, L, { xl: 'mean log₂(count + 1)', yl: 'SD log₂(count + 1)', xt: [0, 4, 8, 12, 16], yt: [0, .5, 1, 1.5, 2] });
    L.points.forEach(([x, y]) => A.pt(x, y, { r: 7, fill: 'ink', op: .3 }));
    reference(g, A, L, L.lines[0], { stroke: k === 1 ? 'c2' : 'ink', dash: '10 7' });
    if (k >= 1) {
      g.note(RX, 458, 'high-count SD');
      g.hero(RX, 538, F.flat_sd.toFixed(2), { size: 72, anchor: 'start' });
    }
    if (k === 2) {
      g.rect(A.sx(0.05), A.y + 4, A.sx(4) - A.sx(0.05), A.h - 8, { fill: 'none', stroke: 'c2', sw: 3, dash: true });
      g.note(RX, 104, 'low counts');
    }
  }
});

</script>
