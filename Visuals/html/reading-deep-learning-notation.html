<style>/* Proff visual kit. BlockFrame chrome (thick borders, hard offset shadows, heavy Inter, Space Grotesk labels)
   around clean figures. Dark only. Every colour is a token. Authors never edit this file. */
/* v5 mono: one hot accent; meaningful pairs checked by palette-check.py. */
:root,[data-theme=dark],[data-palette=mono][data-theme=dark]{
  --bg:#0b0c0e;--fig:#171819;--surf:#171819;--surf2:#242526;--line:#565653;--line-dim:#353634;--grid:#222322;
  --ink:#f2f2f0;--muted:#b6b4ad;--dim:#85837d;--on:#0b0c0e;
  --c1:#7fb0ff;--c2:#ff5a36;--c3:#5fdcc4;--c4:#9aabc2;--c5:#8e9d99;--c6:#7c7a76;--mix:20%;
}
/* mono chrome orange: a calm tint of the accent's hue for the page title, step strip, read outlines and sidebar.
   tint #ffb27f: 8.7-11.1:1 on every surface; CIEDE2000 vs accent 20.6 normal / 20.0 protan / 12.9 deutan (never the only cue on the stage: read = outline, answer = solid tile).
   tint-hi #ffd6b8: sidebar values, 11.4:1+. tint-lo: lines only, no text. */
/* user (2026-10-15): page title, step strip, DETAILS tag and sidebar headings use the bright accent #ff5a36 (6.3:1 on --bg);
   the soft tint #ffb27f stays only for the 'being read' cell outlines on the stage (P.shade.tint in stage.js). */
[data-palette=mono][data-theme=dark]{--tint:#ff5a36;--tint-hi:#ffd6b8;--tint-lo:#6b4631;--acc:var(--tint)}
/* page title only: the bright accent (same orange as the plot answer), 6.3:1 on --bg; strip, outlines and sidebar keep the tint. */
[data-palette=mono][data-theme=dark] h1{color:var(--c2)}
[data-palette=cyan][data-theme=dark]{   /* default palette "cyan": cyan blue and cyan green carry the figure; amber is the one warm highlight.
     Hues picked by search for colour-blind separation (CIEDE2000, Machado 2009 deutan/protan): c1-c3, c1-c2, c2-c3 stay >= ~20 for every reader.
     c1, c4, c5 and c6 are all cool and sit 15-18 apart: never let two of them carry a contrast alone (add a label, dash, or shape). */
  --bg:#0a0b0d;--fig:#111316;--surf:#171a1d;--surf2:#21252a;--line:#56616b;--line-dim:#2a3036;--grid:#21262b;
  --ink:#f0fbff;--muted:#a3b1bb;--dim:#6b7882;--on:#000000;
  --c1:#72c9f5;--c2:#f3a833;--c3:#6bebb6;--c4:#4f91f0;--c5:#c7ebee;--c6:#8f99a4;--mix:20%;
}
[data-palette=blockframe][data-theme=dark]{   /* preset "blockframe" (the v4.0 default): Block Frame pastels (frontend-slides, MIT) on black.
     c2 and c5 are both warm and light: never let them carry a contrast alone. */
  --bg:#0b0b0c;--fig:#121214;--surf:#18181b;--surf2:#232327;--line:#5a5a63;--line-dim:#2c2c31;--grid:#232327;
  --ink:#fffdf5;--muted:#a9a9b2;--dim:#6e6e76;--on:#000000;
  --c1:#8feaf7;--c2:#f5c030;--c3:#fe90e8;--c4:#99e885;--c5:#ffdc8b;--c6:#b7b4c7;--mix:20%;
}
[data-palette=lab][data-theme=dark]{   /* preset "lab": Okabe-Ito hues */
  --bg:#0e1116;--fig:#12161c;--surf:#171c23;--surf2:#1e242d;--line:#e8ecf2;--line-dim:#343c48;--grid:#222934;
  --ink:#eef2f7;--muted:#9aa5b5;--dim:#6a7584;--on:#0e1116;
  --c1:#5cb8f0;--c2:#f0b43c;--c3:#f2694a;--c4:#3ccf9e;--c5:#c98ae6;--c6:#cfdc5a;--mix:22%;
}
/* palette "neon" (the original proff look): Proff.page({palette:'neon'}) */
[data-palette=neon][data-theme=dark]{--bg:#0a0a0b;--fig:#111113;--surf:#161618;--surf2:#1d1d20;--line:#ececee;--line-dim:#3a3a3f;--grid:#26262b;
  --ink:#f4f4f5;--muted:#a1a1aa;--dim:#6b6b72;--on:#0a0a0b;--c1:#56c2ff;--c2:#ffc531;--c3:#ff6363;--c4:#59d499;--c5:#b98cff;--c6:#ff8f4a}
/* soft fills are mixed where data-theme is set, so they follow the live palette (a :root-only rule would freeze them to dark) */
:root,[data-theme]{--f-disp:'Inter',system-ui,-apple-system,sans-serif;--f-mono:ui-monospace,Menlo,monospace;
  --f1:color-mix(in srgb,var(--c1) var(--mix),var(--fig));--f2:color-mix(in srgb,var(--c2) var(--mix),var(--fig));
  --f3:color-mix(in srgb,var(--c3) var(--mix),var(--fig));--f4:color-mix(in srgb,var(--c4) var(--mix),var(--fig));
  --f5:color-mix(in srgb,var(--c5) var(--mix),var(--fig));--f6:color-mix(in srgb,var(--c6) var(--mix),var(--fig));
  --acc:var(--muted);--tint:var(--ink);--tint-hi:var(--ink);--tint-lo:var(--line);--stage-w:min(1250px,calc(100vw - 32px))}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:var(--f-disp);font-size:18px;line-height:1.55;-webkit-font-smoothing:antialiased;
  padding:28px 16px 64px;transition:background .2s,color .2s}
b,strong{font-weight:700}
code{font-family:var(--f-mono);font-size:.92em}
.mono{font-family:var(--f-mono)}
a{color:var(--c1)}

/* header: compact so the stage owns the screen */
.top{max-width:var(--stage-w);margin:0 auto 22px;display:flex;align-items:flex-end;gap:20px;flex-wrap:wrap;
  border-bottom:3px solid var(--line);padding-bottom:16px}
.top .tx{flex:1;min-width:260px}
.eyebrow{display:inline-block;font-family:var(--f-mono);font-weight:700;font-size:12px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink);background:var(--surf2);border:2px solid var(--line);box-shadow:3px 3px 0 var(--line);padding:3px 10px;margin-bottom:12px}
h1{color:var(--tint);font-size:clamp(26px,3.4vw,40px);font-weight:900;text-transform:uppercase;letter-spacing:-.025em;line-height:1}
.sub{font-family:var(--f-mono);font-size:14px;color:var(--muted);margin-top:8px}.sub::before{content:"// ";color:var(--acc)}

/* the stage card: the figure is the hero */
.card{position:relative;max-width:var(--stage-w);margin:0 auto 40px;background:var(--surf);border:3px solid var(--line);
  box-shadow:8px 8px 0 var(--line-dim);padding:20px 22px 18px}
.head{display:flex;align-items:baseline;gap:14px;min-height:34px;padding-right:44px;margin-bottom:12px}
.phase{font:700 11px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink);background:var(--surf2);border:2px solid var(--line);padding:2px 8px;white-space:nowrap}
.stitle{font-size:38px;font-weight:800;letter-spacing:-.01em;line-height:1.15}
.fig{position:relative;background:var(--fig);border:0;overflow:hidden}
.fig svg,.fig canvas{display:block;width:100%;height:auto;max-height:none;margin:0 auto}
.fig svg text{font-family:var(--f-disp)}
.fig svg .mono{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace}
.ib{position:absolute;top:16px;right:18px;width:32px;height:32px;border:2px solid var(--line);background:var(--surf2);color:var(--ink);
  font:900 15px var(--f-mono);cursor:pointer;box-shadow:3px 3px 0 var(--line)}
.ib[aria-expanded=true]{background:var(--line);color:var(--bg)}

/* figure + step strip: the strip is the figure's bottom edge; chevrons appear on the figure's sides on hover */
.figwrap{position:relative}
.strip{position:relative;display:flex;gap:10px;margin-top:6px;height:14px;align-items:flex-start}
.sg{display:flex;gap:3px;min-width:0}
.seg{flex:1;min-width:6px;height:6px;padding:0;border:0;background:var(--line-dim);cursor:pointer;position:relative;transition:height .15s}
.seg::after{content:"";position:absolute;inset:-6px 0}   /* bigger hit area */
.seg i{display:block;height:100%;width:0;background:var(--tint)}
.strip:hover .seg{height:8px}
.seg[aria-selected=true]{box-shadow:0 0 0 1px var(--acc)}
.seg:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
.tip{position:absolute;bottom:18px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .12s;
  font:700 11px var(--f-mono);letter-spacing:.04em;color:var(--ink);background:var(--surf2);border:1px solid var(--line-dim);padding:3px 8px}
.tip.on{opacity:1}
.gh{position:absolute;top:calc(50% - 40px);width:44px;height:64px;border:0;background:color-mix(in srgb,var(--surf) 70%,transparent);color:var(--ink);
  font:900 26px var(--f-mono);cursor:pointer;opacity:0;transition:opacity .15s}
.gh.prev{left:0}.gh.next{right:0}
.figwrap:hover .gh:not(:disabled),.gh:focus-visible{opacity:.85}
.gh:disabled{display:none}
@media (hover:none){.gh:not(:disabled){opacity:.55}}

/* controls: one quiet line; drag the value sideways, or use the thin track that shows on hover */
.ctl{display:flex;flex-wrap:wrap;align-items:center;gap:8px 30px;margin:12px 0 0;padding:0 2px}
.kn{position:relative;display:inline-flex;align-items:baseline;gap:9px;font:700 15px var(--f-mono);letter-spacing:.02em;text-transform:uppercase;color:var(--muted);padding-bottom:8px}
.kv{font:700 18px var(--f-mono);letter-spacing:0;text-transform:none;color:var(--ink);border-bottom:2px dotted var(--muted);cursor:ew-resize;user-select:none;touch-action:none;min-width:2ch}
.kn input{position:absolute;left:0;right:0;bottom:-6px;width:100%;height:14px;margin:0;opacity:0;accent-color:var(--muted);cursor:pointer;transition:opacity .15s}
.kn:hover input,.kn.drag input,.kn input:focus-visible{opacity:1}
.kn.drag .kv{color:var(--ink)}
.kb{margin-left:auto;display:inline-flex;align-items:center;gap:7px;font:700 15px var(--f-mono);letter-spacing:.02em;text-transform:uppercase;color:var(--muted);
  background:none;border:0;border-bottom:2px dotted var(--line-dim);padding:2px 0 6px;cursor:pointer}
.kb span{font-size:16px;color:var(--acc);transition:transform .3s}
.kb:hover{color:var(--ink)}.kb:active span{transform:rotate(-180deg)}

/* info sidebar: 30% of the screen on the right; the page shifts left so nothing is hidden */
.side{position:fixed;top:0;right:0;z-index:50;height:100vh;width:clamp(360px,32vw,500px);overflow-y:auto;background:var(--surf);
  border-left:3px solid var(--tint-lo);padding:24px 32px 56px;transform:translateX(102%);transition:transform .22s ease;font-size:17px;line-height:1.6}
.side.open{transform:none}
.side .lead{font-size:19px;line-height:1.6;color:var(--ink);margin:0 0 24px;border-left:3px solid var(--tint);padding:2px 0 2px 14px}
.side .phase{color:var(--tint);border-color:var(--tint-lo);background:none}
.side strong{color:var(--tint-hi)}
.side li::marker{color:var(--tint)}
.side .sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.side .sx{width:32px;height:32px;border:2px solid var(--line);background:var(--surf2);color:var(--ink);font:900 18px var(--f-mono);cursor:pointer}
.side .st{font-size:23px;font-weight:850;line-height:1.25;margin-bottom:18px}
.side section{padding:24px 0;border-top:1px solid var(--tint-lo)}
.side h4{font:700 12px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--acc);margin-bottom:14px}
.side ul{padding-left:1.1em}.side li{margin:.7em 0;line-height:1.6}.side p+p{margin-top:.8em}
/* notation: "symbol : meaning" on one line, the example under it */
.side .nts{display:grid;grid-template-columns:max-content auto 1fr;column-gap:10px;align-items:baseline}
.side .nt,.side .nk{display:contents}
.side .sym{grid-column:1;font-weight:700;color:var(--acc);white-space:nowrap;line-height:1.55}
.side .col{grid-column:2;color:var(--dim)}
.side .ne{grid-column:3;color:var(--ink);line-height:1.55}
.side .eg{grid-column:3;margin:6px 0 22px;font:15px/1.55 var(--f-mono);color:var(--muted)}
.side .nt:last-child .eg{margin-bottom:4px}
.side .eg strong{color:var(--tint-hi)}
.side .wx{font:16px/1.6 var(--f-mono);color:var(--ink);background:color-mix(in srgb,var(--tint) 9%,var(--surf2));border-left:3px solid var(--acc);padding:12px 16px}
.side details{margin-top:12px;border-top:2px solid var(--line-dim);padding-top:10px}.side summary{cursor:pointer;font:700 11px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
@media (min-width:1000px){body.side-on{--stage-w:min(1250px,calc(100vw - clamp(360px,32vw,500px) - 48px));padding-right:calc(clamp(360px,32vw,500px) + 16px)}}
@media (max-width:1399px){.side{width:340px;padding:22px 26px 48px}body.side-on{--stage-w:calc(100vw - 340px - 48px);padding-right:356px}}   /* laptops: keep the figure big enough that 16-unit labels stay ≥ 12 px */
@media (max-width:999px){.side{width:min(92vw,460px);box-shadow:-12px 0 0 rgba(0,0,0,.35)}}

/* article layout: short prose between wide figures */
.prose{max-width:68ch;margin:0 auto 26px;font-size:19px}
.prose p+p{margin-top:.8em}
.prose h2{font-size:clamp(22px,2.6vw,30px);font-weight:900;text-transform:uppercase;letter-spacing:-.02em;margin:46px 0 14px;line-height:1.05}
.prose ul{padding-left:1.2em}.prose li{margin:.25em 0}
.acc1,.acc2,.acc3,.acc4,.acc5,.acc6{--acc:var(--muted)}

/* study page blocks */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:22px;max-width:var(--stage-w);margin:0 auto 34px}
.tile{background:var(--surf);border:3px solid var(--line);box-shadow:6px 6px 0 var(--acc);padding:18px 20px}
.tile h3{font-size:17px;font-weight:850;text-transform:uppercase;letter-spacing:-.01em;margin-bottom:8px;line-height:1.15}
.tile p,.tile li{font-size:16px}.tile ul{padding-left:1.1em}
.tile .tag{font:700 11px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:6px}
.big{font-size:44px;font-weight:900;letter-spacing:-.03em;line-height:1;color:var(--acc)}
.flip{cursor:pointer}.flip .a{display:none;margin-top:10px;padding-top:10px;border-top:2px dashed var(--line-dim)}.flip.on .a{display:block}
.flip .hint{font:700 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin-top:8px}
.flip.on .hint{display:none}
table.cmp{width:100%;max-width:var(--stage-w);margin:0 auto 34px;border-collapse:collapse;background:var(--surf);border:3px solid var(--line);box-shadow:6px 6px 0 var(--acc)}
table.cmp th,table.cmp td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line-dim);font-size:16px;vertical-align:top}
table.cmp th{font:700 12px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sec{display:block;max-width:var(--stage-w);margin:40px auto 16px;font:700 13px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);border-bottom:2px solid var(--line-dim);padding-bottom:6px}

/* calc engine extras */
.fig .katex{font-size:1em}
.fig .katex svg{height:inherit;max-height:none;margin:0}  /* KaTeX draws radicals with inner SVGs; the stage rule above must not resize them */
.fig foreignObject div{color:var(--ink);font-family:var(--f-disp);line-height:1.2}
.foot{max-width:var(--stage-w);margin:30px auto 0;font:500 12px var(--f-mono);color:var(--dim)}

@media (max-width:700px){
  body{padding:18px 12px 48px;font-size:17px}
  .card{padding:14px 12px;box-shadow:5px 5px 0 var(--acc)}
  .fig.pan{overflow-x:auto}.fig.pan svg{min-width:720px;max-height:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.fig svg text{font-variant-numeric:tabular-nums}
</style></head>

      const Tout = TS[spec.outItem.t];
      paintMatrix(g, Tout, spec.outItem.t, x, yOut, geo, st, s, { title: titleOf(Tout) }, TS);
    }
    drawFormula(g, geo, live, TS, s.heroOp);
  }
  function drawGrid(g, st, s, TS, geo) {
    const { ox, ch, cw } = geo, cellTop = geo.y0 + geo.maxTop, first = geo.parts.find(p => p.t);
    for (const p of geo.parts) {
      if (p.op != null) { if (p.op) g.text(ox + p.x, cellTop + (first.R * ch - GP) / 2, p.op, { ...opStyle(p.op), fill: 'muted', anchor: 'middle' }); continue; }
      const T = TS[p.t];
      // Same read-column cue as the stacked layout: orange header and a bar under it, when this table is read down one column.
      const rd = s.showRead > .1 && s.live ? (s.live.reads || []).filter(r => r[0] === p.t) : [], cols = new Set(rd.map(r => r[2]));
      const col = rd.length && cols.size === 1 && T.data[0].length > 1 ? rd[0][2] : null;
      if (col != null) g.rect(ox + p.x + col * cw + 10, cellTop - 8, cw - GP - 20, 3, { fill: 'c2', r: 1.5, stroke: 'none', free: true, deco: true });
      paintMatrix(g, T, p.t, ox + p.x, cellTop, geo, st, s, { rows: p.rows, cols: T.cols, title: titleOf(T), colFill: col != null ? j => j === col ? 'c2' : 'muted' : null }, TS);
    }
    if (geo.out) { const o = geo.out, T = TS[o.t], yAfter = cellTop + geo.Rmax * ch;
      g.line(ox + Math.min(geo.L0, o.x), yAfter + 22, ox + Math.max(geo.R0, o.x + o.C * cw - GP), yAfter + 22, { stroke: 'ink', sw: 2, op: .5, free: true });
      paintMatrix(g, T, o.t, ox + o.x, yAfter + 48 + o.m.top, geo, st, s, { rows: o.rows, cols: T.cols, title: titleOf(T) }, TS); }
    if (st.op !== 'show') drawFormula(g, geo, s.live, TS, s.heroOp);
  }

  // ---------- one operation ----------
  function drawOp(g, st, pl, t, TS, sc) {
    const dk = deckGeo(g); let geo = dk.geo.get(st);
    if (geo && geo.split) geo = pl.rest != null ? geo.out : geo.in;   // split step: first click(s) inputs, the wave the output
    if (!geo) { if (st.title && !P.calcFallback.includes(st.title)) P.calcFallback.push(st.title); return; }
    const s = stateOf(st, pl, t, sc);
    if (geo.kind === 'gd') drawGD(g, st, s, TS, stackSpec(st, TS) || columnSpec(st, TS), geo); else drawGrid(g, st, s, TS, geo);
  }

  // ---------- where a statistic falls on its distribution ----------
  function drawDist(g, st, pl, t, TS) {
    const prm = st.params, x = st.x, disc = ['pois', 'nb', 'binom'].includes(st.dist);
    const left = st.src ? 420 : 90;
    if (st.src) { const [nm, i, j] = st.src, T = TS[nm], cw = 66, ch = 40;
      const R = T.data.length, C = T.data[0].length, mx = 60 + (T.rows ? 70 : 0), my = (g.H - R * ch) / 2;
      g.text(mx + C * cw / 2, my - 48, T.label, { size: 18, anchor: 'middle', weight: 750, fill: T.color });
      g.matrix(mx, my, T.disp, { cw, ch, rows: T.rows, cols: T.cols, fmt: v => v, size: 18, cell: (a, b) => a === i && b === j ? { fill: fcol(T.color), stroke: T.color, sw: 3, color: T.color } : { op: .5, top: .5 } }); }
    let pdf, lo, hi;
    if (st.dist === 'norm') { const m = prm.mu ?? 0, s = prm.sd ?? 1; pdf = v => ST.normPdf(v, m, s); lo = Math.min(m - 4 * s, x - s); hi = Math.max(m + 4 * s, x + s); }
    else if (st.dist === 't') { pdf = v => ST.tPdf(v, prm.df); lo = Math.min(-5, x - 1); hi = Math.max(5, x + 1); }
    else if (st.dist === 'chi2') { const k = prm.df; pdf = v => ST.gammaPdf(v, k / 2, .5); lo = 0; hi = Math.max(k + 5 * Math.sqrt(2 * k), x * 1.15); }
    else { const pm = st.dist === 'pois' ? k => ST.poisPmf(k, prm.lam) : st.dist === 'nb' ? k => ST.nbPmf(k, prm.mu, prm.phi) : k => ST.binomPmf(k, prm.n, prm.p);
      pdf = pm; const mu = prm.lam ?? prm.mu ?? prm.n * prm.p; lo = 0; hi = Math.max(Math.ceil(mu * 2.6 + 6), x + 3); if (st.dist === 'binom') hi = prm.n; }
    const ymax = disc ? Math.max(...P.range(lo, hi, hi - lo + 1).map(k => pdf(Math.round(k)))) : Math.max(...P.range(lo, hi, 200).map(pdf));
    const ax = g.axes({ x: left, y: 120, w: g.W - left - 80, h: 380, xd: [lo, hi], yd: [0, ymax * 1.15], xt: 6, yt: 3, xl: st.xlabel || 'value', yl: disc ? 'probability' : 'density', size: 17 });
    const sh = P.seg(t, .3, 1), inTail = v => st.tail === 'upper' ? v >= x : st.tail === 'lower' ? v <= x : Math.abs(v) >= Math.abs(x);
    if (disc) { const ks = []; for (let k = Math.ceil(lo); k <= hi; k++) ks.push(k);
      g.bars(ks.map(k => [k, pdf(k)]), ax, { bw: .8, fill: (k) => inTail(k) && sh > 0 ? 'f3' : 'f1', stroke: 'c1' }); }
    else {
      g.area(pdf, ax, lo, hi, { fill: 'f1' });
      if (sh > 0) { if (st.tail !== 'lower') g.area(pdf, ax, st.tail === 'two' ? Math.abs(x) : x, hi, { fill: 'c3', op: .55 * sh });
        if (st.tail !== 'upper') g.area(pdf, ax, lo, st.tail === 'two' ? -Math.abs(x) : x, { fill: 'c3', op: .55 * sh }); }
      g.curve(pdf, ax, lo, hi, { stroke: 'c1', sw: 3, free: true }); }
    const X = ax.sx(x);
    g.line(X, ax.y - 6, X, ax.y + ax.h, { stroke: 'c3', sw: 3, free: true });
    g.text(X, ax.y - 22, `observed ${P.fmt(x)}`, { size: 20, anchor: X > g.W - 180 ? 'end' : 'middle', fill: 'c3', weight: 750 });
    if (sh > .5) g.text(ax.x + ax.w, ax.y + 30, `p = ${P.fmt(st.p, 3)}`, { size: 28, anchor: 'end', weight: 800, fill: 'c3', mono: true });
    if (st.tex) g.tex(g.W / 2, 50, st.tex, { size: 28, w: 900, h: 60 });
  }
})();
</script>
<script>
// Presentation only. Teaching values and calculation traces retain their original data.
Proff.page({ title: 'Reading deep-learning notation', sub: 'From one table entry to a layer stack and attention.', eyebrow: 'notation guide', layout: 'walk', palette: 'mono' });
const f1 = v => v.toFixed(1), f2 = v => v.toFixed(2), f3 = v => v.toFixed(3);
const softmax = (z, tau = 1) => { const e = z.map(v => Math.exp(v / tau)), s = e.reduce((a, b) => a + b, 0); return e.map(v => v / s); };
const CLASSES = ['tumour', 'stroma', 'immune'];
const LOGITS = PROFF_DATA.forward.tensors.z2.data.map(r => r[0]);
const P0 = softmax(LOGITS);
const step = (title, cap, info) => ({ title, cap, info });
// Formula role is KaTeX at 30 (1em, not shrunk). A fraction or sum is displaystyle so its parts stay full size.
// The foreignObject is only as wide as the column: ink stays ≥28 from the right edge and is not scaled down.
const RX = 894;
const math = (g, x, y, s) => {
  const size = 30, tall = /\\frac|\\sum|\\prod|\\arg\\min|\\mathbb\{1\}/.test(s);
  const plain = s.replace(/\\[a-zA-Z]+/g, 'M').replace(/[{}_^]/g, '');
  const est = Proff.measure(plain, { size, weight: 500, boost: false }) + 36;
  const w = Math.max(80, Math.min((1172 - x), est));
  g.tex(x, y, (tall ? '\\displaystyle ' : '') + s, { w, size, h: tall ? 168 : 80, anchor: 'start', fill: 'ink' });
};
const plot = (g, opts) => g.axes({ x: 110, y: 70, w: 740, h: 500, ...opts });
const bar = (g, ax, x, v, w, answer = false) => g.rect(ax.sx(x) - w / 2, Math.min(ax.sy(v), ax.sy(0)), w, Math.abs(ax.sy(0) - ax.sy(v)), { fill: answer ? 'c2' : 'surf2', stroke: answer ? 'c2' : 'muted', sw: 2 });

const X1 = [[5.1, .2, 3.4], [4.8, .1, 2.9], [.3, 6.2, .5], [.4, 5.8, .7]];
Proff.scene({
  title: 'Indices select entries, rows, or columns.', h: 675,
  controls: [{ name: 'i', label: 'row i (cell)', min: 1, max: 4, step: 1, value: 2 }, { name: 'j', label: 'column j (gene)', min: 1, max: 3, step: 1, value: 3 }],
  steps: [
    step('Two indices select one entry.', 'The selected tile is one gene in one cell.', { see: ['Subscript i names the row; j names the column.', 'Here, cell 2 and gene 3 give 2.9.'], try: 'Drag row i or column j.' }),
    step('A bracketed superscript selects one sample.', 'One row holds every measured gene for that cell.', { see: ['The bracketed i names the sample. It is not a power.', 'The selected row has three entries.'], read: ['The membership sign means “belongs to”. Real space of dimension d means lists of d real numbers.'] }),
    step('A colon selects every row.', 'One column holds the same gene across cells.', { see: ['The colon means every index in that position.', 'Column 3 contains 3.4, 2.9, 0.5 and 0.7.'] }),
    step('The whole table has a shape.', 'Capital X names the whole table.', { see: ['N counts samples: four cells.', 'd counts features: three genes.'], read: ['Read the shape as rows by columns.', 'Some papers put samples in columns; check their definition.'] }),
  ],
  draw(g, k, t, p) {
    const i = p.i - 1, j = p.j - 1, D = Proff.calcRungs().use;
    const rows = X1.map((_, r) => `cell ${r + 1}`), cols = ['gene 1', 'gene 2', 'gene 3'];
    const m = Proff.matrixMetrics(X1, { cw: D.cw, ch: D.ch, lock: true, size: D.size, fmt: f1, title: 'Expression', rows, cols });
    const regionR = RX - 48, block = m.lab + m.w;
    const x = Math.max(m.lab + 8, (regionR - block) / 2 + m.lab);
    const y = (675 - m.top - m.h) / 2 + m.top;
    const hit = (a, b) => k === 0 ? a === i && b === j : k === 1 ? a === i : k === 2 ? b === j : true;
    const M = g.matrix(x, y, X1, { cw: D.cw, ch: D.ch, lock: true, size: D.size, fmt: f1, title: 'Expression', rows, cols, state: (a, b) => hit(a, b) ? 'read' : 'input', colFill: c => (k === 0 || k === 2) && c === j ? 'c2' : 'muted' });
    if (k === 0 || k === 2) { const c = M.pos(0, j); g.rect(c.x + 10, c.y - 8, c.tw - 20, 3, { fill: 'c2', r: 1.5, stroke: 'none', free: true, deco: true }); }
    const row = X1[i].map(f1).join(',\\,'), col = X1.map(r => f1(r[j])).join(',\\,');
    const lines = [
      [`x_{${p.i}${p.j}}=${f1(X1[i][j])}`],
      [`x^{(${p.i})}=[${row}]`, '\\in\\mathbb{R}^{d}'],
      [`x_{:,${p.j}}=[${col}]`],
      ['X\\in\\mathbb{R}^{N\\times d}', 'N\\times d=4\\times 3'],
    ][k];
    const mid = y + m.h / 2, y0 = mid - (lines.length - 1) * 46;
    const formulaX = x + m.w - m.gp + 48;
    lines.forEach((s, n) => math(g, formulaX, y0 + n * 92, s));
  }
});

const QS = p => [P0[0], .6, p.q3, .9, .5];
Proff.scene({
  title: 'Batch loss averages individual losses.', h: 675,
  controls: [{ name: 'q3', label: 'q for sample 3', min: .05, max: .95, step: .05, value: .3 }],
  steps: [
    step('Lower probability gives greater loss.', 'Each bar is one sample’s loss.', { see: ['q is the probability given to the true class.', 'Little ell names one sample’s loss.', 'Minus natural log turns a probability near one into a loss near zero.'], try: 'Raise q for sample 3.' }),
    step('Sigma adds the individual losses.', 'The tower adds all five bars.', { see: ['Sigma means add the terms.', 'The index starts at one and ends at N, the sample count.'], read: ['The tower and the five separate bars hold the same total.'] }),
    step('Dividing by N gives the average.', 'Capital L names the batch loss.', { see: ['Divide the sum by the five samples.', 'The dashed line is the average height.'], read: ['An average keeps the loss comparable across batch sizes.'] }),
  ],
  draw(g, k, t, p) {
    const q = QS(p), l = q.map(v => -Math.log(v)), S = l.reduce((a, b) => a + b, 0);
    const ax = plot(g, { xd: [.4, 7], yd: [0, 6], xt: [1, 2, 3, 4, 5], yt: [0, 2, 4, 6], xl: 'sample', yl: 'loss (nats)' });
    l.forEach((v, i) => bar(g, ax, i + 1, v, 60, k === 0 && i === 2));
    if (k >= 1) { let acc = 0; l.forEach(v => { g.rect(ax.sx(6.3) - 36, ax.sy(acc + v), 72, ax.sy(acc) - ax.sy(acc + v), { fill: 'surf2', stroke: 'muted', sw: 2 }); acc += v; }); }
    if (k === 2) g.line(ax.x, ax.sy(S / 5), ax.sx(5.6), ax.sy(S / 5), { stroke: 'ink', sw: 3, dash: true });
    math(g, RX, 150, ['\\ell_i=−\\ln q_i', '\\sum_{i=1}^{N}\\ell_i', 'L=\\frac{1}{N}\\sum_{i=1}^{N}\\ell_i'][k]);
    g.note(RX, 458, ['sample 3 loss', 'total loss', 'mean loss'][k]);
    g.hero(RX, 538, f2(k === 0 ? l[2] : k === 1 ? S : S / 5), { anchor: 'start', size: 72 });
  }
});

// The q slider stays on the bars. A calc trace is static, so this is the default q = 0.30 worked example.
const QDEF = [P0[0], .6, .3, .9, .5], LDEF = QDEF.map(v => -Math.log(v));
const lossAt = Proff.scenes.length;
Proff.calc({
  index: { i: 'sample', j: 'sample' }, warn: [],
  tensors: {
    q: { data: [QDEF], disp: [QDEF.map(f2)], rows: null, cols: ['first', 'second', 'third', 'fourth', 'fifth'], label: 'Probabilities', unit: '', sym: 'q' },
    ell: { data: [LDEF], disp: [LDEF.map(f2)], rows: null, cols: ['first', 'second', 'third', 'fourth', 'fifth'], label: 'Losses', unit: '', sym: '\\ell' },
  },
  steps: [{
    op: 'map', title: 'Logs turn products into sums.', cap: 'Each loss is minus the log of that probability.',
    layout: [{ t: 'q' }, '−ln', { t: 'ell' }], out: 'ell', tex: '\\ell_i=-\\ln q_i', expand: 1,
    cells: QDEF.map((v, j) => ({ out: [0, j], reads: [['q', 0, j]], expr: [['−ln(', null], [f2(v), 'q'], [') = ', null], [f2(LDEF[j]), 'ell']] })),
  }],
});
Proff.scenes[lossAt].info = {
  read: ['Minus the log turns a product of probabilities into a sum of losses.', 'These five probabilities multiply to 0.072.'],
  notation: {
    '\\ell_i': ['loss of one sample', 'first = 0.12'],
    '-\\ln q_i': ['minus the natural log of that probability', '−ln 0.30 = 1.20'],
    '\\prod_i q_i': ['product of the probabilities', '0.072'],
    '\\sum_i\\ell_i': ['sum of those losses', '2.64'],
  },
};
Proff.scenes[lossAt].steps.forEach(s => { s.cap = 'Each loss is minus the log of that probability.'; });

Proff.scene({
  title: 'Softmax makes probabilities sum to one.', h: 675,
  controls: [{ name: 'tau', label: 'temperature τ', min: .7, max: 3, step: .1, value: 1 }],
  steps: [
    step('Logits are raw class scores.', 'The later forward pass supplies these scores.', { see: ['z names a raw class score, called a logit.', 'k selects the class.', 'Temperature divides every score by the same positive number.'], try: 'Raise temperature to flatten the probabilities.' }),
    step('Exponentiation makes every score positive.', 'Raise e to each scaled score.', { see: ['e is the natural exponential base, about 2.718.', 'The largest score becomes the largest positive value.'], read: ['These values still need dividing by their total.'] }),
    step('Dividing by the total gives probabilities.', 'The three probabilities add to one.', { see: ['p is a class probability.', 'The denominator adds the exponential values across all classes.', 'Sigma means add; j visits every class.'] }),
    step('Argmax names the winning class.', 'The indicator is one for a correct prediction.', { see: ['Argmax gives the class with the largest probability.', 'A hat marks the model’s prediction.', 'The indicator is one when prediction equals truth, otherwise zero.'], read: ['Tumour is the true class here.', 'Positive temperature preserves the winning class.'] }),
  ],
  draw(g, k, t, p) {
    const z = LOGITS.map(v => v / p.tau), e = z.map(Math.exp), pr = softmax(LOGITS, p.tau), Z = e.reduce((a, b) => a + b, 0);
    const vals = k === 0 ? z : k === 1 ? e : pr;
    const ax = plot(g, { xd: [.4, 3.6], yd: k === 0 ? [-1.5, 4.2] : k === 1 ? [0, 34] : [0, 1], xt: [1, 2, 3], fmtx: v => CLASSES[v - 1], yt: k === 0 ? [-1, 0, 1, 2, 3, 4] : k === 1 ? [0, 10, 20, 30] : [0, .5, 1], yl: k === 0 ? 'scaled score' : k === 1 ? 'exponential' : 'probability' });
    vals.forEach((v, i) => bar(g, ax, i + 1, v, 110, k === 3 && i === 0));
    math(g, RX, 145, ['z_k/\\tau', 'e^{z_k/\\tau}', 'p_k=\\frac{e^{z_k/\\tau}}{\\sum_j e^{z_j/\\tau}}', '\\hat y=\\arg\\max_k p_k'][k], 275);
    if (k === 0) { CLASSES.forEach((c, i) => g.note(RX, 260 + i * 60, `${c} ${Proff.pretty(f2(vals[i]))}`)); }
    else if (k === 1) { g.note(RX, 458, 'exponential total'); g.hero(RX, 538, f2(Z), { anchor: 'start' }); }
    else { if (k === 3) math(g, RX, 290, '\\mathbb{1}[\\hat y=y]', 270); g.note(RX, 458, k === 2 ? 'probability total' : 'correct indicator'); g.hero(RX, 538, k === 2 ? f2(pr.reduce((a, b) => a + b, 0)) : '1', { anchor: 'start', size: 72 }); }
  }
});

const PT = [.7, .2, .1];
const ent = d => -d.reduce((a, v) => a + (v ? v * Math.log(v) : 0), 0);
const Q4 = p => softmax([p.zA, LOGITS[1], LOGITS[2]]);
Proff.scene({
  title: 'Cross-entropy measures disagreement between distributions.', h: 675,
  controls: [{ name: 'zA', label: 'tumour logit z₁', min: -1, max: 5, step: .25, value: LOGITS[0] }, { type: 'button', name: 'reseed', label: 'new draws' }],
  steps: [
    step('Labels and models give different distributions.', 'Open circles show labels; filled circles show the model.', { see: ['p is the annotators’ class distribution.', 'q is the model’s class distribution for the given input.', 'A vertical bar means given; theta names the model’s learned parameters.'], try: 'Change the tumour logit.' }),
    step('Cross-entropy averages the model’s surprise.', 'Each bar is one class’s contribution.', { see: ['Minus natural log of q is surprise.', 'Multiply by p, then add across classes.', 'H of p and q names cross-entropy.'], read: ['The probabilities p supply the averaging weights.'] }),
    step('KL measures extra surprise above entropy.', 'Subtract the entropy of p from cross-entropy.', { see: ['Entropy is the surprise of p itself.', 'Kullback–Leibler divergence (KL) is the extra surprise from using q.', 'Individual class contributions can be negative; their total cannot.'], read: ['The double bar separates distributions.', 'Reversing p and q usually changes KL.'] }),
    step('Repeated draws estimate the expected loss.', 'Each point is the surprise of one random draw.', { see: ['The sampling sign means drawn from p.', 'Expectation means the long-run average over those draws.', 'The dashed line is the exact cross-entropy.'], read: ['The mean of 24 draws varies around that line.'], try: 'Press new draws.' }),
  ],
  draw(g, k, t, p, s) {
    const q = Q4(p), cet = PT.map((v, i) => -v * Math.log(q[i])), klt = PT.map((v, i) => v * Math.log(v / q[i]));
    const ce = cet.reduce((a, b) => a + b, 0), hp = ent(PT), kl = ce - hp;
    if (k < 3) {
      const ax = plot(g, { xd: [.4, 3.6], yd: k === 0 ? [0, 1] : k === 1 ? [0, 1.5] : [-.5, 1.5], xt: [1, 2, 3], fmtx: v => CLASSES[v - 1], yt: k === 0 ? [0, .5, 1] : k === 1 ? [0, .5, 1, 1.5] : [-.5, 0, .5, 1, 1.5], yl: k === 0 ? 'probability' : 'contribution (nats)' });
      if (k === 0) {
        PT.forEach((v, i) => ax.pt(i + 1 - .12, v, { r: 8, fill: 'fig', stroke: 'muted', sw: 3 }));
        q.forEach((v, i) => ax.pt(i + 1 + .12, v, { r: 8, fill: 'ink' }));
        g.circle(908, 120, 8, { fill: 'fig', stroke: 'muted', sw: 3 }); g.note(930, 120, 'labels');
        g.circle(908, 165, 8, { fill: 'ink' }); g.note(930, 165, 'model');
        math(g, RX, 260, 'p(y)'); math(g, RX, 370, 'p_\\theta(y\\mid x)');
      } else {
        (k === 1 ? cet : klt).forEach((v, i) => bar(g, ax, i + 1, v, 110));
        if (k === 2) g.line(ax.x, ax.sy(0), ax.x + ax.w, ax.sy(0), { stroke: 'muted', sw: 2 });
        math(g, RX, 145, k === 1 ? '−p_k\\ln q_k' : 'p_k\\ln(p_k/q_k)', 280);
        if (k === 2) g.note(RX, 290, `${f2(ce)} − ${f2(hp)}`);
        g.note(RX, 458, k === 1 ? 'cross-entropy' : 'KL divergence');
        g.hero(RX, 538, f2(k === 1 ? ce : kl), { anchor: 'start', size: 72 });
      }
    } else {
      const ax = plot(g, { xd: [0, 25], yd: [-.2, 8], xt: [1, 5, 10, 15, 20, 24], yt: [0, 2, 4, 6, 8], xl: 'draw number', yl: 'surprise (nats)' });
      const r = Proff.rng(s.seed), ys = [];
      for (let n = 0; n < 24; n++) { const u = r(); ys.push(u < PT[0] ? 0 : u < PT[0] + PT[1] ? 1 : 2); }
      const ls = ys.map(y => -Math.log(q[y])), m = ls.reduce((a, b) => a + b, 0) / ls.length;
      g.line(ax.x, ax.sy(ce), ax.x + ax.w, ax.sy(ce), { stroke: 'ink', sw: 3, dash: true });
      ls.forEach((v, n) => ax.pt(n + 1, v, { r: 8, fill: 'ink' }));
      math(g, RX, 145, '\\mathbb{E}_{y\\sim p}[−\\ln q(y)]', 280);
      g.note(RX, 290, `exact H ${f2(ce)}`);
      g.note(RX, 458, 'draw mean'); g.hero(RX, 538, f2(m), { anchor: 'start', size: 72 });
    }
  }
});

const Lf = th => .5 * (th - 2) ** 2 + .3, dLf = th => th - 2, TH0 = -.5;
Proff.scene({
  title: 'Gradients guide each downhill step.', h: 675,
  controls: [{ name: 'eta', label: 'learning rate η', min: .1, max: 1.9, step: .1, value: .4 }],
  steps: [
    step('The gradient gives the local slope.', 'The dashed tangent measures the slope at the starting point.', { see: ['Theta is one model parameter.', 'The gradient gives the slope of loss as theta changes.', 'With many parameters, it lists one slope for each.'], read: ['The starting slope is −2.5.'] }),
    step('The update moves against that slope.', 'Learning rate times slope sets the change.', { see: ['Eta is the learning rate.', 'The next value equals the current value minus eta times the gradient.', 'A negative slope therefore moves theta right.'], try: 'Change the learning rate.' }),
    step('Repeated updates approach the minimum.', 'The connected points show six updates.', { see: ['A bracketed superscript counts updates.', 'Small learning rates move slowly.', 'Rates near two overshoot and alternate sides.'], read: ['Above two, this particular quadratic would diverge.'] }),
    step('The estimate and optimum can differ.', 'The star marks the optimum; the hat marks the stopped estimate.', { see: ['A star names the best possible parameter.', 'A hat names the estimate after training stops.', 'Argmin gives the parameter where loss is smallest, rather than that loss value.'], read: ['Here the optimum is two.'] }),
  ],
  draw(g, k, t, p) {
    const ax = plot(g, { xd: [-1.5, 5.5], yd: [0, 7], xt: [-1, 0, 1, 2, 3, 4, 5], yt: [0, 2, 4, 6], xl: '\\theta', yl: 'loss' });
    g.curve(Lf, ax, -1.5, 5.5, { stroke: 'ink', sw: 3 });
    const path = [TH0]; for (let n = 0; n < 6; n++) path.push(path[n] - p.eta * dLf(path[n]));
    const pt = (th, answer = false) => ax.pt(th, Lf(th), { r: 8, fill: answer ? 'c2' : 'ink', stroke: 'fig', sw: 2 });
    if (k === 0) {
      const sl = dLf(TH0);
      g.line(ax.sx(TH0 - 1), ax.sy(Lf(TH0) - sl), ax.sx(TH0 + 1), ax.sy(Lf(TH0) + sl), { stroke: 'muted', sw: 3, dash: true }); pt(TH0, true);
      math(g, RX, 145, '\\nabla_\\theta L=\\frac{dL}{d\\theta}', 270);
      math(g, RX, 290, '\\theta^{(0)}=−0.5', 270);
      g.note(RX, 458, 'starting slope'); g.hero(RX, 538, f1(sl), { anchor: 'start', size: 72 });
    } else {
      const n = k === 1 ? 1 : 6;
      for (let i = 1; i <= n; i++) g.line(ax.sx(path[i - 1]), ax.sy(Lf(path[i - 1])), ax.sx(path[i]), ax.sy(Lf(path[i])), { stroke: 'muted', sw: 3, dash: true });
      path.slice(0, n + 1).forEach((th, i) => pt(th, i === n));
      if (k === 1) { math(g, RX, 180, '\\theta^{(t+1)} =', 250); math(g, RX, 250, '\\theta^{(t)}−\\eta\\nabla_\\theta L', 270); }
      if (k === 2) math(g, RX, 145, '\\theta^{(0)}\\to\\theta^{(6)}', 270);
      if (k === 3) { const x = ax.sx(2), y = ax.sy(Lf(2)); g.poly(Array.from({ length: 10 }, (_, i) => { const a = -Math.PI / 2 + i * Math.PI / 5, r = i % 2 ? 7 : 16; return [x + r * Math.cos(a), y + r * Math.sin(a)]; }), { close: true, fill: 'fig', stroke: 'muted', sw: 3 }); math(g, RX, 120, '\\theta^{*}=\\arg\\min_\\theta L'); math(g, RX, 250, '\\theta^{*}=2'); math(g, RX, 360, '\\hat\\theta=\\theta^{(6)}'); }
      g.note(RX, 458, k === 1 ? 'next parameter' : 'stopped estimate'); g.hero(RX, 538, f2(path[n]), { anchor: 'start', size: 72 });
    }
  }
});

const X6 = 1.5, B6 = .5, Y6 = 1, sig = z => 1 / (1 + Math.exp(-z));
Proff.scene({
  title: 'Local slopes multiply along the graph.', h: 675,
  controls: [{ name: 'w', label: 'weight w', min: -2, max: 2, step: .1, value: .8 }],
  steps: [
    step('The forward pass carries values right.', 'Weight, weighted input, prediction, then loss.', { see: ['Multiply w by input 1.5, then add bias 0.5 to get z.', 'The sigmoid turns z into a prediction between zero and one.', 'Squared distance from target one gives loss L.'], try: 'Change weight w.' }),
    step('Start with the loss’s local slope.', 'Read the first slope backwards from the loss.', { see: ['A partial derivative measures change in one input while other inputs stay fixed.', 'For squared error, the loss slope is twice prediction minus target.'] }),
    step('Multiply by the sigmoid’s local slope.', 'The chain rule combines the two local slopes.', { see: ['The sigmoid slope is prediction times one minus prediction.', 'Multiplying gives the loss slope with respect to z.'], read: ['A saturated sigmoid has a small slope, so it passes back a small gradient.'] }),
    step('The input completes the weight gradient.', 'Multiply by the input to reach the weight.', { see: ['Since z equals w times input plus bias, its slope with respect to w is the input.', 'Multiply all three slopes for the weight gradient.'], read: ['The negative gradient means increasing w lowers loss here.'] }),
  ],
  draw(g, k, t, p) {
    const D = Proff.calcRungs().use;
    const w = p.w, z = w * X6 + B6, yh = sig(z), L = (yh - Y6) ** 2, dLy = 2 * (yh - Y6), dyz = yh * (1 - yh);
    const n = k === 0 ? 4 : k, gap = 56;
    const titles = k === 0 ? ['weight', 'sum', 'prediction', 'loss'] : ['loss slope', 'sigmoid', 'input'].slice(0, k);
    const vals = k === 0 ? [w, z, yh, L] : [dLy, dyz, X6].slice(0, k);
    const fmts = k === 0 ? [f2, f2, f2, f3] : [f3, f3, f2];
    const m = Proff.matrixMetrics([[0]], { cw: D.cw, ch: D.ch, lock: true, size: D.size, title: titles[0], cols: [''] });
    const chainW = n * D.cw + (n - 1) * gap, regionR = RX - 48;
    const x0 = Math.max(8, (regionR - chainW) / 2);
    const y = (675 - m.top - m.h) / 2 + m.top, cy = y + (D.ch - 4) / 2;
    for (let i = 0; i < n; i++) {
      const x = x0 + i * (D.cw + gap);
      g.matrix(x, y, [[vals[i]]], { cw: D.cw, ch: D.ch, lock: true, size: D.size, title: titles[i], cols: [''], fmt: fmts[i], state: (k === 0 && i === 3) || (k === 1 && i === 0) ? 'active' : 'input' });
      if (i < n - 1) {
        const x1 = x + D.cw - 4, x2 = x + D.cw + gap;
        if (k === 0) g.arrow(x1 + 8, cy, x2 - 8, cy, { stroke: 'muted', sw: 3 });
        else g.note((x1 + x2) / 2, cy, '×', { anchor: 'middle', fill: 'muted', size: 30 });
      }
    }
    math(g, RX, cy, ['w \\to z \\to \\hat{y} \\to L', '\\frac{\\partial L}{\\partial \\hat{y}}', '\\frac{\\partial L}{\\partial z}', '\\frac{\\partial L}{\\partial w}'][k]);
    g.note(RX, 458, ['loss', 'loss slope', 'slope at z', 'weight gradient'][k]);
    g.hero(RX, 538, f3(k === 0 ? L : k === 1 ? dLy : k === 2 ? dLy * dyz : dLy * dyz * X6), { anchor: 'start', size: 72 });
  }
});

// Definitions stay beside the scene they explain, with one concrete example each.
const definitions = [
  [
    [['x_{ij}', 'entry in row i, column j', 'cell 2, gene 3 = 2.9'], ['i, j', 'row and column indices', 'i = 2, j = 3']],
    [['x^{(i)}', 'whole sample; bracketed i is a label', 'sample 2 = [4.8, 0.1, 2.9]'], ['\\in\\mathbb{R}^{d}', 'belongs to lists of d real numbers', 'd = 3 genes']],
    [['x_{:,j}', 'every row of column j; colon means all', 'gene 3 = [3.4, 2.9, 0.5, 0.7]']],
    [['X', 'whole table', 'four rows, three columns'], ['N\\times d', 'sample count by feature count', '4 × 3']]
  ],
  [
    [['\\ell_i', 'loss of sample i', 'sample 3 = 1.20'], ['−\\ln q_i', 'minus natural log of true-class probability', '−ln 0.30 = 1.20']],
    [['\\sum_{i=1}^{N}', 'add each sample, from one to N', 'five losses total 2.64'], ['\\ell_i', 'one sample’s loss', 'sample 3 = 1.20']],
    [['L', 'average loss across samples', '2.64 ÷ 5 = 0.53'], ['\\frac{1}{N}\\sum_i', 'add, then divide by sample count', 'N = 5']]
  ],
  [
    [['z_k', 'raw score of class k, called a logit', 'tumour = 2.25'], ['\\tau', 'temperature dividing every score', 'one leaves scores unchanged']],
    [['e^{z_k/\\tau}', 'e raised to the scaled score', 'e to 2.25 = 9.49']],
    [['p_k', 'probability of class k', 'tumour = 0.88'], ['\\sum_j e^{z_j/\\tau}', 'add exponentials across all classes j', 'total = 10.74']],
    [['\\arg\\max_k p_k', 'class with the largest probability', 'tumour'], ['\\hat y', 'model prediction; a hat marks an estimate', 'tumour'], ['\\mathbb{1}[\\hat y=y]', 'one if prediction matches truth, otherwise zero', 'one here']]
  ],
  [
    [['p(y)', 'label distribution over classes', 'tumour = 0.70'], ['p_\\theta(y\\mid x)', 'model probability given input x; theta names parameters', 'tumour = 0.88']],
    [['−p_k\\ln q_k', 'class probability times model surprise', 'tumour contributes 0.09'], ['H(p,q)', 'cross-entropy: total weighted surprise', '0.92']],
    [['D_{\\mathrm{KL}}(p\\|q)', 'extra surprise above entropy; bars separate distributions', '0.92 − 0.80 = 0.12'], ['p_k\\ln(p_k/q_k)', 'one class’s contribution; may be negative', 'tumour = −0.16']],
    [['\\mathbb{E}_{y\\sim p}', 'long-run average over draws y from p', 'exact cross-entropy = 0.92'], ['−\\ln q(y)', 'model surprise for the drawn class', 'tumour surprise = 0.12']]
  ],
  [
    [['\\nabla_\\theta L', 'gradient: loss slope as parameter theta changes', 'starting slope = −2.5'], ['\\theta^{(0)}', 'parameter before any update', '−0.5']],
    [['\\theta^{(t+1)}', 'next parameter value; t counts updates', 'first update gives 0.50'], ['\\eta', 'learning rate: step size multiplying the slope', '0.4']],
    [['\\theta^{(t)}', 'parameter after t updates', 'after six updates: 1.88']],
    [['\\theta^*', 'optimal parameter', '2'], ['\\arg\\min_\\theta L', 'parameter where loss is smallest', '2'], ['\\hat\\theta', 'stopped estimate', '1.88 after six updates']]
  ],
  [
    [['w, z', 'weight; z equals weight times input 1.5 plus bias 0.5', 'w = 0.80, z = 1.70'], ['\\hat y, L', 'sigmoid prediction, then squared error against target one', 'prediction = 0.85, loss = 0.024']],
    [['\\frac{\\partial L}{\\partial\\hat y}', 'loss slope when only prediction changes', '2 × (0.85 − 1) ≈ −0.309']],
    [['\\frac{\\partial\\hat y}{\\partial z}', 'sigmoid slope', '0.131'], ['\\frac{\\partial L}{\\partial z}', 'product of the two local slopes', '−0.309 × 0.131 ≈ −0.040']],
    [['\\frac{\\partial z}{\\partial w}', 'input: slope of weighted input along w', '1.50'], ['\\frac{\\partial L}{\\partial w}', 'all three local slopes multiplied', '−0.061']]
  ]
];
const defScene = [0, 1, 3, 4, 5, 6];
definitions.forEach((sc, i) => sc.forEach((rows, k) => {
  const st = Proff.scenes[defScene[i]].steps[k], old = st.info;
  st.info = { notation: Object.fromEntries(rows.map(([sym, meaning, example]) => [sym, [meaning, example]])), try: old.try };
  if (i === 4 && k === 2) st.info.read = ['Rates near two zig-zag; above two this quadratic diverges.'];
}));

// The frozen calc engine owns geometry, graphite shading, pacing and inspection.
const forwardTrace = structuredClone(PROFF_DATA.forward), attentionTrace = structuredClone(PROFF_DATA.attn);
const traceClaims = [
  ['Inputs determine the hidden layer.', 'Weights combine the input entries.', 'Bias shifts each weighted sum.', 'ReLU keeps the positive values.', 'The hidden layer feeds the output.', 'Output weights combine hidden values.', 'Bias shifts the final logits.'],
  ['Tokens carry queries, keys, and values.', 'Transposing turns key rows into columns.', 'Query-key products measure each match.', 'Scaling controls the score magnitude.', 'Exponentiation makes every score positive.', 'Row totals give the denominator.', 'Attention weights sum to one.', 'Weights mix the value vectors.']
];
const tensorLabels = {
  x: 'Input', W1: 'Hidden weights', b1: 'Bias', a1: 'Sums', z1: 'Pre-ReLU', h1: 'Hidden', W2: 'Output weights', b2: 'Bias', a2: 'Sums', z2: 'Logits',
  Q: 'Queries', K: 'Keys', V: 'Values', Kt: 'Transposed keys', S: 'Match scores', Sc: 'Scaled scores', E: 'Exponentials', Z: 'Row total', A: 'Attention weights', O: 'Mixed values'
};
const calcInfo = [
  [
    ['Three inputs feed four hidden units. Each unit has three weights and one bias.', 'A bracketed superscript names the layer, never a power.'],
    ['Multiply one weight row by the input column, then add.', 'Matching inner dimensions disappear: four by three times three by one gives four by one.'],
    ['Add the bias for the same unit.', 'The bias shifts the weighted sum before activation.'],
    ['Rectified linear unit (ReLU) keeps positive values and replaces negative values with zero.', 'Here sigma names this activation, not the sigmoid used earlier.'],
    ['The hidden output becomes the next layer’s input.', 'New weights connect four hidden units to three classes.'],
    ['Multiply one output-weight row by the hidden output, then add.', 'Silent hidden units contribute zero.'],
    ['Add the output bias to obtain raw class scores, called logits.', 'Read nested formulas inside out: hidden weighted sum, bias, ReLU, output weighted sum, output bias.']
  ],
  [
    ['Each amino-acid token has a query, key and value with two entries.', 'A query asks, a key matches, and a value supplies what gets passed on.'],
    ['Transpose swaps rows and columns.', 'Each token’s key becomes a column, ready for a query-key product.'],
    ['Multiply a query row by each transposed-key column, then add.', 'Each score measures that query’s match with one key.'],
    ['Divide by the square root of the key length: square root of two.', 'Scaling counters growth in dot products with key length.'],
    ['Raise e to each scaled score.', 'All values become positive; larger scores produce larger exponentials.'],
    ['Sigma means add across the keys in that row.', 'The row total will be the softmax denominator.'],
    ['Divide every exponential by its own row total.', 'These attention weights sum to one in each row. Exponentiation followed by this division is softmax.'],
    ['Multiply an attention-weight row by the value rows and add.', 'The output is a weighted mixture. Read the nested formula inside out: query-key products, scaling, row softmax, value mixture.']
  ]
];
const calcNotation = [
  [
    { 'W^{(1)}': ['hidden-layer weights', 'unit u1: [1, 0, 1]'], 'b^{(1)}': ['hidden-layer bias', 'unit u1: 0.5'] },
    { 'a^{(1)}=W^{(1)}x': ['weighted sum for each hidden unit', 'unit u1 = 3'] },
    { 'z^{(1)}=a^{(1)}+b^{(1)}': ['weighted sum plus bias', 'unit u1: 3 + 0.5 = 3.5'] },
    { '\\sigma(u)': ['activation, here ReLU', 'max(0, −1.5) = 0'] },
    { 'W^{(2)}': ['output-layer weights', 'tumour, unit u1 = 0.5'], 'b^{(2)}': ['output-layer bias', 'stroma = 0.5'] },
    { 'a^{(2)}=W^{(2)}h^{(1)}': ['output weighted sum from hidden values', 'tumour = 2.25'] },
    { 'z^{(2)}': ['logits: output scores after bias', 'tumour = 2.25'] }
  ],
  [
    { Q: ['queries', 'Met: [1, 0]'], K: ['keys', 'Lys: [0, 1]'], V: ['values', 'Leu: [1, 1]'] },
    { 'K^{\\top}': ['transposed keys', 'Lys becomes column 2'] },
    { 'S=QK^{\\top}': ['query-key match scores', 'Met with Met = 1'] },
    { '\\sqrt{d_k}': ['square root of the key length', '√2 ≈ 1.414'] },
    { 'E=e^{S\u2032}': ['e raised to each scaled score', 'Met with Met ≈ 2.03'] },
    { 'Z_i=\\sum_j E_{ij}': ['row total; j visits each key', 'Met row ≈ 5.06'] },
    { 'A_{ij}=E_{ij}/Z_i': ['attention weight from query i to key j', 'Met with Met ≈ 0.401'] },
    { 'O=AV': ['attention weights mix value vectors', 'Met output ≈ [1.203, 0.797]'] }
  ]
];
[forwardTrace, attentionTrace].forEach((tr, q) => {
  Object.entries(tr.tensors).forEach(([id, T]) => { T.label = tensorLabels[id]; T.unit = ''; if (T.data[0].length === 1) T.cols = ['']; });
  tr.steps.forEach((st, i) => { st.title = traceClaims[q][i]; st.expand = st.cells.length ? 1 : 0; st.cap = calcInfo[q][i][0]; if (st.op === 'transpose') st.cells = st.cells.map(c => ({ ...c, expr: [['rows ↔ columns', null]] })); });
  const first = Proff.scenes.length;
  Proff.calc(tr);
  // Replace repeated generated symbol tables with short, step-specific plain-language points.
  Proff.scenes.slice(first).forEach((scene, i) => { scene.info = { read: calcInfo[q][i].slice(1), notation: calcNotation[q][i] }; scene.steps.forEach(s => { s.cap = calcInfo[q][i][0]; }); });
});
