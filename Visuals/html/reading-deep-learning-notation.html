<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reading deep-learning notation</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.css"><script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.js"></script>
<style>/* Proff visual kit. BlockFrame chrome (thick borders, hard offset shadows, heavy Inter, Space Grotesk labels)
   around clean figures. Dark only. Every colour is a token. Authors never edit this file. */
:root,[data-theme=dark]{   /* default palette "blockframe": the Block Frame pastels (frontend-slides, MIT) on black, with quiet grey frames.
     Tuned for dark: blue made more saturated so it is not read as text; yellow deepened a touch to separate it from cream.
     c2 and c5 are both warm and light: never let them carry a contrast alone (add a label, dash, or shape). */
  --bg:#0b0b0c;--fig:#121214;--surf:#18181b;--surf2:#232327;--line:#5a5a63;--line-dim:#2c2c31;--grid:#232327;
  --ink:#fffdf5;--muted:#a9a9b2;--dim:#6e6e76;--on:#000000;
  --c1:#8feaf7;--c2:#f5c030;--c3:#fe90e8;--c4:#99e885;--c5:#ffdc8b;--c6:#b7b4c7;--mix:20%;
}
[data-palette=lab][data-theme=dark]{   /* preset "lab": Okabe-Ito hues */
  --bg:#0e1116;--fig:#12161c;--surf:#171c23;--surf2:#1e242d;--line:#e8ecf2;--line-dim:#343c48;--grid:#222934;
  --ink:#eef2f7;--muted:#9aa5b5;--dim:#6a7584;--on:#0e1116;
  --c1:#5cb8f0;--c2:#f0b43c;--c3:#f2694a;--c4:#3ccf9e;--c5:#c98ae6;--c6:#cfdc5a;--mix:22%;
}
/* palette "neon" (the original proff look): Proff.page({palette:'neon'}) */
[data-palette=neon][data-theme=dark]{--bg:#0a0a0b;--fig:#111113;--surf:#161618;--surf2:#1d1d20;--line:#ececee;--line-dim:#3a3a3f;--grid:#26262b;
  --ink:#f4f4f5;--muted:#a1a1aa;--dim:#6b6b72;--on:#0a0a0b;--c1:#56c2ff;--c2:#ffc531;--c3:#ff6363;--c4:#59d499;--c5:#b98cff;--c6:#ff8f4a}
/* soft fills are mixed where data-theme is set, so they follow the live palette (a :root-only rule would freeze them to dark) */
:root,[data-theme]{--f-disp:'Inter',system-ui,-apple-system,sans-serif;--f-mono:'Space Grotesk',ui-monospace,Menlo,monospace;
  --f1:color-mix(in srgb,var(--c1) var(--mix),var(--fig));--f2:color-mix(in srgb,var(--c2) var(--mix),var(--fig));
  --f3:color-mix(in srgb,var(--c3) var(--mix),var(--fig));--f4:color-mix(in srgb,var(--c4) var(--mix),var(--fig));
  --f5:color-mix(in srgb,var(--c5) var(--mix),var(--fig));--f6:color-mix(in srgb,var(--c6) var(--mix),var(--fig));
  --acc:var(--c1);--stage-w:min(1240px,calc(100vw - 32px))}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:var(--f-disp);font-size:18px;line-height:1.55;-webkit-font-smoothing:antialiased;
  padding:28px 16px 64px;transition:background .2s,color .2s}
b,strong{font-weight:700}
code,.mono{font-family:var(--f-mono);font-size:.92em}
a{color:var(--c1)}

/* header: compact so the stage owns the screen */
.top{max-width:var(--stage-w);margin:0 auto 22px;display:flex;align-items:flex-end;gap:20px;flex-wrap:wrap;
  border-bottom:3px solid var(--line);padding-bottom:16px}
.top .tx{flex:1;min-width:260px}
.eyebrow{display:inline-block;font-family:var(--f-mono);font-weight:700;font-size:12px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--on);background:var(--acc);border:2px solid var(--line);box-shadow:3px 3px 0 var(--line);padding:3px 10px;margin-bottom:12px}
h1{font-size:clamp(26px,3.4vw,40px);font-weight:900;text-transform:uppercase;letter-spacing:-.025em;line-height:1}
.sub{font-family:var(--f-mono);font-size:14px;color:var(--muted);margin-top:8px}.sub::before{content:"// ";color:var(--acc)}

/* the stage card: the figure is the hero */
.card{position:relative;max-width:var(--stage-w);margin:0 auto 40px;background:var(--surf);border:3px solid var(--line);
  box-shadow:8px 8px 0 var(--acc);padding:20px 22px 18px}
.head{display:flex;align-items:baseline;gap:14px;min-height:34px;padding-right:44px;margin-bottom:12px}
.phase{font:700 11px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--on);background:var(--acc);border:2px solid var(--line);padding:2px 8px;white-space:nowrap}
.stitle{font-size:clamp(18px,2vw,24px);font-weight:850;letter-spacing:-.01em;line-height:1.15}
.fig{position:relative;background:var(--fig);border:2px solid var(--line);overflow:hidden}
.fig svg,.fig canvas{display:block;width:100%;height:auto;max-height:70vh;margin:0 auto}
.fig svg text{font-family:var(--f-disp)}
.fig svg .mono{font-family:var(--f-mono)}
.ib{position:absolute;top:16px;right:18px;width:32px;height:32px;border:2px solid var(--line);background:var(--acc);color:var(--on);
  font:900 15px var(--f-mono);cursor:pointer;box-shadow:3px 3px 0 var(--line)}
.ib[aria-expanded=true]{background:var(--line);color:var(--bg)}

/* figure + step strip: the strip is the figure's bottom edge; chevrons appear on the figure's sides on hover */
.figwrap{position:relative}
.strip{position:relative;display:flex;gap:10px;margin-top:6px;height:14px;align-items:flex-start}
.sg{display:flex;gap:3px;min-width:0}
.seg{flex:1;min-width:6px;height:4px;padding:0;border:0;background:var(--line-dim);cursor:pointer;position:relative;transition:height .15s}
.seg::after{content:"";position:absolute;inset:-6px 0}   /* bigger hit area */
.seg i{display:block;height:100%;width:0;background:var(--acc)}
.strip:hover .seg{height:8px}
.seg[aria-selected=true]{box-shadow:0 0 0 1px var(--acc)}
.seg:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
.tip{position:absolute;bottom:18px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .12s;
  font:700 11px var(--f-mono);letter-spacing:.04em;color:var(--ink);background:var(--surf2);border:1px solid var(--line-dim);padding:3px 8px}
.tip.on{opacity:1}
.gh{position:absolute;top:calc(50% - 40px);width:44px;height:64px;border:0;background:color-mix(in srgb,var(--surf) 70%,transparent);color:var(--ink);
  font:900 26px var(--f-mono);cursor:pointer;opacity:0;transition:opacity .15s}
.gh.prev{left:0}.gh.next{right:0}
.figwrap:hover .gh:not(:disabled),.gh:focus-visible{opacity:.85}
.gh:disabled{display:none}
@media (hover:none){.gh:not(:disabled){opacity:.55}}

/* controls: one quiet line; drag the value sideways, or use the thin track that shows on hover */
.ctl{display:flex;flex-wrap:wrap;align-items:center;gap:8px 30px;margin:12px 0 0;padding:0 2px}
.kn{position:relative;display:inline-flex;align-items:baseline;gap:9px;font:700 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-bottom:8px}
.kv{font:800 17px var(--f-mono);letter-spacing:0;text-transform:none;color:var(--acc);border-bottom:2px dotted var(--acc);cursor:ew-resize;user-select:none;touch-action:none;min-width:2ch}
.kn input{position:absolute;left:0;right:0;bottom:-6px;width:100%;height:14px;margin:0;opacity:0;accent-color:var(--acc);cursor:pointer;transition:opacity .15s}
.kn:hover input,.kn.drag input,.kn input:focus-visible{opacity:1}
.kn.drag .kv{color:var(--ink)}
.kb{margin-left:auto;display:inline-flex;align-items:center;gap:7px;font:700 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);
  background:none;border:0;border-bottom:2px dotted var(--line-dim);padding:2px 0 6px;cursor:pointer}
.kb span{font-size:16px;color:var(--acc);transition:transform .3s}
.kb:hover{color:var(--ink)}.kb:active span{transform:rotate(-180deg)}

/* info sidebar: 30% of the screen on the right; the page shifts left so nothing is hidden */
.side{position:fixed;top:0;right:0;z-index:50;height:100vh;width:clamp(360px,32vw,500px);overflow-y:auto;background:var(--surf);
  border-left:3px solid var(--line);padding:24px 32px 56px;transform:translateX(102%);transition:transform .22s ease;font-size:17px;line-height:1.6}
.side.open{transform:none}
.side .lead{font-size:19px;line-height:1.6;color:var(--ink);margin:0 0 24px}
.side .sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.side .sx{width:32px;height:32px;border:2px solid var(--line);background:var(--surf2);color:var(--ink);font:900 18px var(--f-mono);cursor:pointer}
.side .st{font-size:23px;font-weight:850;line-height:1.25;margin-bottom:18px}
.side section{padding:24px 0;border-top:1px solid var(--line-dim)}
.side h4{font:700 12px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--acc);margin-bottom:14px}
.side ul{padding-left:1.1em}.side li{margin:.7em 0;line-height:1.6}.side p+p{margin-top:.8em}
/* notation: "symbol : meaning" on one line, the example under it */
.side .nts{display:grid;grid-template-columns:max-content auto 1fr;column-gap:10px;align-items:baseline}
.side .nt,.side .nk{display:contents}
.side .sym{grid-column:1;font-weight:700;color:var(--acc);white-space:nowrap;line-height:1.55}
.side .col{grid-column:2;color:var(--dim)}
.side .ne{grid-column:3;color:var(--ink);line-height:1.55}
.side .eg{grid-column:3;margin:6px 0 22px;font:15px/1.55 var(--f-mono);color:var(--muted)}
.side .nt:last-child .eg{margin-bottom:4px}
.side .eg strong{color:var(--ink)}
.side .wx{font:16px/1.6 var(--f-mono);color:var(--ink);background:var(--surf2);border-left:3px solid var(--acc);padding:12px 16px}
.side details{margin-top:12px;border-top:2px solid var(--line-dim);padding-top:10px}.side summary{cursor:pointer;font:700 11px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
@media (min-width:1000px){body.side-on{--stage-w:min(1240px,calc(100vw - clamp(360px,32vw,500px) - 48px));padding-right:calc(clamp(360px,32vw,500px) + 16px)}}
@media (max-width:1399px){.side{width:340px;padding:22px 26px 48px}body.side-on{--stage-w:calc(100vw - 340px - 48px);padding-right:356px}}   /* laptops: keep the figure big enough that 16-unit labels stay ≥ 12 px */
@media (max-width:999px){.side{width:min(92vw,460px);box-shadow:-12px 0 0 rgba(0,0,0,.35)}}

/* article layout: short prose between wide figures */
.prose{max-width:68ch;margin:0 auto 26px;font-size:19px}
.prose p+p{margin-top:.8em}
.prose h2{font-size:clamp(22px,2.6vw,30px);font-weight:900;text-transform:uppercase;letter-spacing:-.02em;margin:46px 0 14px;line-height:1.05}
.prose ul{padding-left:1.2em}.prose li{margin:.25em 0}
.acc1{--acc:var(--c1)}.acc2{--acc:var(--c2)}.acc3{--acc:var(--c3)}.acc4{--acc:var(--c4)}.acc5{--acc:var(--c5)}.acc6{--acc:var(--c6)}

/* study page blocks */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:22px;max-width:var(--stage-w);margin:0 auto 34px}
.tile{background:var(--surf);border:3px solid var(--line);box-shadow:6px 6px 0 var(--acc);padding:18px 20px}
.tile h3{font-size:17px;font-weight:850;text-transform:uppercase;letter-spacing:-.01em;margin-bottom:8px;line-height:1.15}
.tile p,.tile li{font-size:16px}.tile ul{padding-left:1.1em}
.tile .tag{font:700 11px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:6px}
.big{font-size:44px;font-weight:900;letter-spacing:-.03em;line-height:1;color:var(--acc)}
.flip{cursor:pointer}.flip .a{display:none;margin-top:10px;padding-top:10px;border-top:2px dashed var(--line-dim)}.flip.on .a{display:block}
.flip .hint{font:700 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin-top:8px}
.flip.on .hint{display:none}
table.cmp{width:100%;max-width:var(--stage-w);margin:0 auto 34px;border-collapse:collapse;background:var(--surf);border:3px solid var(--line);box-shadow:6px 6px 0 var(--acc)}
table.cmp th,table.cmp td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line-dim);font-size:16px;vertical-align:top}
table.cmp th{font:700 12px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sec{display:block;max-width:var(--stage-w);margin:40px auto 16px;font:700 13px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);border-bottom:2px solid var(--line-dim);padding-bottom:6px}

/* calc engine extras */
.fig .katex{font-size:1em}
.fig .katex svg{height:inherit;max-height:none;margin:0}  /* KaTeX draws radicals with inner SVGs; the stage rule above must not resize them */
.fig foreignObject div{color:var(--ink);font-family:var(--f-disp);line-height:1.2}
.foot{max-width:var(--stage-w);margin:30px auto 0;font:500 12px var(--f-mono);color:var(--dim)}

@media (max-width:700px){
  body{padding:18px 12px 48px;font-size:17px}
  .card{padding:14px 12px;box-shadow:5px 5px 0 var(--acc)}
  .fig.pan{overflow-x:auto}.fig.pan svg{min-width:720px;max-height:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head>

    root.querySelectorAll('.ctl input').forEach(inp => {
      const c = s.controls.find(c => c.name === inp.name), kn = inp.parentNode, kv = kn.querySelector('.kv'), st = c.step ?? 1;
      const set = v => { v = +P.clamp(c.min + Math.round((v - c.min) / st) * st, c.min, c.max).toFixed(6); inp.value = v; kv.textContent = fmtC(c, v);

  const strip = groups => groups.reduce((a, b) => a + b, 0) > 1 ? `<div class="strip" role="tablist" aria-label="steps">${groups.map(n => `<div class="sg" style="flex:${n}">${'<button class="seg" role="tab"><i></i></button>'.repeat(n)}</div>`).join('')}<span class="tip" aria-hidden="true"></span></div>` : '';
  function bindStrip(card, n, go, cur, label) {
    const segs = [...card.querySelectorAll('.seg')], tip = card.querySelector('.tip');
    segs.forEach((b, i) => { b.setAttribute('aria-label', label(i)); b.onclick = () => go(i);
      b.onmouseenter = b.onfocus = () => { tip.textContent = label(i); const R = tip.parentNode.getBoundingClientRect(), r = b.getBoundingClientRect();   // centred on the segment, kept inside the strip
        tip.style.left = Math.max(0, Math.min(R.width - tip.offsetWidth, r.left - R.left + r.width / 2 - tip.offsetWidth / 2)) + 'px'; tip.classList.add('on'); };

    card.querySelector('.gh.prev').onclick = () => go(cur() - 1); card.querySelector('.gh.next').onclick = () => go(cur() + 1);
    return (i, t) => { segs.forEach((b, j) => { b.firstChild.style.width = (j < i ? 100 : j === i ? Math.round(t * 100) : 0) + '%'; b.setAttribute('aria-selected', j === i); });
      card.querySelector('.gh.prev').disabled = i <= 0; card.querySelector('.gh.next').disabled = i >= n - 1; };
  }
  const short = (s, n = 7) => { const w = String(s || '').replace(/\*\*|\*|`/g, '').split(/\s+/); return w.slice(0, n).join(' ') + (w.length > n ? ' …' : ''); };

  // info sidebar: one panel on the right; follows the scene it was opened from, step by step
  let side = null, sideS = null;
  // scene info + step info; a plain string counts as { text }. Step keys win, notation tables merge.
  const asInfo = x => typeof x === 'string' ? { text: x } : x;
  function infoOf(s, k) { const a = asInfo(s.info), b = asInfo((s.steps[k] || {}).info); if (!a || !b) return a || b;
    return { ...a, ...b, notation: { ...(a.notation || {}), ...(b.notation || {}) } }; }
  const texOr = x => window.katex && /[\\_^{]/.test(x) ? katex.renderToString(x, { throwOnError: false }) : `<code>${esc(x)}</code>`;
  // one notation entry: "symbol : what it is", then the example on its own line. v = 'text' | {is, eg} | [is, eg]; a string may carry 'e.g. …'
  function noteHTML(k, v) {

    return `<div class="nt"><div class="nk"><span class="sym">${texOr(k)}</span><span class="col">:</span><span class="ne">${md(is)}</span></div>${eg ? `<div class="eg">e.g. ${md(eg)}</div>` : ''}</div>`;
  }
  function infoHTML(inf) {
    if (!inf) return '';
    const li = a => `<ul>${[].concat(a).map(x => `<li>${md(x)}</li>`).join('')}</ul>`, sec = (h, b) => `<section><h4>${h}</h4>${b}</section>`;
    return (inf.text ? `<section>${para(inf.text)}</section>` : '') + (inf.see ? sec('What you see', li(inf.see)) : '')
      + (inf.notation && Object.keys(inf.notation).length ? sec('Notation', `<div class="nts">${Object.entries(inf.notation).map(([k, v]) => noteHTML(k, v)).join('')}</div>`) : '')
      + (inf.example ? sec('Worked example', `<p class="wx">${md(inf.example)}</p>`) : '') + (inf.read ? sec('How to read it', li(inf.read)) : '') + (inf.try ? sec('Try', `<p>${md(inf.try)}</p>`) : '')
      + (inf.more ? `<details><summary>Deeper</summary>${para(inf.more)}</details>` : '');
  }
  P.infoWords = (s, k) => { const d = document.createElement('div'); d.innerHTML = infoHTML(infoOf(s, k)); d.querySelectorAll('.katex-mathml, .eg').forEach(e => e.remove());   /* required example lines do not count */ return d.textContent.split(/\s+/).filter(Boolean).length; };
  function renderSide(s) { const k = s.k || 0, st = s.steps[k] || {};

  P.side = i => { const s = i == null ? null : P.scenes[i]; if (s !== sideS) toggleSide(s); };   // for check.py: open the sidebar of scene i (null closes)
  function toggleSide(s) {
    if (!side) { document.body.insertAdjacentHTML('beforeend', `<aside class="side" aria-label="details" aria-hidden="true"><div class="sh"><span class="phase"></span><button class="sx" aria-label="close (Esc)">×</button></div><h3 class="st"></h3><div class="sb"></div></aside>`);
      side = document.querySelector('.side'); side.querySelector('.sx').onclick = () => toggleSide(null); addEventListener('keydown', e => { if (e.key === 'Escape' && sideS) toggleSide(null); }); }
    sideS = s && s !== sideS ? s : null;
    side.classList.toggle('open', !!sideS); side.setAttribute('aria-hidden', !sideS); document.body.classList.toggle('side-on', !!sideS);

  }
  const infoBtn = `<button class="ib" aria-expanded="false" aria-label="details (i)" title="details (i)">i</button>`;

  // walk: one stage, one strip over every step of every scene
  // keys that move between steps: ignore typing in text boxes and modified keys; a range slider gives up ← → (it keeps ↑ ↓)
  const navKey = e => !(e.metaKey || e.ctrlKey || e.altKey) && !(e.target.isContentEditable || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT' || (e.target.tagName === 'INPUT' && e.target.type !== 'range'))
    && !(e.target.type === 'range' && !/Arrow(Left|Right)/.test(e.key));
  function buildWalk(root) {
    const flat = []; P.scenes.forEach(s => s.steps.forEach((_, k) => flat.push([s, k])));
    root.innerHTML = `<section class="card"><div class="head"><span class="phase"></span><span class="stitle"></span></div>${infoBtn}
      <div class="figwrap"><div class="stagewrap">${P.scenes.map(s => `<div class="sc" data-s="${s.i}" hidden>${figure(s)}</div>`).join('')}</div>${ghosts}${strip(P.scenes.map(s => s.steps.length))}</div>
      ${P.scenes.map(s => `<div class="cs" data-s="${s.i}" hidden>${controls(s)}</div>`).join('')}</section>`;
    const card = root.querySelector('.card');
    let cur = -1;
    const go = (i, instant) => { i = P.clamp(Math.round(i), 0, flat.length - 1); const [s, k] = flat[i], prev = cur >= 0 ? flat[cur][0] : null;
      card.querySelectorAll('.sc,.cs').forEach(e => e.hidden = +e.dataset.s !== s.i);
      card.className = 'card ' + (s.acc ? 'acc' + s.acc : '');
      const fwd = i === cur + 1 && prev === s; cur = i; if (sideS && sideS !== s) { sideS = s; }
      s.paint = t => paintStrip(i, t); play(s, k, instant || !fwd); };
    const paintStrip = bindStrip(card, flat.length, go, () => cur, i => `${flat[i][0].title || ''} · ${flat[i][1] + 1}/${flat[i][0].steps.length}`);
    P.scenes.forEach(s => { s.el = { card, fig: card.querySelector(`.sc[data-s="${s.i}"] .fig`), cap: card.querySelector('.cap'), title: card.querySelector('.stitle'), phase: card.querySelector('.phase'), ib: card.querySelector('.ib') };
      bindControls(s, card.querySelector(`.cs[data-s="${s.i}"]`)); });
    card.querySelector('.ib').onclick = () => toggleSide(flat[cur][0]);
    // ← → always step, even with a slider focused; ↑ ↓ still move that slider
    addEventListener('keydown', e => { if (!navKey(e)) return;
      if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); go(cur + 1); } else if (e.key === 'ArrowLeft') { e.preventDefault(); go(cur - 1); }
      else if (e.key === 'Home') go(0, true); else if (e.key === 'End') go(flat.length - 1, true); else if (e.key === 'i') card.querySelector('.ib').click(); });
    P.states = () => flat.map(([s, k], i) => ({ i, scene: s.i, step: k }));
    P.show = st => { const s = P.scenes[st.scene]; Object.assign(s.params, s.defaults, st.params || {}); syncControls(s); go(st.i, true); draw(s, st.step, 1); };
    go(0, true);
  }
  // article: wide figures, each with its own strip and controls (study blocks may sit between scenes, never before the first)
  function buildArticle(root) {
    root.innerHTML = P.blocks.map(b => b.prose != null ? `<div class="prose">${b.h ? `<h2>${esc(b.h)}</h2>` : ''}${para(b.prose)}</div>`
      : b.html != null ? b.html
      : `<section class="card ${b.scene.acc ? 'acc' + b.scene.acc : ''}" data-s="${b.scene.i}">${(b.scene.title || b.scene.phase) ? `<div class="head">${b.scene.phase ? `<span class="phase">${esc(b.scene.phase)}</span>` : ''}<span class="stitle"></span></div>` : ''}${infoBtn}
         <div class="figwrap">${figure(b.scene)}${ghosts}${strip([b.scene.steps.length])}</div>${controls(b.scene)}</section>`).join('');

      const go = (j, instant) => { j = P.clamp(Math.round(j), 0, s.steps.length - 1); const fwd = j === k + 1; k = j; s.paint = t => paintStrip(j, t); play(s, j, instant || !fwd); };

    P.show = st => { const s = P.scenes[st.scene]; Object.assign(s.params, s.defaults, st.params || {}); syncControls(s); s.go(st.step, true); draw(s, st.step, 1); };

  // ---------- self audit: run on the drawn state; check.py calls it for every step and control extreme ----------
  P.audit = (sceneIndex) => {
    const s = P.scenes[sceneIndex], g = s && s.last, out = [], where = `scene ${s.i + 1} "${(s.steps[s.k] && s.steps[s.k].title) || s.title || ''}" step ${s.k + 1}`;
    if (s.err) out.push(`${where}: draw error: ${s.err}`);

    const short = s => `"${String(s).slice(0, 28)}"`;

      const a = T[i];
      if (a.x0 < -2 || a.y0 < -2 || a.x1 > s.W + 2 || a.y1 > s.H + 2) out.push(`${where}: ${short(a.s)} leaves the figure`);
      if (a.px * px < 11.5 && px > .5) out.push(`${where}: ${short(a.s)} renders at ${(a.px * px).toFixed(1)}px (<12px)`);
      if (!a.tex && String(a.s).trim().length > 2 && /[Σ∏√∫]|[ᵢⱼₖ].*=|=.*[ᵢⱼₖ]/.test(a.s)) out.push(`${where}: ${short(a.s)} is a formula typed as text; draw it with g.tex and explain its symbols in info.notation`);
      if (!a.tex && String(a.s).split(/\s+/).length > 7) out.push(`${where}: label ${short(a.s)} has >7 words; move detail to the caption or info`);
      for (let j = i + 1; j < T.length; j++) if (ov(a, T[j], 1) > 6) out.push(`${where}: labels overlap ${short(a.s)} × ${short(T[j].s)}`);
      for (const [x1, y1, x2, y2] of g.segs) if (segHit(x1, y1, x2, y2, a.x0 + 3, a.y0 + 3, a.x1 - 3, a.y1 - 3)) { out.push(`${where}: a line crosses ${short(a.s)}`); break; }
      for (const b of g.boxes) { const inside = a.x0 >= b.x0 - 1 && a.x1 <= b.x1 + 1 && a.y0 >= b.y0 - 1 && a.y1 <= b.y1 + 1;
        if (!inside && ov(a, b, 2) > 8 && b.solid) { out.push(`${where}: ${short(a.s)} sits across a shape edge`); break; } }
    }
    // a listed panel that is never on screen (two panels start on the same step) would vanish silently
    if (s.k === 0 && s.panels) { const seen = new Set(); s.steps.forEach((_, kk) => Object.keys(panelsAt(s, kk, 1)).forEach(id => seen.add(id)));
      const lost = s.panels.filter(q => !seen.has(q.id)).map(q => q.id); if (lost.length) out.push(`${where}: panel ${lost.join(', ')} is never on screen: one figure per step and the older one retires; give it a later 'from', or its own scene`); }
    // plots fill their panel: a short plot under big headings wastes the stage (titles belong in the head or the sidebar)
    // every notation entry carries an example from the figure: "symbol : meaning", then "e.g. …"
    { const nt = (infoOf(s, s.k) || {}).notation || {}, bare = Object.entries(nt).filter(([, v]) => !(Array.isArray(v) ? v[1] : v && typeof v === 'object' ? v.eg : /\s(e\.g\.|for example|example:)\s/i.test(v))).map(([k]) => k);
      if (bare.length) out.push(`${where}: notation without an example: ${bare.slice(0, 4).join(', ')}; write each as [meaning, example from the figure], e.g. n: ['samples per group', '6 dots in each group']`); }
    // a formula on the stage needs its symbols explained in the sidebar
    if (g.texts.some(q => q.tex)) { const inf = infoOf(s, s.k) || {}; if (!inf.notation || !Object.keys(inf.notation).length) out.push(`${where}: formula on the stage but no info.notation; name every symbol, index and operator with an example from the figure`); }
    g.plots.forEach(q => { if (q.h < (s.minPlotH || 300)) out.push(`${where}: plot ${short(q.name)} is ${Math.round(q.h)} units tall (min ${s.minPlotH || 300}); shrink panelPad and the text above or below it, put headings in the scene title or the sidebar`); });
    const big = g.texts.filter(q => q.size > 36 && String(q.s).trim().length > 2)   /* a lone "=" or "×" may be big */; if (big.length) out.push(`${where}: text ${short(big[0].s)} is size ${big[0].size} (max 36: labels 20, the key number 26–34); bigger text squeezes the plots`);
    g.plots.forEach(q => { if (q.w < (s.minPlotW || 440)) out.push(`${where}: plot ${short(q.name)} is ${Math.round(q.w)} units wide (min ${s.minPlotW || 440}); one figure per step, drawn across the stage`); });
    // one figure per step: two plots side by side look crammed; the next figure belongs on the next step
    if (g.plots.length > 1) out.push(`${where}: ${g.plots.length} plots on one step (${g.plots.map(q => short(q.name)).join(', ')}); show one figure per step and bring the next one in on the next step (panels with a later 'from' do this)`);
    if (g.words > (s.wordBudget || 40)) out.push(`${where}: ${g.words} words on the figure (budget ${s.wordBudget || 40}); move text to caption/info`);
    const iw = P.infoWords(s, s.k); if (iw > 120) out.push(`${where}: info sidebar has ${iw} words (max 120); cut to short points`);

    { const nl = T.filter(a => !a.tick).length; if (nl > (s.labelBudget || 24)) out.push(`${where}: ${nl} labels on the figure (max ${s.labelBudget || 24}); split the scene`); }

    const cr = (ax, ay, bx, by, cx, cy, dx, dy) => { const d = (bx - ax) * (dy - cy) - (by - ay) * (dx - cx); if (!d) return false;

    return cr(x1, y1, x2, y2, l, t, r, t) || cr(x1, y1, x2, y2, r, t, r, b) || cr(x1, y1, x2, y2, l, b, r, b) || cr(x1, y1, x2, y2, l, t, l, b);
  }

  // ---------- boot ----------
  function boot() {
    const o = P.opts, theme = 'dark';
    document.body.dataset.theme = theme; if (o.palette) document.body.dataset.palette = o.palette; if (o.acc) document.body.classList.add('acc' + o.acc);
    document.title = o.title || 'Proff';
    const head = `<header class="top"><div class="tx">${o.eyebrow ? `<span class="eyebrow">${esc(o.eyebrow)}</span>` : ''}<h1>${esc(o.title || '')}</h1>${o.sub ? `<p class="sub">${esc(o.sub)}</p>` : ''}</div></header>`;
    document.body.insertAdjacentHTML('afterbegin', head + '<main id="story"></main>' + (o.foot ? `<p class="foot">${md(o.foot)}</p>` : ''));
    const setT = t => { document.body.dataset.theme = t; readVars(); P.scenes.forEach(s => s.el && draw(s, s.k || 0, 1)); };
    readVars();
    const root = document.getElementById('story');
    (o.layout === 'article' ? buildArticle : buildWalk)(root);
    setT(theme);
    P.ready = true;
  }
  const start = () => (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(() => {
    const imgs = Object.entries(P.assets).map(([k, v]) => new Promise(r => { const im = new Image(); im.onload = im.onerror = r; im.src = v; P.images[k] = im; }));
    return Promise.all(imgs); }).then(boot).catch(e => { P.errors.push('boot: ' + e.message); console.error(e); });
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else setTimeout(start);
  addEventListener('error', e => P.errors.push('page: ' + e.message));
})();
</script><script>/* Proff calc engine: replays a calctrace.py trace. Proff.calc(trace, {phase, acc}) adds one scene per operation.

(function () {
  'use strict';
  const P = window.Proff, ST = P.stat;
  const fcol = c => 'f' + c.slice(1);
  const CAP_ALL = 'Same rule for every cell.';

  P.calc = (tr, opt = {}) => {
    const TS = tr.tensors;
    (tr.warn || []).forEach(w => P.errors.push(w));   // calctrace found a formula it cannot explain: check.py fails
    tr.steps.forEach((st, si) => {
      const n = st.cells.length, k = Math.min(st.expand || 0, n), plan = [];
      for (let c = 0; c < k; c++) plan.push({ one: c });
      if (n > k || !n) plan.push({ rest: k });
      // the sidebar lead keeps the step's own sentence on every step; the stage shows the cells moving
      const steps = plan.map((p, j) => ({ cap: j === 0 ? st.cap : `${st.cap} ${p.rest != null ? (st.cap_all || CAP_ALL) : 'Next cell, same rule.'}` }));
      P.scene({ title: st.title, phase: opt.phase || st.phase, labelBudget: 60, wordBudget: 60, acc: opt.acc, steps, info: merge(st.info, explain(st, tr)), anim: st.op === 'show' ? 450 : 900, w: 1200, h: 675,
        draw: (g, j, t) => (st.op === 'dist' ? drawDist : drawOp)(g, st, plan[j], t, TS) });
    });
  };

  // ---------- the i sidebar, written from the trace: every symbol, index and operator in the formula, plus one worked example ----------
  const OPS = [  // [pattern in the TeX, plain words]; v = the summed index, if any
    [/\\sum_\{?([a-z])\}?/, (m, ix) => [`\\sum_${m[1]}`, { is: `add up over every ${m[1]} (every ${ix[m[1]] || m[1]})`, eg: 'Σ over 1, 2, 3 = 6' }]],
    [/\\sum(?!_)/, () => ['\\sum', 'add up']],
    [/\\prod/, () => ['\\prod', 'multiply all together']],
    [/\\bar\{?([a-zA-Z])/, m => [`\\bar{${m[1]}}`, { is: `the average of ${m[1]}`, eg: 'average of 2, 4, 6 = 4' }]],
    [/\\log_2|\\log_\{2\}/, () => ['\\log_2', { is: 'log base 2: how many doublings', eg: 'log₂ 8 = 3' }]],
    [/\\log_\{?10\}?/, () => ['\\log_{10}', { is: 'log base 10: how many tenfolds', eg: 'log₁₀ 1000 = 3' }]],
    [/\\ln|\\log(?!_)/, () => ['\\ln', 'natural log (base e ≈ 2.718)']],
    [/\\sqrt/, () => ['\\sqrt{\\;}', { is: 'square root', eg: '√9 = 3' }]],
    [/\\frac|\//, () => ['a / b', 'divide']],
    [/\\times|\\cdot/, () => ['\\times', 'multiply']],
    [/\^(\{2\}|2(?![0-9]))/, () => ['a^2', { is: 'squared', eg: '3² = 3 × 3 = 9' }]],
    [/\\exp|e\^/, () => ['e^{a}', 'e (≈ 2.718) to the power a; undoes ln']],
    [/\|/, () => ['|a|', 'size of a, sign dropped']],
  ];
  const nm = (a, i) => a && a[i] != null ? a[i] : String(i + 1);
  function explain(st, tr) {
    if (!st.tex && st.op === 'show') return null;
    const TS = tr.tensors, ix = tr.index || { i: 'row', j: 'column' }, notation = {}, tex = st.tex || '';
    const used = [...new Set((st.layout || []).flatMap(it => it && typeof it === 'object' ? [it.t, it.right, it.below] : []).concat(st.out).filter(Boolean))];
    for (const n of used) { const T = TS[n]; if (!T || !T.sym) continue;
      const R = T.data.length, C = T.data[0].length, sub = R > 1 && C > 1 ? 'ij' : R > 1 ? 'i' : C > 1 ? 'j' : '';
      const where = sub === 'ij' ? ` of ${ix.i} i in ${ix.j} j` : sub === 'i' ? ` of ${ix.i} i` : sub === 'j' ? ` of ${ix.j} j` : '';
      const eg = sub === 'ij' ? `${nm(T.rows, 0)} in ${nm(T.cols, 0)}` : sub === 'i' ? nm(T.rows, 0) : sub === 'j' ? nm(T.cols, 0) : '';
      notation[sub ? `${T.sym}_{${sub}}` : T.sym] = { is: `${T.label || n}${T.unit ? ` (${T.unit})` : ''}${where}`, eg: eg ? `${eg} = **${T.disp[0][0]}**` : `**${T.disp[0][0]}**` }; }
    const first = Object.values(TS).find(T => T.rows && T.cols) || {};
    const subs = [...tex.matchAll(/_(?:\{([^}]*)\}|([a-zA-Z]))/g)].map(m => (m[1] ?? m[2]).replace(/\\[a-zA-Z]+/g, '')).join(' ');   // index letters only inside subscripts
    if (/i/.test(subs)) notation.i = { is: `one ${ix.i} (a row)`, eg: `${nm(first.rows, 0)}, ${nm(first.rows, 1)}, …` };
    if (/j/.test(subs)) notation.j = { is: `one ${ix.j} (a column)`, eg: `${nm(first.cols, 0)}, ${nm(first.cols, 1)}, …` };
    const opKeys = []; OPS.forEach(([re, f]) => { const m = tex.match(re); if (m) { const [k, v] = f(m, ix); if (!notation[k]) { notation[k] = v; opKeys.push(k); } } });   // 'words. example' strings split into two lines in the sidebar
    // worked example: the first output cell, named by its row and column
    const c = st.cells && st.cells[0], O = TS[st.out];
    let example = null;
    if (c && O && c.expr) { const [i, j] = c.out, who = [O.rows && O.rows[i], O.cols && O.cols[j]].filter(Boolean).join(', ');
      const plain = (O.sym || '').replace(/\\mathrm\{(.*?)\}/g, '$1').replace(/[\\{}]/g, '');
      example = `${who ? `**${who}**: ` : ''}${plain ? `${plain} = ` : ''}${c.expr.map(e => e[0]).join(' ').replace(/\s+/g, ' ').trim()}`; }
    // an operator's example is better taken from the figure than made up
    const op = opKeys.find(k => /^\\(sum|prod)/.test(k)) || opKeys.find(k => typeof notation[k] === 'string'); opKeys.filter(k => k !== op && typeof notation[k] === 'string').forEach(k => notation[k] = { is: notation[k], eg: { 'a / b': '6 / 3 = 2', '\\times': '3 × 4 = 12', '\\ln': 'ln 1 = 0', '|a|': '|−3| = 3', 'e^{a}': 'e⁰ = 1', '\\sum': '1 + 2 + 3 = 6', '\\prod': '2 × 3 × 4 = 24' }[k] || '' });
    if (op && example) { notation[op] = { ...(typeof notation[op] === 'string' ? { is: notation[op] } : notation[op]), eg: example.replace(/\*\*/g, '') }; example = null; }   // shown once, under the operator
    return { notation, example };
  }
  function merge(a, b) { if (!b) return a; a = typeof a === 'string' ? { text: a } : (a || {});
    return { ...b, ...a, notation: { ...b.notation, ...(a.notation || {}) }, example: a.example || b.example }; }

  // ---------- layout of the equation row ----------
  function sizeOf(T, cw, ch) {
    const R = T.data.length, C = T.data[0].length, fs = Math.min(28, ch * .44);
    const lab = T.rows ? Math.max(...T.rows.map(r => String(r).length)) * fs * .5 + 16 : 0;
    const top = (T.cols ? fs * 1.3 : 0) + fs * 1.6;
    return { w: C * cw, h: R * ch, lab, top, fs };
  }
  function layoutRow(g, items, TS, cw, ch) {
    const gap = 26, parts = [];
    let x = 0;
    for (const it of items) {
      if (it == null) continue;
      if (typeof it === 'string') { const w = Math.max(40, it.length * 17 + 24); parts.push({ op: it, x, w }); x += w + gap; continue; }
      const T = TS[it.t], s = sizeOf(T, cw, ch);
      const p = { t: it.t, x: x + s.lab, y: 0, s, below: it.below, right: it.right, sym: it.sym };
      let w = s.lab + s.w, h = s.h;
      if (it.right) { const V = TS[it.right], vs = sizeOf(V, cw, ch); p.rx = s.w + 70 + vs.lab; w += 70 + vs.lab + vs.w; }
      if (it.below) { p.by = s.h + ch * .9; h += ch * 1.9; }
      p.W = w; p.Hh = h; parts.push(p); x += w + gap;
    }
    return { parts, width: x - gap };
  }
  function fit(g, st, TS) {
    const top = st.tex ? 110 : 64, bottom = 120, availH = g.H - top - bottom, availW = g.W - 80;
    for (let cw = 150; cw >= 40; cw -= 4) {
      const ch = Math.round(cw * .56), L = layoutRow(g, st.layout, TS, cw, ch);
      const H = Math.max(...L.parts.filter(p => p.t).map(p => p.s.top + (p.Hh || p.s.h)), 0);
      if (L.width <= availW && H <= availH) return { cw, ch, L, H, top, x0: (g.W - L.width) / 2, y0: top + (availH - H) / 2 };
    }
    const cw = 40, ch = 24, L = layoutRow(g, st.layout, TS, cw, ch);
    return { cw, ch, L, H: 0, top, x0: 40, y0: top + 10 };
  }

  // ---------- one operation ----------
  function drawOp(g, st, pl, t, TS) {
    const F = fit(g, st, TS), { cw, ch } = F, n = st.cells.length;
    // which cells are done, which one is live
    let live = null, done = 0, phase = 1;
    if (pl.one != null) { live = st.cells[pl.one]; done = pl.one; phase = t; }
    else if (n) { const k = pl.rest; const f = k + (n - k) * t; done = Math.floor(f); live = done < n ? st.cells[done] : null; if (t >= 1) { done = n; live = null; } }
    const isDone = (i, j) => { for (let c = 0; c < done; c++) { const o = st.cells[c].out; if (o[0] === i && o[1] === j) return true; } return false; };
    const reads = new Set((live ? live.reads : []).map(r => r.join(':')));
    const outCell = live ? live.out.join(':') : null;
    const showRead = pl.one != null ? P.seg(phase, 0, .25) : 1, showOut = pl.one != null ? P.seg(phase, .7, .95) : 1;

    if (st.tex) g.tex(g.W / 2, 58, st.tex, { size: 36, w: 1000, h: 80 });
    const y0 = F.y0;
    for (const p of F.L.parts) {
      const x = F.x0 + p.x;
      if (p.op) { g.text(F.x0 + p.x + p.w / 2, y0 + F.H / 2 + 12, p.op, { size: p.op.length > 3 ? 24 : 36, anchor: 'middle', weight: 700, fill: 'muted' }); continue; }
      const T = TS[p.t], top = y0 + p.s.top;
      drawT(g, T, p.t, x, top, cw, ch, st, { reads, outCell, isDone, showRead, showOut, phase });
      if (p.below) { const V = TS[p.below], vy = top + p.by;
        g.text(x - 12, vy + ch / 2, p.sym, { size: 26, anchor: 'end', weight: 800, fill: V.color });
        drawT(g, V, p.below, x, vy, cw, ch, st, { reads, outCell, isDone, showRead, showOut, phase, noTitle: true });
        g.text(x + p.s.w + 12, vy + ch / 2, V.label, { size: 17, fill: V.color, weight: 650 }); }
      if (p.right) { const V = TS[p.right], vx = x + p.rx;
        g.text(x + p.s.w + 35, top + p.s.h / 2, p.sym, { size: 26, anchor: 'middle', weight: 800, fill: V.color });
        drawT(g, V, p.right, vx, top, cw, ch, st, { reads, outCell, isDone, showRead, showOut, phase }); }
    }
    // formula bar: the live cell's arithmetic, coloured by table
    const ex = live ? live.expr : (n ? st.cells[n - 1].expr : null);
    if (ex && st.op !== 'show') {
      const fy = g.H - 62, size = 34, upto = pl.one != null ? Math.ceil(ex.length * P.seg(phase, .2, .75)) : ex.length;
      const ws = ex.map(([s, name]) => P.measure(s, { size, mono: true, weight: name ? 750 : 500 })), w = ws.reduce((a, b) => a + b, 0);
      let x = g.W / 2 - w / 2;
      g.rect(g.W / 2 - w / 2 - 28, fy - 36, w + 56, 72, { fill: 'surf', stroke: 'line-dim', sw: 1.5, r: 4, free: true });
      ex.slice(0, upto).forEach(([s, name], q) => { const c = name ? TS[name].color : 'muted';
        g.text(x, fy, s, { size, fill: c, weight: name ? 750 : 500, mono: true, op: live ? 1 : .5 }); x += ws[q]; });
    }
  }

  function drawT(g, T, name, x, y, cw, ch, st, s) {
    const R = T.data.length, isOut = name === st.out;
    if (!s.noTitle) g.text(x + T.data[0].length * cw / 2, y - (T.cols ? Math.min(28, ch * .44) * 2.4 : Math.min(28, ch * .44) * 1.1), T.label + (T.unit ? ` (${T.unit})` : ''), { size: 18, anchor: 'middle', weight: 750, fill: T.color });
    g.matrix(x, y, T.disp, {
      cw, ch, rows: T.rows, cols: T.cols, fmt: v => v, size: Math.min(28, ch * .44),
      cell: (i, j) => {
        const key = `${name}:${i}:${j}`;
        if (isOut) {
          const here = s.outCell === `${i}:${j}`;
          if (here) return { fill: fcol(T.color), stroke: T.color, sw: 3, text: s.showOut > .5 ? T.disp[i][j] : '', top: s.showOut };
          if (!s.isDone(i, j)) return { fill: 'fig', stroke: 'line-dim', text: '' };
          return {};
        }
        if (s.reads.has(key)) return { fill: fcol(T.color), stroke: T.color, sw: 3, op: 1, top: 1, weight: 800, color: s.showRead > .3 ? T.color : 'ink' };
        return { };
      } });
  }

  // ---------- where a statistic falls on its distribution ----------
  function drawDist(g, st, pl, t, TS) {
    const prm = st.params, x = st.x, disc = ['pois', 'nb', 'binom'].includes(st.dist);
    const left = st.src ? 420 : 90;
    if (st.src) { const [nm, i, j] = st.src, T = TS[nm], cw = 66, ch = 40;
      const R = T.data.length, C = T.data[0].length, mx = 60 + (T.rows ? 70 : 0), my = (g.H - R * ch) / 2;
      g.text(mx + C * cw / 2, my - 48, T.label, { size: 18, anchor: 'middle', weight: 750, fill: T.color });
      g.matrix(mx, my, T.disp, { cw, ch, rows: T.rows, cols: T.cols, fmt: v => v, size: 18, cell: (a, b) => a === i && b === j ? { fill: fcol(T.color), stroke: T.color, sw: 3, color: T.color } : { op: .5, top: .5 } }); }
    let pdf, lo, hi;
    if (st.dist === 'norm') { const m = prm.mu ?? 0, s = prm.sd ?? 1; pdf = v => ST.normPdf(v, m, s); lo = Math.min(m - 4 * s, x - s); hi = Math.max(m + 4 * s, x + s); }
    else if (st.dist === 't') { pdf = v => ST.tPdf(v, prm.df); lo = Math.min(-5, x - 1); hi = Math.max(5, x + 1); }
    else if (st.dist === 'chi2') { const k = prm.df; pdf = v => ST.gammaPdf(v, k / 2, .5); lo = 0; hi = Math.max(k + 5 * Math.sqrt(2 * k), x * 1.15); }
    else { const pm = st.dist === 'pois' ? k => ST.poisPmf(k, prm.lam) : st.dist === 'nb' ? k => ST.nbPmf(k, prm.mu, prm.phi) : k => ST.binomPmf(k, prm.n, prm.p);
      pdf = pm; const mu = prm.lam ?? prm.mu ?? prm.n * prm.p; lo = 0; hi = Math.max(Math.ceil(mu * 2.6 + 6), x + 3); if (st.dist === 'binom') hi = prm.n; }
    const ymax = disc ? Math.max(...P.range(lo, hi, hi - lo + 1).map(k => pdf(Math.round(k)))) : Math.max(...P.range(lo, hi, 200).map(pdf));
    const ax = g.axes({ x: left, y: 120, w: g.W - left - 80, h: 380, xd: [lo, hi], yd: [0, ymax * 1.15], xt: 6, yt: 3, xl: st.xlabel || 'value', yl: disc ? 'probability' : 'density', size: 17 });
    const sh = P.seg(t, .3, 1), inTail = v => st.tail === 'upper' ? v >= x : st.tail === 'lower' ? v <= x : Math.abs(v) >= Math.abs(x);
    if (disc) { const ks = []; for (let k = Math.ceil(lo); k <= hi; k++) ks.push(k);
      g.bars(ks.map(k => [k, pdf(k)]), ax, { bw: .8, fill: (k) => inTail(k) && sh > 0 ? 'f3' : 'f1', stroke: 'c1' }); }
    else {
      g.area(pdf, ax, lo, hi, { fill: 'f1' });
      if (sh > 0) { if (st.tail !== 'lower') g.area(pdf, ax, st.tail === 'two' ? Math.abs(x) : x, hi, { fill: 'c3', op: .55 * sh });
        if (st.tail !== 'upper') g.area(pdf, ax, lo, st.tail === 'two' ? -Math.abs(x) : x, { fill: 'c3', op: .55 * sh }); }

    const X = ax.sx(x);
    g.line(X, ax.y - 6, X, ax.y + ax.h, { stroke: 'c3', sw: 3, free: true });
    g.text(X, ax.y - 22, `observed ${P.fmt(x)}`, { size: 20, anchor: X > g.W - 180 ? 'end' : 'middle', fill: 'c3', weight: 750 });
    if (sh > .5) g.text(ax.x + ax.w, ax.y + 30, `p = ${P.fmt(st.p, 3)}`, { size: 28, anchor: 'end', weight: 800, fill: 'c3', mono: true });
    if (st.tex) g.tex(g.W / 2, 50, st.tex, { size: 28, w: 900, h: 60 });
  }
})();

<script>
// Study page + calculation walkthroughs: the notation you meet in deep-learning papers.
// Simple (indices, sums, softmax) -> probability words -> gradients -> nested (a layer stack, attention).
// Every number is computed here or in make_forward.py / make_attn.py. The data are made up for teaching.
Proff.page({ title: 'Reading deep-learning notation', sub: 'From x_ij to softmax(QKᵀ/√d)V: what each symbol says and how the numbers move', eyebrow: 'notation guide', layout: 'article' });

// ---- identity colours: the same colour means the same thing in every scene ----
const DATA = 'c1', MODEL = 'c4', LOSS = 'c3', PICK = 'c2', SUM = 'c5';
const on = (k, j, t) => k > j ? 1 : k === j ? t : 0;
const f1 = v => v.toFixed(1), f2 = v => v.toFixed(2), f3 = v => v.toFixed(3);
const softmax = (z, tau = 1) => { const e = z.map(v => Math.exp(v / tau)), s = e.reduce((a, b) => a + b, 0); return e.map(v => v / s); };
const CLASSES = ['tumour', 'stroma', 'immune'];
const LOGITS = PROFF_DATA.forward.tensors.z2.data.map(r => r[0]);   // from the forward-pass trace below
const P0 = softmax(LOGITS);

// ======================================================================
Proff.section('three habits that make any formula readable');
Proff.tiles([
  { tag: 'habit 1', big: 'shape', h: 'write the shape under every symbol', text: 'x is 3 numbers, W is 4×3, so Wx is 4×1. Most wrong readings die at the shape check.' },
  { tag: 'habit 2', big: 'inside-out', h: 'peel the brackets from the middle', text: 'In σ(W⁽¹⁾x + b⁽¹⁾) do the inner sum first, then σ. Nested formulas are just steps in a row.' },
  { tag: 'habit 3', big: 'who is i?', h: 'name each index once', text: 'i is a sample, j a feature, k a class, t a step. A paper reuses the letters; the sentence next to the formula says which.' },
]);

// ======================================================================
Proff.section('chapter 1 · simple: indices, shapes, and where a number lives');
Proff.prose('A paper writes a whole table as one letter. Subscripts and superscripts then say which number, row or column you mean. The i button lists every symbol with a number from the figure.');
const X1 = [[5.1, .2, 3.4], [4.8, .1, 2.9], [.3, 6.2, .5], [.4, 5.8, .7]];
Proff.scene({
  title: 'x_ij is one number, x⁽ⁱ⁾ is one row, X is the table', acc: 1, h: 620,
  controls: [{ name: 'i', label: 'row i (cell)', min: 1, max: 4, step: 1, value: 2 }, { name: 'j', label: 'column j (gene)', min: 1, max: 3, step: 1, value: 3 }],
  steps: [
    { cap: 'One number: row i, column j. Here, the expression of gene j in cell i.',
      info: { notation: { 'x_{ij}': ['one entry: row i, column j', 'x₂₃ = 2.9: cell 2, gene 3'], i: ['row index: which sample (cell)', 'i = 2'], j: ['column index: which feature (gene)', 'j = 3'] },
              try: 'Drag **row i** and **column j** and watch the readout.' } },
    { cap: 'A whole row is one sample, written x with a bracketed i. The bracket means "which example", not a power.',
      info: { notation: { 'x^{(i)}': ['row i: the whole sample as a list of numbers', 'x⁽²⁾ = [4.8, 0.1, 2.9]'], '\\in': ['"is an element of"', 'x⁽²⁾ is one list of 3 numbers'],
                          '\\mathbb{R}^{d}': ['lists of d real numbers', 'd = 3 genes, so ℝ³'] } } },
    { cap: 'A colon means "all of them". Column j across every sample is one feature.',
      info: { notation: { 'x_{:,j}': ['column j: all rows, one feature', 'column 3 = [3.4, 2.9, 0.5, 0.7]'], ':': ['"every index"', 'rows 1 to 4'] } } },
    { cap: 'The whole table X has N rows (samples) and d columns (features).',
      info: { notation: { X: ['the whole table, capital letter', 'all 12 numbers'], N: ['number of samples (rows)', 'N = 4 cells'], d: ['number of features (columns)', 'd = 3 genes'],
                          '\\times': ['"by": rows by columns', 'N × d = 4 × 3'] } } },
  ],
  draw(g, k, t, p) {
    const cw = 150, ch = 70, x0 = (g.W - 3 * cw) / 2, y0 = 215, i = p.i - 1, j = p.j - 1;
    const hit = (a, b) => k === 0 ? a === i && b === j : k === 1 ? a === i : k === 2 ? b === j : true;
    const TEX = [`x_{ij}`, `x^{(i)}=\\left[x_{i1},\\,x_{i2},\\,x_{i3}\\right]\\in\\mathbb{R}^{d}`, `x_{:,j}`, `X\\in\\mathbb{R}^{N\\times d}`];
    g.tex(g.W / 2, 52, TEX[k], { size: 34, w: 900, h: 80 });
    g.matrix(x0, y0, X1, { cw, ch, fmt: f1, size: 24, rows: X1.map((_, r) => `cell ${r + 1}`), cols: ['gene 1', 'gene 2', 'gene 3'],
      cell: (a, b) => hit(a, b) ? { fill: 'f2', stroke: PICK, sw: 3, weight: 800, color: PICK } : { op: .55, top: .55 } });
    if (k === 3) {
      g.brace(x0 - 100, y0 + 4 * ch, x0 - 100, y0, 'N = 4 samples', { depth: 12, fill: DATA });
      g.brace(x0, y0 - 64, x0 + 3 * cw, y0 - 64, 'd = 3 features', { depth: 12, fill: DATA });
    }
    const row = X1[i].map(f1).join(', '), col = X1.map(r => f1(r[j])).join(', ');
    const read = [`x_{${p.i}${p.j}}=${f1(X1[i][j])}`, `x^{(${p.i})}=[${row}]`, `x_{:,${p.j}}=[${col}]`, `N\\times d=4\\times 3`][k];
    g.tex(g.W / 2, y0 + 4 * ch + 62, read, { size: 30, w: 800, h: 60, fill: PICK });
  }
});

// ======================================================================
Proff.section('chapter 2 · simple: sums, averages and the loss');
Proff.prose('Σ is a for-loop that adds. Putting 1/N in front makes it an average. Almost every training loss in a paper has this shape.');
const QS = p => [P0[0], .6, p.q3, .9, .5];

Proff.section('chapter 5 · common: gradient, learning rate and the update rule');

Proff.scene({
  title: 'θ ← θ − η∇L: walk downhill by learning rate × slope', acc: 2, h: 620,

  steps: [

              try: 'Drag **learning rate η**.' } },
    { cap: 'One update: move against the slope by η times its size. A steep slope gives a big step.',
      info: { notation: { '\\theta^{(t+1)}': ['the next value of θ', `θ⁽¹⁾ = −0.5 − 0.4 × (−2.5) = ${f2(TH0 - .4 * dLf(TH0))}`], '\\eta': ['learning rate: step-size knob (α in some papers)', 'η = 0.4'], '-': ['minus: go downhill', 'slope is −2.5, so θ moves right'] } } },
    { cap: 'Repeat. Small η crawls; η near 2 overshoots and zig-zags; above 2 it would blow up.',

  ],
  draw(g, k, t, p) {

Proff.section('chapter 6 · common: the chain rule on a computation graph');
Proff.prose('Backpropagation is the chain rule written along arrows. Each arrow contributes one local slope. Multiply them from the loss back to the weight.');
const X6 = 1.5, B6 = .5, Y6 = 1, sig = z => 1 / (1 + Math.exp(-z));
Proff.scene({
  title: 'ŷ = σ(wx + b); ∂L/∂w is a product of three local slopes', acc: 6, h: 620,
  controls: [{ name: 'w', label: 'weight w', min: -2, max: 2, step: .1, value: .8 }],
  steps: [
    { cap: 'Forward pass: left to right. Each arrow applies one function and passes the value on.',
      info: { notation: { 'z=wx+b': ['pre-activation: weight × input + bias', `z = 0.8 × ${X6} + ${B6} = ${f2(.8 * X6 + B6)}`], '\\sigma(z)': ['sigmoid: squashes any number into 0–1', `σ(${f2(.8 * X6 + B6)}) = ${f2(sig(.8 * X6 + B6))}`], '\\hat y': ['the model output (prediction)', `ŷ = ${f2(sig(.8 * X6 + B6))}`], '(\\hat y-y)^2': ['squared error against the target y = 1', `(${f2(sig(.8 * X6 + B6))} − 1)² = ${f3((sig(.8 * X6 + B6) - 1) ** 2)}`] },
              try: 'Drag **weight w**.' } },
    { cap: 'Backward pass, first arrow: how much does L change if ŷ moves a little?',
      info: { notation: { '\\frac{\\partial L}{\\partial \\hat y}': ['partial derivative: slope of L with respect to ŷ, others held fixed', `2(ŷ − y) = 2(${f2(sig(.8 * X6 + B6))} − 1) = ${f3(2 * (sig(.8 * X6 + B6) - 1))}`] } } },
    { cap: 'Second arrow: how much does ŷ move if z moves? Multiply by the slope so far.',
      info: { notation: { '\\frac{\\partial \\hat y}{\\partial z}': ['slope of the sigmoid at z: ŷ(1 − ŷ)', `${f2(sig(.8 * X6 + B6))} × ${f2(1 - sig(.8 * X6 + B6))} = ${f3(sig(.8 * X6 + B6) * (1 - sig(.8 * X6 + B6)))}`], '\\cdot': ['multiply the local slopes', 'slopes multiply along a path'] } } },
    { cap: 'Third arrow: z = wx + b, so ∂z/∂w is just x. The product is the gradient for w.',
      info: { notation: { '\\frac{\\partial z}{\\partial w}': ['slope of z with respect to w: equals x', `x = ${X6}`], '\\frac{\\partial L}{\\partial w}': ['the gradient the optimizer uses for w', `${f3(2 * (sig(.8 * X6 + B6) - 1))} × ${f3(sig(.8 * X6 + B6) * (1 - sig(.8 * X6 + B6)))} × ${X6}`] },
              read: ['Negative gradient: raising w lowers L.'] } },
  ],
  draw(g, k, t, p) {
    const w = p.w, z = w * X6 + B6, yh = sig(z), L = (yh - Y6) ** 2, dLy = 2 * (yh - Y6), dyz = yh * (1 - yh), dzw = X6;
    const TEX = ['L=\\left(\\sigma(wx+b)-y\\right)^{2}', '\\frac{\\partial L}{\\partial \\hat y}', '\\frac{\\partial L}{\\partial z}=\\frac{\\partial L}{\\partial \\hat y}\\cdot\\frac{\\partial \\hat y}{\\partial z}', '\\frac{\\partial L}{\\partial w}=\\frac{\\partial L}{\\partial \\hat y}\\cdot\\frac{\\partial \\hat y}{\\partial z}\\cdot\\frac{\\partial z}{\\partial w}'];
    g.tex(g.W / 2, 46, TEX[k], { size: 36, w: 1000, h: 80 });
    const NX = [150, 450, 750, 1050], names = ['w', 'z', 'ŷ', 'L'], vals = [w, z, yh, L], fn = [`× ${X6} + ${B6}`, 'sigmoid', '(· − 1)²'];
    NX.forEach((x, i) => { g.rect(x - 78, 140, 156, 104, { fill: i === 3 ? 'f3' : 'f1', stroke: i === 3 ? LOSS : DATA, sw: 2.5, r: 10, free: true });
      g.text(x, 170, names[i], { size: 22, anchor: 'middle', fill: 'muted', weight: 700 }); g.text(x, 214, i === 3 ? f3(vals[i]) : f2(vals[i]), { size: 32, anchor: 'middle', weight: 800, mono: true, fill: i === 3 ? LOSS : DATA });
      if (i < 3) { g.arrow(x + 82, 192, NX[i + 1] - 82, 192, { stroke: DATA, sw: 3 }); g.text((x + NX[i + 1]) / 2, 160, fn[i], { size: 20, anchor: 'middle', fill: 'muted' }); } });
    const back = (i, a) => g.fade(a, g => { g.arrow(NX[i + 1] - 60, 292, NX[i] + 60, 292, { stroke: LOSS, sw: 3.5 }); });
    const loc = [`\\frac{\\partial L}{\\partial \\hat y}=${f3(dLy)}`, `\\frac{\\partial \\hat y}{\\partial z}=${f3(dyz)}`, `\\frac{\\partial z}{\\partial w}=${f2(dzw)}`];
    [2, 1, 0].forEach((i, n) => { const a = on(k, n + 1, t); if (a > 0) { back(i, a); g.fade(a, g => g.tex((NX[i] + NX[i + 1]) / 2, 352, loc[n], { size: 26, w: 270, h: 70, fill: LOSS })); } });
    if (k >= 2) g.fade(on(k, 2, t), g => g.tex(g.W / 2, 480, `\\frac{\\partial L}{\\partial z}=${f3(dLy)}\\times${f3(dyz)}=${f3(dLy * dyz)}`, { size: 34, w: 900, h: 80, fill: 'ink' }));
    if (k >= 3) g.fade(on(k, 3, t), g => g.tex(g.W / 2, 560, `\\frac{\\partial L}{\\partial w}=${f3(dLy * dyz)}\\times${f2(dzw)}=${f3(dLy * dyz * dzw)}`, { size: 36, w: 900, h: 80, fill: SUM }));
  }
});
