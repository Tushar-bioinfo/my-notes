<title>A CRISPR knockout screen</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>/* Proff visual kit. BlockFrame chrome (thick borders, hard offset shadows, heavy Inter, Space Grotesk labels)
   around clean figures. Every colour is a token, so dark/light switch live. Authors never edit this file. */
:root,[data-theme=dark]{   /* default palette "harbor": strong cyan, honey, blaze orange, baltic blue, charcoal blue (user palette).
     Dark: the two dark blues become the ground; accents are the bright three plus lifted tints. Every accent >= 4.5:1 on --fig.
     c2 and c3 differ mostly in lightness for colour-blind readers: never let them carry a contrast alone (add a label or dash). */
  --bg:#0d161d;--fig:#111c24;--surf:#15232d;--surf2:#2f4858;--line:#e9eef2;--line-dim:#2f4858;--grid:#1c2b36;
  --ink:#eef3f6;--muted:#a09a92;--dim:#6d7a83;--on:#0d161d;
  --c1:#55dde0;--c2:#f6ae2d;--c3:#f26419;--c4:#6fa3d0;--c5:#f5d491;--c6:#b9c7d0;--mix:22%;
}
[data-theme=light]{   /* light: baltic and charcoal blue are accents; bright hues darkened to read on paper */
  --bg:#f4f1ea;--fig:#fdfbf6;--surf:#ffffff;--surf2:#e6ecef;--line:#2f4858;--line-dim:#d3d9dc;--grid:#ece8df;
  --ink:#1c2a33;--muted:#66625c;--dim:#8d8a84;--on:#ffffff;
  --c1:#0b7376;--c2:#9a6200;--c3:#a3330a;--c4:#33658a;--c5:#76601f;--c6:#2f4858;--mix:15%;
}
[data-palette=lab][data-theme=dark]{   /* preset "lab": Okabe-Ito hues */
  --bg:#0e1116;--fig:#12161c;--surf:#171c23;--surf2:#1e242d;--line:#e8ecf2;--line-dim:#343c48;--grid:#222934;
  --ink:#eef2f7;--muted:#9aa5b5;--dim:#6a7584;--on:#0e1116;
  --c1:#5cb8f0;--c2:#f0b43c;--c3:#f2694a;--c4:#3ccf9e;--c5:#c98ae6;--c6:#cfdc5a;--mix:22%;
}
[data-palette=lab][data-theme=light]{
  --bg:#f5f3ee;--fig:#fffdf9;--surf:#ffffff;--surf2:#efece4;--line:#1a1d24;--line-dim:#d8d4ca;--grid:#ebe7de;
  --ink:#1a1d24;--muted:#545966;--dim:#858995;--on:#ffffff;
  --c1:#0b6fb4;--c2:#9a6a00;--c3:#c2441c;--c4:#0a7d5e;--c5:#8645ae;--c6:#5f6b00;--mix:15%;
}
/* palette "neon" (the original proff look): Proff.page({palette:'neon'}) */
[data-palette=neon][data-theme=dark]{--bg:#0a0a0b;--fig:#111113;--surf:#161618;--surf2:#1d1d20;--line:#ececee;--line-dim:#3a3a3f;--grid:#26262b;
  --ink:#f4f4f5;--muted:#a1a1aa;--dim:#6b6b72;--on:#0a0a0b;--c1:#56c2ff;--c2:#ffc531;--c3:#ff6363;--c4:#59d499;--c5:#b98cff;--c6:#ff8f4a}
[data-palette=neon][data-theme=light]{--bg:#f6f7fb;--fig:#ffffff;--surf:#ffffff;--surf2:#eef0f7;--line:#14123a;--line-dim:#d6d8e6;--grid:#e9ebf3;
  --ink:#14123a;--muted:#55547a;--dim:#8a89a6;--on:#ffffff;--c1:#1f78c8;--c2:#a87600;--c3:#d23a3a;--c4:#0f8a55;--c5:#6f45cf;--c6:#cc5a12}
/* soft fills are mixed where data-theme is set, so they follow the live palette (a :root-only rule would freeze them to dark) */
:root,[data-theme]{--f-disp:'Inter',system-ui,-apple-system,sans-serif;--f-mono:'Space Grotesk',ui-monospace,Menlo,monospace;
  --f1:color-mix(in srgb,var(--c1) var(--mix),var(--fig));--f2:color-mix(in srgb,var(--c2) var(--mix),var(--fig));
  --f3:color-mix(in srgb,var(--c3) var(--mix),var(--fig));--f4:color-mix(in srgb,var(--c4) var(--mix),var(--fig));
  --f5:color-mix(in srgb,var(--c5) var(--mix),var(--fig));--f6:color-mix(in srgb,var(--c6) var(--mix),var(--fig));
  --acc:var(--c1);--stage-w:min(1240px,calc(100vw - 32px))}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:var(--f-disp);font-size:18px;line-height:1.55;-webkit-font-smoothing:antialiased;
  padding:28px 16px 64px;transition:background .2s,color .2s}
b,strong{font-weight:700}
code,.mono{font-family:var(--f-mono);font-size:.92em}
a{color:var(--c1)}

/* header: compact so the stage owns the screen */
.top{max-width:var(--stage-w);margin:0 auto 22px;display:flex;align-items:flex-end;gap:20px;flex-wrap:wrap;
  border-bottom:3px solid var(--line);padding-bottom:16px}
.top .tx{flex:1;min-width:260px}
.eyebrow{display:inline-block;font-family:var(--f-mono);font-weight:700;font-size:12px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--on);background:var(--acc);border:2px solid var(--line);box-shadow:3px 3px 0 var(--line);padding:3px 10px;margin-bottom:12px}
h1{font-size:clamp(26px,3.4vw,40px);font-weight:900;text-transform:uppercase;letter-spacing:-.025em;line-height:1}
.sub{font-family:var(--f-mono);font-size:14px;color:var(--muted);margin-top:8px}.sub::before{content:"// ";color:var(--acc)}
.tog{display:flex;border:2px solid var(--line);box-shadow:3px 3px 0 var(--line-dim)}
.tog button{font:700 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;padding:6px 12px;border:0;background:var(--surf);color:var(--ink);cursor:pointer}
.tog button[aria-pressed=true]{background:var(--line);color:var(--bg)}

/* the stage card: the figure is the hero */
.card{position:relative;max-width:var(--stage-w);margin:0 auto 40px;background:var(--surf);border:3px solid var(--line);
  box-shadow:8px 8px 0 var(--acc);padding:20px 22px 18px}
.head{display:flex;align-items:baseline;gap:14px;min-height:34px;padding-right:44px;margin-bottom:12px}
.phase{font:700 11px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--on);background:var(--acc);border:2px solid var(--line);padding:2px 8px;white-space:nowrap}
.stitle{font-size:clamp(18px,2vw,24px);font-weight:850;letter-spacing:-.01em;line-height:1.15}
.fig{position:relative;background:var(--fig);border:2px solid var(--line);overflow:hidden}
.fig svg,.fig canvas{display:block;width:100%;height:auto;max-height:70vh;margin:0 auto}
.fig svg text{font-family:var(--f-disp)}
.fig svg .mono{font-family:var(--f-mono)}
.cap{min-height:2.9em;margin:12px auto 0;max-width:62ch;text-align:center;font-size:clamp(15px,1.5vw,18px);color:var(--ink)}
.cap .k{font-family:var(--f-mono);color:var(--muted);font-size:.85em;margin-right:.5em}
.ib{position:absolute;top:16px;right:18px;width:32px;height:32px;border:2px solid var(--line);background:var(--acc);color:var(--on);
  font:900 15px var(--f-mono);cursor:pointer;box-shadow:3px 3px 0 var(--line)}
.ib[aria-expanded=true]{background:var(--line);color:var(--bg)}

/* step navigation: one line, 75% of the figure, centred */
.nav{display:flex;align-items:center;gap:12px;width:75%;margin:12px auto 0;padding:6px 14px;border:2px solid var(--line);background:var(--surf);box-shadow:4px 4px 0 var(--line-dim)}
.nav button{font:900 16px var(--f-mono);width:34px;height:30px;border:2px solid var(--line);background:var(--surf2);color:var(--ink);cursor:pointer;flex:none}
.nav button:disabled{opacity:.35;cursor:default}
.nav input[type=range]{flex:1;min-width:0;height:44px;accent-color:var(--acc);cursor:pointer}
.nav .ctr{font:700 13px var(--f-mono);color:var(--muted);white-space:nowrap;min-width:52px;text-align:right}

/* sliders for interactive figures */
.ctl{display:flex;flex-wrap:wrap;gap:10px 28px;justify-content:center;margin:14px auto 0;max-width:94%}
.ctl label{display:flex;align-items:center;gap:10px;font:700 12px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);min-width:240px;flex:1;max-width:420px}
.ctl label span{white-space:nowrap}
.ctl input[type=range]{flex:1;min-width:90px;height:36px;accent-color:var(--acc)}
.ctl output{font:700 14px var(--f-mono);color:var(--ink);min-width:48px;text-align:right}
.ctl .btn{font:700 12px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;padding:8px 14px;border:2px solid var(--line);background:var(--surf2);color:var(--ink);cursor:pointer;box-shadow:3px 3px 0 var(--line-dim)}

/* info drawer: detail lives here, not on the figure */
.drawer{display:none;margin:14px 0 0;padding:14px 18px;border:2px solid var(--line);background:var(--surf2);box-shadow:4px 4px 0 var(--line-dim);font-size:15px;line-height:1.55}
.drawer.open{display:block}
.drawer p+p,.drawer ul{margin-top:.5em}.drawer ul{padding-left:1.2em}
.drawer h4{font:700 12px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--acc);margin-bottom:6px}

/* article layout: short prose between wide figures */
.prose{max-width:68ch;margin:0 auto 26px;font-size:19px}
.prose p+p{margin-top:.8em}
.prose h2{font-size:clamp(22px,2.6vw,30px);font-weight:900;text-transform:uppercase;letter-spacing:-.02em;margin:46px 0 14px;line-height:1.05}
.prose ul{padding-left:1.2em}.prose li{margin:.25em 0}
.acc1{--acc:var(--c1)}.acc2{--acc:var(--c2)}.acc3{--acc:var(--c3)}.acc4{--acc:var(--c4)}.acc5{--acc:var(--c5)}.acc6{--acc:var(--c6)}

/* study page blocks */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:22px;max-width:var(--stage-w);margin:0 auto 34px}
.tile{background:var(--surf);border:3px solid var(--line);box-shadow:6px 6px 0 var(--acc);padding:18px 20px}
.tile h3{font-size:17px;font-weight:850;text-transform:uppercase;letter-spacing:-.01em;margin-bottom:8px;line-height:1.15}
.tile p,.tile li{font-size:16px}.tile ul{padding-left:1.1em}
.tile .tag{font:700 11px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:6px}
.big{font-size:44px;font-weight:900;letter-spacing:-.03em;line-height:1;color:var(--acc)}
.flip{cursor:pointer}.flip .a{display:none;margin-top:10px;padding-top:10px;border-top:2px dashed var(--line-dim)}.flip.on .a{display:block}
.flip .hint{font:700 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin-top:8px}
.flip.on .hint{display:none}
table.cmp{width:100%;max-width:var(--stage-w);margin:0 auto 34px;border-collapse:collapse;background:var(--surf);border:3px solid var(--line);box-shadow:6px 6px 0 var(--acc)}
table.cmp th,table.cmp td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line-dim);font-size:16px;vertical-align:top}
table.cmp th{font:700 12px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sec{display:block;max-width:var(--stage-w);margin:40px auto 16px;font:700 13px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);border-bottom:2px solid var(--line-dim);padding-bottom:6px}

/* calc engine extras */
.fig .katex{font-size:1em}
.fig foreignObject div{color:var(--ink);font-family:var(--f-disp);line-height:1.2}
.foot{max-width:var(--stage-w);margin:30px auto 0;font:500 12px var(--f-mono);color:var(--dim)}

@media (max-width:700px){
  body{padding:18px 12px 48px;font-size:17px}
  .card{padding:14px 12px;box-shadow:5px 5px 0 var(--acc)}
  .nav{width:100%}
  .fig.pan{overflow-x:auto}.fig.pan svg{min-width:720px;max-height:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head>

<script>/* Proff stage runtime: page shell, scenes, steps, controls, drawing kit, self-audit.

      : `<label><span>${esc(c.label || c.name)}</span><input type="range" name="${c.name}" min="${c.min}" max="${c.max}" step="${c.step ?? 1}" value="${c.value ?? c.min}"><output>${esc((c.fmt ? c.fmt(c.value ?? c.min) : P.fmt(+(c.value ?? c.min))) + (c.unit || ''))}</output></label>`).join('')}</div>`;
  }

    document.querySelectorAll(`[data-s="${s.i}"] .ctl input`).forEach(inp => { if (!(inp.name in s.params)) return; const c = s.controls.find(c => c.name === inp.name);

  // walk: one stage, one slider over every step of every scene
  function buildWalk(root) {

    root.innerHTML = `<section class="card"><div class="head"><span class="phase"></span><span class="stitle"></span></div>${infoBtn}

    root.innerHTML = P.blocks.map((b, bi) => b.prose != null ? `<div class="prose">${b.h ? `<h2>${esc(b.h)}</h2>` : ''}${para(b.prose)}</div>`
      : b.html != null ? b.html
      : `<section class="card ${b.scene.acc ? 'acc' + b.scene.acc : ''}" data-s="${b.scene.i}">${(b.scene.title || b.scene.phase) ? `<div class="head">${b.scene.phase ? `<span class="phase">${esc(b.scene.phase)}</span>` : ''}<span class="stitle"></span></div>` : ''}${b.scene.info ? infoBtn : ''}
         ${figure(b.scene)}${controls(b.scene)}<p class="cap" aria-live="polite"></p>${stepNav(b.scene.steps.length)}<div class="drawer"></div></section>`).join('');

      s.el = { fig: card.querySelector('.fig'), cap: card.querySelector('.cap'), title: card.querySelector('.stitle'), info: card.querySelector('.drawer'), ib: card.querySelector('.ib') };
      bindControls(s, card); bindInfo(card);
      const nav = card.querySelector('.nav'); let k = 0;
      const go = (j, instant) => { j = P.clamp(Math.round(j), 0, s.steps.length - 1); const fwd = j === k + 1; k = j; play(s, j, instant || !fwd);
        if (nav) { nav.querySelector('input').value = j; nav.querySelector('.ctr').textContent = `${j + 1} / ${s.steps.length}`;
          nav.querySelector('[data-d="-1"]').disabled = j === 0; nav.querySelector('[data-d="1"]').disabled = j === s.steps.length - 1; } };
      s.go = go;
      if (nav) { nav.querySelectorAll('button').forEach(b => b.onclick = () => go(k + +b.dataset.d)); nav.querySelector('input').addEventListener('input', e => go(+e.target.value, true)); }

  }

      for (const b of g.boxes) { const inside = a.x0 >= b.x0 - 1 && a.x1 <= b.x1 + 1 && a.y0 >= b.y0 - 1 && a.y1 <= b.y1 + 1;
        if (!inside && ov(a, b, 2) > 8 && b.solid) { out.push(`${where}: ${short(a.s)} sits across a shape edge`); break; } }
    }
    if (g.words > (s.wordBudget || 40)) out.push(`${where}: ${g.words} words on the figure (budget ${s.wordBudget || 40}); move text to caption/info`);
    const cap = (s.steps[s.k] || {}).cap || ''; if (cap.split(/\s+/).length > 28) out.push(`${where}: caption has ${cap.split(/\s+/).length} words (max 28)`);

  }

  // ---------- boot ----------

      <div class="tog" role="group" aria-label="theme"><button data-t="dark">Dark</button><button data-t="light">Light</button></div></header>`;
    document.body.insertAdjacentHTML('afterbegin', head + '<main id="story"></main>' + (o.foot ? `<p class="foot">${md(o.foot)}</p>` : ''));
    const setT = t => { document.body.dataset.theme = t; document.querySelectorAll('.tog button').forEach(b => b.setAttribute('aria-pressed', b.dataset.t === t)); readVars(); P.scenes.forEach(s => s.el && draw(s, s.k || 0, 1)); };
    document.querySelectorAll('.tog button').forEach(b => b.onclick = () => setT(b.dataset.t));
    readVars();
    const root = document.getElementById('story');

  }
  const start = () => (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(() => {
    const imgs = Object.entries(P.assets).map(([k, v]) => new Promise(r => { const im = new Image(); im.onload = im.onerror = r; im.src = v; P.images[k] = im; }));
    return Promise.all(imgs); }).then(boot).catch(e => { P.errors.push('boot: ' + e.message); console.error(e); });

</script><script>/* Proff calc engine: replays a calctrace.py trace. Proff.calc(trace, {phase, acc}) adds one scene per operation.

(function () {

        draw: (g, j, t) => (st.op === 'dist' ? drawDist : drawOp)(g, st, plan[j], t, TS) });

      } });
  }

  // ---------- where a statistic falls on its distribution ----------
  function drawDist(g, st, pl, t, TS) {
    const prm = st.params, x = st.x, disc = ['pois', 'nb', 'binom'].includes(st.dist);
    const left = st.src ? 420 : 90;
    if (st.src) { const [nm, i, j] = st.src, T = TS[nm], cw = 66, ch = 40;
      const R = T.data.length, C = T.data[0].length, mx = 60 + (T.rows ? 70 : 0), my = (g.H - R * ch) / 2;
      g.text(mx + C * cw / 2, my - 48, T.label, { size: 18, anchor: 'middle', weight: 750, fill: T.color });
      g.matrix(mx, my, T.disp, { cw, ch, rows: T.rows, cols: T.cols, fmt: v => v, size: 18, cell: (a, b) => a === i && b === j ? { fill: fcol(T.color), stroke: T.color, sw: 3, color: T.color } : { op: .5, top: .5 } }); }

    else if (st.dist === 't') { pdf = v => ST.tPdf(v, prm.df); lo = Math.min(-5, x - 1); hi = Math.max(5, x + 1); }
    else if (st.dist === 'chi2') { const k = prm.df; pdf = v => ST.gammaPdf(v, k / 2, .5); lo = 0; hi = Math.max(k + 5 * Math.sqrt(2 * k), x * 1.15); }
    else { const pm = st.dist === 'pois' ? k => ST.poisPmf(k, prm.lam) : st.dist === 'nb' ? k => ST.nbPmf(k, prm.mu, prm.phi) : k => ST.binomPmf(k, prm.n, prm.p);
      pdf = pm; const mu = prm.lam ?? prm.mu ?? prm.n * prm.p; lo = 0; hi = Math.max(Math.ceil(mu * 2.6 + 6), x + 3); if (st.dist === 'binom') hi = prm.n; }
    const ymax = disc ? Math.max(...P.range(lo, hi, hi - lo + 1).map(k => pdf(Math.round(k)))) : Math.max(...P.range(lo, hi, 200).map(pdf));
    const ax = g.axes({ x: left, y: 120, w: g.W - left - 80, h: 380, xd: [lo, hi], yd: [0, ymax * 1.15], xt: 6, yt: 3, xl: st.xlabel || 'value', yl: disc ? 'probability' : 'density', size: 17 });
    const sh = P.seg(t, .3, 1), inTail = v => st.tail === 'upper' ? v >= x : st.tail === 'lower' ? v <= x : Math.abs(v) >= Math.abs(x);
    if (disc) { const ks = []; for (let k = Math.ceil(lo); k <= hi; k++) ks.push(k);
      g.bars(ks.map(k => [k, pdf(k)]), ax, { bw: .8, fill: (k) => inTail(k) && sh > 0 ? 'f3' : 'f1', stroke: 'c1' }); }
    else {
      g.area(pdf, ax, lo, hi, { fill: 'f1' });
      if (sh > 0) { if (st.tail !== 'lower') g.area(pdf, ax, st.tail === 'two' ? Math.abs(x) : x, hi, { fill: 'c3', op: .55 * sh });
        if (st.tail !== 'upper') g.area(pdf, ax, lo, st.tail === 'two' ? -Math.abs(x) : x, { fill: 'c3', op: .55 * sh }); }
      g.curve(pdf, ax, lo, hi, { stroke: 'c1', sw: 3, free: true }); }
    const X = ax.sx(x);
    g.line(X, ax.y - 6, X, ax.y + ax.h, { stroke: 'c3', sw: 3, free: true });
    g.text(X, ax.y - 22, `observed ${P.fmt(x)}`, { size: 20, anchor: X > g.W - 180 ? 'end' : 'middle', fill: 'c3', weight: 750 });
    if (sh > .5) g.text(ax.x + ax.w, ax.y + 30, `p = ${P.fmt(st.p, 3)}`, { size: 28, anchor: 'end', weight: 800, fill: 'c3', mono: true });
    if (st.tex) g.tex(g.W / 2, 50, st.tex, { size: 28, w: 900, h: 60 });
  }
})();
</script><script>/* proff bio kit: native biology primitives drawn with the stage kit, so they follow the theme and the audit.
   Included by build.py only when story.js calls one of them. Each returns anchor points so labels and arrows can attach.
   Base colours: A c4, C c1, G c2, T/U c3 (fixed for the whole page). */
(function () {
  const P = window.Proff; P.plugins = P.plugins || {};
  const BASE = { A: 'c4', C: 'c1', G: 'c2', T: 'c3', U: 'c3', N: 'muted' };
  const COMP = { A: 'T', T: 'A', G: 'C', C: 'G', U: 'A', N: 'N' };
  P.bio = { BASE, comp: s => [...s].map(b => COMP[b] || 'N').join(''), randSeq: (n, r) => Array.from({ length: n }, () => 'ACGT'[Math.floor((r || Math.random)() * 4)]).join('') };

  // DNA double strand, base by base. o: seq (top strand 5'->3'), bw (base width), letters (default when bw>=22), rungs,
  // hi: [[from,to,color,label?]] coloured spans, cut: index (cut between cut-1 and cut on both strands), open: [from,to] melted bubble
  // (bottom strand pushed down), single: true (top strand only), ends: true (5'/3' marks). Returns {x(i), top, bot, w, h}.
  P.plugins.dna = (g, x, y, o = {}) => {
    const seq = o.seq || 'ACGT'.repeat(5), n = seq.length, bw = o.bw || 28, bh = o.bh || bw * .95, gap = o.gap ?? bh * .9, letters = o.letters ?? bw >= 22;
    const cut = o.cut, cs = o.cutShift ?? 0, open = o.open, sep = o.sep ?? 0;   // cs: how far the two halves move apart (0..1)
    const bx = i => x + i * bw + (cut != null && i >= cut ? cs * bw * 1.6 : 0);
    const yb = i => y + bh + gap + (open && i >= open[0] && i < open[1] ? sep : 0);
    const fs = Math.max(12, Math.min(bw * .62, 26));
    const strand = (s, yy, ix, rev) => [...s].forEach((b, i) => { const X0 = bx(i), Y = typeof yy === 'function' ? yy(i) : yy, span = (o.hi || []).find(h => i >= h[0] && i < h[1]);
      g.rect(X0 + 1, Y, bw - 2, bh, { fill: span ? span[2].replace(/^c/, 'f') : 'surf', stroke: span ? span[2] : BASE[b] || 'muted', sw: span ? 2.5 : 1.5, r: 3, free: true });
      if (letters) g.text(X0 + bw / 2, Y + bh / 2, b, { size: fs, anchor: 'middle', weight: 800, mono: true, fill: BASE[b] || 'muted', free: true }); });
    strand(seq, y);
    if (!o.single) {
      const bot = P.bio.comp(seq);
      if (o.rungs !== false) for (let i = 0; i < n; i++) { const yy = yb(i); if (yy - (y + bh) < gap + 2) g.line(bx(i) + bw / 2, y + bh + 2, bx(i) + bw / 2, yy - 2, { stroke: 'line-dim', sw: 1.5, free: true }); }
      strand(bot, yb);
    }
    if (o.ends) { const fsE = Math.max(13, fs * .7);
      g.text(x - 8, y + bh / 2, "5'", { size: fsE, anchor: 'end', fill: 'muted', mono: true, free: true }); g.text(bx(n - 1) + bw + 8, y + bh / 2, "3'", { size: fsE, fill: 'muted', mono: true, free: true });
      if (!o.single) { g.text(x - 8, yb(0) + bh / 2, "3'", { size: fsE, anchor: 'end', fill: 'muted', mono: true, free: true }); g.text(bx(n - 1) + bw + 8, yb(n - 1) + bh / 2, "5'", { size: fsE, fill: 'muted', mono: true, free: true }); } }
    const H = o.single ? bh : bh * 2 + gap + sep;
    g.rect(x, y, bx(n - 1) + bw - x, H, { stroke: 'none', fill: 'none' });   // registers the footprint for the audit only
    return { x: i => bx(i), cx: i => bx(i) + bw / 2, top: y, bot: o.single ? y + bh : yb(0) + bh, mid: y + bh + gap / 2, w: bx(n - 1) + bw - x, h: H, bw, bh };
  };

  // sgRNA: 20-nt spacer as letters (matches the target) + scaffold drawn as a stem-loop tail that Cas9 grips.
  // o: seq (spacer, 5'->3'), bw, color (spacer accent, default c5), scaffold (true), flip (draw spacer right-to-left)
  P.plugins.guide = (g, x, y, o = {}) => {
    const seq = (o.seq || 'GACGTTAGCCTAGGATCCAA').replace(/T/g, 'U'), bw = o.bw || 26, bh = o.bh || bw * .95, col = o.color || 'c1', n = seq.length, fs = Math.max(12, Math.min(bw * .6, 24));
    [...seq].forEach((b, i) => { g.rect(x + i * bw + 1, y, bw - 2, bh, { fill: col.replace(/^c/, 'f'), stroke: col, sw: 2, r: 3, free: true });
      if (o.letters ?? bw >= 20) g.text(x + i * bw + bw / 2, y + bh / 2, b, { size: fs, anchor: 'middle', weight: 800, mono: true, fill: BASE[b], free: true }); });
    const ex = x + n * bw;
    if (o.scaffold !== false) {   // scaffold: a backbone that runs on and folds into three hairpins
      const s = o.ss || bw / 26, c = o.scol || 'c1', st = { stroke: c, sw: 4 * Math.max(.6, s), fill: undefined };
      g.path(`M${ex} ${y + bh / 2} h${18 * s} c${10 * s} 0 ${14 * s} ${-36 * s} ${26 * s} ${-36 * s} s${16 * s} ${36 * s} ${26 * s} ${36 * s} h${12 * s} c${8 * s} 0 ${12 * s} ${-28 * s} ${22 * s} ${-28 * s} s${12 * s} ${28 * s} ${22 * s} ${28 * s} h${10 * s} c${8 * s} 0 ${10 * s} ${-22 * s} ${18 * s} ${-22 * s} s${10 * s} ${22 * s} ${18 * s} ${22 * s} h${16 * s}`, st);
    }
    g.rect(x, y, n * bw, bh, { stroke: 'none', fill: 'none' });
    return { x: i => x + i * bw, cx: i => x + i * bw + bw / 2, end: ex, w: n * bw + (o.scaffold !== false ? 230 * (o.ss || bw / 26) : 0), y, bh };
  };

  // Cas9: two-lobed protein outline (recognition lobe + nuclease lobe) with a channel. o: w, fill, op, cut (show scissors marks at x offset)
  P.plugins.cas9 = (g, cx, cy, o = {}) => {   // one soft body the DNA runs through. o: w, h, label, fill, stroke
    const w = o.w || 300, h = o.h || w * .5, f = o.fill || 'f6', st = o.stroke || 'c6', x = cx - w / 2, y = cy - h / 2;
    g.rect(x, y, w, h, { fill: f, stroke: st, sw: 3, r: Math.min(60, h * .3), op: o.op, free: true });   // container: text inside is intended
    if (o.label !== false) g.text(x + 8, y - 16, 'Cas9', { size: 24, weight: 900, fill: st });
    return { cx, cy, w, h, top: y, bot: y + h, left: x, right: x + w };
  };

  // Cell with membrane, cytoplasm and nucleus. o: rx, ry (default r), nucleus (true), fill, stroke, dna (draw chromatin squiggle), op
  P.plugins.cell = (g, cx, cy, r, o = {}) => {
    const rx = o.rx || r, ry = o.ry || r * .82, nr = r * .38;
    g.ellipse(cx, cy, rx, ry, { fill: o.fill || 'surf2', stroke: o.stroke || 'c4', sw: o.sw || 3, op: o.op });
    if (o.nucleus !== false) { g.ellipse(cx + rx * .12, cy + ry * .05, nr * 1.15, nr, { fill: o.nfill || 'f5', stroke: o.nstroke || 'c5', sw: 2.5, op: o.op });
      if (o.dna) { const pts = P.range(0, 1, 40).map(t => [cx + rx * .12 - nr * .8 + t * nr * 1.6, cy + ry * .05 + Math.sin(t * 18) * nr * .25]); g.poly(pts, { stroke: 'c5', sw: 2, free: true }); } }
    g.rect(cx - rx, cy - ry, rx * 2, ry * 2, { stroke: 'none', fill: 'none' });
    return { cx, cy, rx, ry, nx: cx + rx * .12, ny: cy + ry * .05, nr };
  };
  P.plugins.nucleus = (g, cx, cy, r, o = {}) => { g.ellipse(cx, cy, r * 1.15, r, { fill: o.fill || 'f5', stroke: o.stroke || 'c5', sw: 2.5, op: o.op }); return { cx, cy, r }; };

  // Lentivirus particle: envelope, spikes, capsid cone with two RNA strands. o: op, color
  P.plugins.virus = (g, cx, cy, r, o = {}) => {
    const c = o.color || 'c3';
    for (let k = 0; k < 14; k++) { const a = k / 14 * Math.PI * 2, x1 = cx + Math.cos(a) * r, y1 = cy + Math.sin(a) * r, x2 = cx + Math.cos(a) * r * 1.22, y2 = cy + Math.sin(a) * r * 1.22;
      g.line(x1, y1, x2, y2, { stroke: c, sw: 2.5, free: true }); g.circle(x2, y2, Math.max(2.5, r * .07), { fill: c, stroke: 'none', free: true }); }
    g.circle(cx, cy, r, { fill: 'surf2', stroke: c, sw: 3, op: o.op, free: true });
    g.path(`M${cx - r * .45} ${cy - r * .35} L${cx + r * .5} ${cy - r * .18} L${cx + r * .5} ${cy + r * .18} L${cx - r * .45} ${cy + r * .35} Z`, { fill: o.cfill || 'f2', stroke: 'c2', sw: 2 });
    [-1, 1].forEach(sg => g.poly(P.range(0, 1, 20).map(t => [cx - r * .32 + t * r * .7, cy + sg * r * .08 + Math.sin(t * 12) * r * .05]), { stroke: 'c1', sw: 2, free: true }));
    g.rect(cx - r * 1.2, cy - r * 1.2, r * 2.4, r * 2.4, { stroke: 'none', fill: 'none' });
    return { cx, cy, r };
  };

  // Plasmid ring with coloured parts. parts: [{from, to, color}] in fractions of the ring (0 = top, clockwise). Returns at(f, k) -> point at radius k*r.
  P.plugins.plasmid = (g, cx, cy, r, o = {}) => {
    g.circle(cx, cy, r, { stroke: 'line', sw: o.sw || 6, free: true });
    const at = (f, k = 1) => [cx + Math.sin(f * 2 * Math.PI) * r * k, cy - Math.cos(f * 2 * Math.PI) * r * k];
    (o.parts || []).forEach(p => { const pts = P.range(p.from, p.to, 40).map(f => at(f)); g.poly(pts, { stroke: p.color || 'c1', sw: (o.sw || 6) * 2.2, free: true }); });
    g.rect(cx - r, cy - r, r * 2, r * 2, { stroke: 'none', fill: 'none' });
    return { cx, cy, r, at };
  };

  // Lab ware. tube(x, y, h, {level 0..1, fill}) is a microcentrifuge tube with its top-left at x,y; dish(cx, cy, r, {cells, seed, color})

    const w = h * .36, body = h * .72, lv = o.level ?? .45;

    g.path(shape, { stroke: 'ink', sw: 2.5 }); g.rect(x - 6, y - 10, w + 12, 10, { fill: 'surf2', stroke: 'ink', sw: 2.5, r: 3, free: true });
    g.rect(x - 6, y - 10, w + 12, h + 10, { stroke: 'none', fill: 'none' });

  };
  P.plugins.dish = (g, cx, cy, r, o = {}) => {
    g.ellipse(cx, cy, r, r * .34, { fill: 'surf2', stroke: 'ink', sw: 2.5 }); g.ellipse(cx, cy - 6, r * .94, r * .3, { fill: o.media || 'fig', stroke: 'line-dim', sw: 1.5 });

  };

  // Sequencing flow cell lane with clusters; clusters coloured by a function (i) -> color. o: lanes, n, color
  P.plugins.flowcell = (g, x, y, w, h, o = {}) => {
    g.rect(x, y, w, h, { fill: 'surf2', stroke: 'ink', sw: 2.5, r: 12, free: true });
    const L = o.lanes || 4, lh = (h - 24) / L, rr = P.rng(o.seed || 9), n = o.n || 40;
    for (let l = 0; l < L; l++) { g.rect(x + 14, y + 12 + l * lh + 4, w - 28, lh - 8, { fill: 'fig', stroke: 'line-dim', sw: 1.5, r: 6, free: true });
      for (let i = 0; i < n; i++) { const c = o.color ? o.color(l * n + i) : ['c1', 'c2', 'c3', 'c4'][Math.floor(rr() * 4)]; g.circle(x + 24 + rr() * (w - 48), y + 12 + l * lh + 10 + rr() * (lh - 20), 4, { fill: c, stroke: 'none', free: true }); } }
    g.rect(x, y, w, h, { stroke: 'none', fill: 'none' });
    return { x, y, w, h };
  };

  // One sequencing read drawn as labelled segments: parts [{len, color, text}] with total width w. Returns segment centres.
  P.plugins.read = (g, x, y, o = {}) => {
    const parts = o.parts || [{ len: 1, color: 'c1' }], tot = parts.reduce((s, p) => s + p.len, 0), w = o.w || 600, h = o.h || 34, out = []; let xx = x;
    parts.forEach(p => { const pw = p.len / tot * w; const pc = p.color || 'c1', soft = /^c[1-6]$/.test(pc) ? pc.replace('c', 'f') : 'surf2'; g.rect(xx, y, pw, h, { fill: soft, stroke: pc, sw: 2, free: true });
      if (p.text) g.text(xx + pw / 2, y + h / 2, p.text, { size: Math.max(13, Math.min(18, h * .5)), anchor: 'middle', mono: true, weight: 700, fill: p.color || 'ink', tick: 1 });
      out.push({ x0: xx, x1: xx + pw, cx: xx + pw / 2 }); xx += pw; });
    g.rect(x, y, w, h, { stroke: 'none', fill: 'none' });
    return { parts: out, x, y, w, h };
  };
  P.plugins.rna = (g, x, y, o = {}) => P.plugins.dna(g, x, y, { ...o, single: true, seq: (o.seq || 'ACGU').replace(/T/g, 'U') });
})();

<script>
// Biology walk exemplar: a pooled CRISPR knockout screen, from DNA letters to the count matrix. Layout 'walk': one stage, one slider.
// All sequences and counts come from make_data.py (data/crispr.json). Identity colours hold across scenes:
// guide spacer c1, PAM c2, cut c3; essential-gene guides warm (RPL3 c3, POLR2A c5), control guides cool (AAVS1 c4, NT c6).
const D = PROFF_DATA.crispr, P_ = Proff;
P_.page({ title: 'A CRISPR knockout screen', sub: 'From 20 letters of DNA to a count matrix', eyebrow: 'biology walk' });
const on = (k, j, t) => k > j ? 1 : k === j ? t : 0;
const GENE_COL = { RPL3: 'c3', POLR2A: 'c5', AAVS1: 'c4', NT: 'c6' }, gcol = r => GENE_COL[r.split('_')[0]];
const BW = 30, X0 = (1200 - D.seq.length * BW) / 2, T = [D.t0, D.t1], PAM = D.pam;
const hi = [[T[0], T[1], 'c1'], [PAM[0], PAM[1], 'c2']];
const guideSeq = D.seq.slice(T[0], T[1]);

P_.scene({ title: 'The target: 20 letters in a gene', phase: 'design', acc: 1,
  steps: [{ cap: 'The start of a gene: two DNA strands, paired letter by letter (A with T, C with G).', info: 'The sequence is made up for this page. Real guides are picked by design tools that score on-target cutting and off-target matches.' },
    { cap: 'Pick 20 letters that sit right before **AGG**. That AGG is the **PAM**, the tag Cas9 must find first.', info: '**PAM** = protospacer adjacent motif. The common Cas9 (SpCas9) needs **NGG** (any letter, then GG) right after the target. No PAM, no cut.' }],
  draw(g, k, t) {
    const d = g.dna(X0, 290, { seq: D.seq, bw: BW, hi: k >= 1 ? hi : [], ends: true });
    g.label(d.cx(1), d.bot + 70, 'ATG: the gene starts here', { to: [d.cx(1), d.bot + 4], size: 20, fill: 'muted', weight: 600, anchor: 'start' });
    if (k >= 1) g.fade(t, g => { g.brace(d.x(T[0]), 252, d.x(T[1]), 252, '20-letter target', { stroke: 'c1', fill: 'c1', size: 22 });
      g.label(d.cx(PAM[0] + 1), 480, 'PAM', { to: [d.cx(PAM[0] + 1), d.bot + 6], size: 22, weight: 800, anchor: 'middle', fill: 'c2', lc: 'c2' }); });
  } });

P_.scene({ title: 'The guide RNA carries those letters', phase: 'design', acc: 1,
  steps: [{ cap: 'The **sgRNA** (single guide RNA): the same 20 letters, with U in place of T, plus a folded tail.' },
    { cap: 'The **spacer** finds the target. The **scaffold** is the handle Cas9 holds.', info: 'The spacer reads like the top strand, so it base-pairs with the bottom strand. The scaffold is identical in every guide of the library; only the 20-letter spacer changes.' }],
  draw(g, k, t) {
    const d = g.dna(X0, 360, { seq: D.seq, bw: BW, hi, ends: true });
    const gd = g.guide(d.x(T[0]), 190, { seq: guideSeq, bw: BW });
    if (k >= 1) g.fade(t, g => { g.brace(gd.x(0), 180, gd.x(20), 180, 'spacer', { stroke: 'c1', fill: 'c1', size: 22 });
      g.text(gd.end + 150, 108, 'scaffold', { size: 22, weight: 800, fill: 'c1', anchor: 'middle' }); });
  } });

P_.scene({ title: 'Cas9 opens the DNA and cuts', phase: 'cut', acc: 5,
  steps: [{ cap: 'Cas9 protein holds the guide and slides along DNA, checking every NGG.' },
    { cap: 'At the match the strands part. The guide pairs with one strand, letter by letter.' },
    { cap: 'Cas9 cuts **both** strands, 3 letters before the PAM.' },
    { cap: 'A **double-strand break**. The cell has to repair it.' }],
  draw(g, k, t) {
    const sep = k === 1 ? 74 * t : k === 2 ? 74 : k === 3 ? 74 * (1 - t) : 0, cs = k === 3 ? t : 0, y = 290;
    const casOp = k <= 2 ? 1 : 1 - t, cx = X0 + (T[0] + 10) * BW;
    const dy = k === 0 ? (1 - t) * -30 : 0;
    const top = y - 120, bot = y + BW * .95 * 2.9 + sep + 40;   // body spans guide, both strands and the bubble
    if (casOp > .02) g.fade(casOp, g => g.cas9(X0 + 15 * BW, (top + bot) / 2 + dy, { w: 28 * BW, h: bot - top }));
    const d = g.dna(X0, y, { seq: D.seq, bw: BW, hi, open: [T[0], T[1]], sep, cut: k >= 2 ? D.cut : null, cutShift: cs });
    // the guide settles onto the strand it pairs with
    if (casOp > .02) g.fade(casOp, g => { const low = y + BW * .95 * 1.9 + sep, gy = k === 0 ? y - 90 : P_.lerp(y - 90, low - BW * .95 - 6, k === 1 ? t : 1); g.guide(d.x(T[0]), gy, { seq: guideSeq, bw: BW, scaffold: false }); });
    if (k >= 2) g.fade(k === 2 ? t : 1, g => { const x = (d.x(D.cut - 1) + BW + d.x(D.cut)) / 2;
      [y - 18, y + BW * .95 * 2.9 + sep + 18].forEach((yy, i) => g.poly([[x - 11, yy + (i ? 14 : -14)], [x + 11, yy + (i ? 14 : -14)], [x, yy]], { fill: 'c3', stroke: 'c3', close: true }));
      g.text(x, y - 56, 'cut', { size: 22, weight: 800, fill: 'c3', anchor: 'middle' }); });
  } });

P_.scene({ title: 'Sloppy repair breaks the gene', phase: 'knockout', acc: 3,
  steps: [{ cap: 'Repair often adds or loses a few letters. Here one letter is lost at the cut.' },
    { cap: 'Read in threes, every codon after the gap shifts. A **stop** appears early, so the protein is cut short.', info: 'The cell joins the ends by **NHEJ** (non-homologous end joining), which often leaves small insertions or deletions. Two out of three indel sizes shift the reading frame. An in-frame indel can leave a working protein, so a cut is not always a knockout; that is one reason libraries use ~4 guides per gene.' }],
  draw(g, k, t) {
    const row = (seq, aa, y, label, mark) => {
      const d = g.dna(X0, y, { seq, bw: BW, single: true });
      g.text(X0 - 14, y + 14, label, { size: 18, anchor: 'end', fill: 'muted', weight: 700 });
      for (let c = 0; c * 3 + 2 < seq.length; c++) g.rect(d.x(c * 3) + 1, y - 3, BW * 3 - 2, BW * .95 + 6, { stroke: 'line', sw: 2, r: 4, fill: 'none', free: true });
      if (k >= 1) g.fade(t, g => [...aa.slice(0, (aa.indexOf('*') + 1) || aa.length)].forEach((a, c) => g.text(d.x(c * 3) + BW * 1.5, y + 66, a === '*' ? 'STOP' : a, { size: a === '*' ? 18 : 26, anchor: 'middle', weight: 900, mono: true, fill: a === '*' ? 'c3' : (mark && c * 3 + 3 > D.cut - 1 ? 'c5' : 'ink') })));
      return d; };
    row(D.seq, D.aa, 170, 'before');
    const d2 = row(D.mut, D.aa_mut, 400, 'after', true);
    const x = d2.x(D.cut - 1);
    g.label(x, 520, 'letter lost', { to: [x, 434], size: 20, weight: 800, anchor: 'middle', fill: 'c3', lc: 'c3' });
  } });

const cellsIn = (g, cx, cy, rx, ry, n, colOf, opOf, seed) => { const r = P_.rng(seed);
  for (let i = 0; i < n; i++) { const a = r() * 6.283, q = Math.sqrt(r()) * .86, c = colOf(i, r);
    g.ellipse(cx + Math.cos(a) * rx * q, cy + Math.sin(a) * ry * q, 11, 7, { fill: c.replace(/^c/, 'f'), stroke: c, sw: 2, op: opOf ? opOf(i, c) : 1 }); } };
const pick = (r, w) => { let x = r() * w.reduce((a, b) => a + b[1], 0); for (const [c, v] of w) if ((x -= v) < 0) return c; return w[0][0]; };

P_.scene({ title: 'One guide per cell', phase: 'library', acc: 6,
  steps: [{ cap: 'Each guide sits in a **plasmid** (a ring of DNA). A genome-wide library holds ~4 guides for every gene.' },
    { cap: 'Packaging cells turn the plasmids into **lentivirus** that can deliver a guide into a cell’s genome.' },
    { cap: 'Infect at a low dose (**MOI** ≈ 0.3), so an infected cell almost always gets just one guide.', info: '**MOI** = multiplicity of infection: viruses per cell. At 0.3, most cells get none, and of the infected ones about 85% get exactly one. Screens also keep **coverage**, often ≥ 500 cells per guide, so no guide is lost by chance.' },
    { cap: 'An antibiotic (**puromycin**) kills cells with no guide. Every survivor carries one.' }],
  draw(g, k, t) {
    const pl = g.plasmid(200, 330, 110, { parts: [{ from: .03, to: .12, color: 'c1' }, { from: .4, to: .62, color: 'c6' }] });
    g.label(...pl.at(.075, 1.45), 'guide', { to: pl.at(.075, 1.08), size: 20, weight: 800, fill: 'c1', lc: 'c1', anchor: 'start' });
    g.label(...pl.at(.51, 1.42), 'puro resistance', { to: pl.at(.51, 1.08), size: 18, weight: 700, fill: 'c6', lc: 'c6', anchor: 'middle' });
    if (k >= 1) g.fade(on(k, 1, t), g => { g.arrow(340, 330, 440, 330, { stroke: 'muted', sw: 3 }); [[520, 250], [560, 360], [500, 450]].forEach(([x, y]) => g.virus(x, y, 38)); });
    if (k >= 2) g.fade(on(k, 2, t), g => { g.arrow(610, 340, 680, 340, { stroke: 'muted', sw: 3 });
      g.dish(930, 360, 230, { cells: 0 });
      cellsIn(g, 930, 354, 205, 64, 46, (i, r) => i % 3 === 0 ? pick(r, [['c3', 1], ['c5', 1], ['c4', 1], ['c6', 1]]) : 'muted', (i, c) => c === 'muted' && k >= 3 ? 1 - on(k, 3, t) : 1, 21); });
  } });

const share = arr => { const s = {}; D.rows.forEach((r, i) => { const gname = r.split('_')[0]; s[gname] = (s[gname] || 0) + arr[i]; }); const tot = Object.values(s).reduce((a, b) => a + b, 0); for (const k in s) s[k] /= tot; return s; };
const S0 = share(D.d0), S21 = share(D.d21);

P_.scene({ title: 'Weeks later, some guides drop out', phase: 'screen', acc: 3,
  steps: [{ cap: 'Grow the cells for about three weeks, keeping enough cells for every guide.' },
    { cap: 'Cells whose guide broke an **essential gene** (RPL3, POLR2A) stop dividing. Their share shrinks.' }],
  draw(g, k, t) {
    const dish = (cx, S, label, seed) => { g.dish(cx, 300, 250, { cells: 0 }); const w = Object.entries(S).map(([gname, v]) => [GENE_COL[gname], v]);
      cellsIn(g, cx, 294, 225, 70, 60, (i, r) => pick(r, w), null, seed); g.text(cx, 420, label, { size: 22, weight: 800, anchor: 'middle' }); };
    dish(320, S0, 'day 0', 5); dish(880, k >= 1 ? S21 : S0, 'day 21', 5);
    const bar = (x, S, y) => { let xx = x; ['RPL3', 'POLR2A', 'AAVS1', 'NT'].forEach(gname => { const w = S[gname] * 440; g.rect(xx, y, w, 34, { fill: GENE_COL[gname].replace('c', 'f'), stroke: GENE_COL[gname], sw: 2, free: true });
      if (w > 60) g.text(xx + w / 2, y + 17, `${Math.round(S[gname] * 100)}%`, { size: 16, anchor: 'middle', weight: 700, mono: true, fill: GENE_COL[gname], free: true }); xx += w; }); };
    bar(100, S0, 470); bar(660, k >= 1 ? S21 : S0, 470);
    [['RPL3', 'c3'], ['POLR2A', 'c5'], ['AAVS1', 'c4'], ['NT (no target)', 'c6']].forEach(([n, c], i) => { g.rect(150 + i * 250, 572, 22, 22, { fill: c.replace('c', 'f'), stroke: c, sw: 2 }); g.text(182 + i * 250, 583, n, { size: 18, weight: 700, fill: c }); });
  } });

P_.scene({ title: 'Read the guides back', phase: 'sequence', acc: 4,
  steps: [{ cap: 'Harvest DNA from each sample. Each cell’s guide is now part of its genome.' },
    { cap: '**PCR** copies just the guide region, millions of times. It copies DNA, not cells.' },
    { cap: 'A sequencer reads the copies: billions of short reads.' },
    { cap: 'Each read = adapter + sample tag + the 20-letter spacer. The spacer names the guide.' }],
  draw(g, k, t) {
    const tb = g.tube(110, 140, 220, { level: .45, fill: 'f1' }); g.text(tb.cx, 400, 'genomic DNA', { size: 20, weight: 700, anchor: 'middle' });
    if (k >= 1) g.fade(on(k, 1, t), g => { g.arrow(220, 250, 300, 250, { stroke: 'muted', sw: 3 });
      const r = P_.rng(4); for (let i = 0; i < 9; i++) for (let j = 0; j < 2; j++) { const c = ['c3', 'c5', 'c4', 'c6'][Math.floor(r() * 4)]; g.rect(330 + j * 120, 150 + i * 24, 100, 14, { fill: c.replace('c', 'f'), stroke: c, sw: 1.5, r: 3, free: true }); }
      g.text(440, 400, 'guide copies', { size: 20, weight: 700, anchor: 'middle' }); });
    if (k >= 2) g.fade(on(k, 2, t), g => { g.arrow(580, 250, 660, 250, { stroke: 'muted', sw: 3 }); g.flowcell(690, 130, 420, 240, { lanes: 4, n: 34 }); g.text(900, 400, 'sequencer flow cell', { size: 20, weight: 700, anchor: 'middle' }); });
    if (k >= 3) g.fade(on(k, 3, t), g => { const rd = g.read(110, 480, { w: 1000, h: 44, parts: [{ len: 3, color: 'muted', text: 'adapter' }, { len: 2.4, color: 'c2', text: 'sample tag' }, { len: 10, color: 'c1', text: guideSeq }, { len: 2.4, color: 'muted', text: 'scaffold' }] });
      g.brace(rd.parts[2].x1, 534, rd.parts[2].x0, 534, 'the guide we designed', { stroke: 'c1', fill: 'c1', size: 20 }); });
  } });

P_.scene({ title: 'The count matrix', phase: 'analysis', acc: 2,
  steps: [{ cap: 'Count reads for every guide in every sample. Rows are guides, columns are samples.' },
    { cap: 'Scale to the control guides, then take **log₂ fold change**: −3 means 8× fewer cells.', info: 'LFC = log₂( (day 21 count / control total at day 21) ÷ (day 0 count / control total at day 0) ). Scaling to control guides (AAVS1, non-targeting) is MAGeCK’s *control* normalisation; scaling to all guides also works when most guides are neutral, as in a real genome-wide library.' },
    { cap: 'Guides of the same gene agree. Tools like **MAGeCK** turn that agreement into a gene-level score.' }],
  draw(g, k, t) {
    const cw = 120, ch = 38, x = 380, y = 110;
    const M = g.matrix(x, y, D.rows.map((r, i) => [D.d0[i], D.d21[i]]), { cw, ch, cols: ['day 0', 'day 21'], rows: D.rows, rowFill: i => gcol(D.rows[i]), size: 19,
      cell: (i, j) => j === 1 && k >= 1 ? { fill: gcol(D.rows[i]).replace('c', 'f') } : {} });
    if (k >= 1) g.fade(on(k, 1, t), g => { g.text(x + 2 * cw + 30, y + ch * 6, '→', { size: 34, anchor: 'middle', fill: 'muted', weight: 800 });
      g.matrix(x + 2 * cw + 60, y, D.lfc.map(v => [v]), { cw: 130, ch, cols: ['log₂ FC'], size: 19, fmt: v => (v > 0 ? '+' : '') + v.toFixed(2),
        cell: (i, j, v) => ({ fill: v < -1 ? 'f3' : 'surf', color: v < -1 ? 'c3' : 'ink' }) }); });
    if (k >= 2) g.fade(on(k, 2, t), g => { const gx = x + 2 * cw + 210, mean = (a, b) => D.lfc.slice(a, b).reduce((s, v) => s + v, 0) / (b - a);
      [['RPL3', 0, 4], ['POLR2A', 4, 8]].forEach(([n, a, b]) => g.brace(gx, y + a * ch + 4, gx, y + b * ch - 4, `${n} ${mean(a, b).toFixed(1)}`, { stroke: GENE_COL[n], fill: GENE_COL[n], size: 22 }));
      g.brace(gx, y + 8 * ch + 4, gx, y + 12 * ch - 4, 'controls ≈ 0', { stroke: 'c4', fill: 'c4', size: 22 }); });
  } });

</script>
</body></html>
