<title>MAGeCK-MLE, count by count</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.css"><script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.js"></script>
<style>/* Proff visual kit. BlockFrame chrome (thick borders, hard offset shadows, heavy Inter, Space Grotesk labels)
   around clean figures. Dark only. Every colour is a token. Authors never edit this file. */
/* v5 mono: one hot accent; meaningful pairs checked by palette-check.py. */
:root,[data-theme=dark],[data-palette=mono][data-theme=dark]{
  --bg:#0b0c0e;--fig:#171819;--surf:#171819;--surf2:#242526;--line:#565653;--line-dim:#353634;--grid:#222322;
  --ink:#f2f2f0;--muted:#b6b4ad;--dim:#85837d;--on:#0b0c0e;
  --c1:#7fb0ff;--c2:#ff5a36;--c3:#5fdcc4;--c4:#9aabc2;--c5:#8e9d99;--c6:#7c7a76;--mix:20%;
}
/* mono chrome orange: a calm tint of the accent's hue for the page title, step strip, read outlines and sidebar.
   tint #ffb27f: 8.7-11.1:1 on every surface; CIEDE2000 vs accent 20.6 normal / 20.0 protan / 12.9 deutan (never the only cue on the stage: read = outline, answer = solid tile).
   tint-hi #ffd6b8: sidebar values, 11.4:1+. tint-lo: lines only, no text. */
/* user (2026-10-15): page title, step strip, DETAILS tag and sidebar headings use the bright accent #ff5a36 (6.3:1 on --bg);
   the soft tint #ffb27f stays only for the 'being read' cell outlines on the stage (P.shade.tint in stage.js). */
[data-palette=mono][data-theme=dark]{--tint:#ff5a36;--tint-hi:#ffd6b8;--tint-lo:#6b4631;--acc:var(--tint)}
/* page title only: the bright accent (same orange as the plot answer), 6.3:1 on --bg; strip, outlines and sidebar keep the tint. */
[data-palette=mono][data-theme=dark] h1{color:var(--c2)}
[data-palette=cyan][data-theme=dark]{   /* default palette "cyan": cyan blue and cyan green carry the figure; amber is the one warm highlight.
     Hues picked by search for colour-blind separation (CIEDE2000, Machado 2009 deutan/protan): c1-c3, c1-c2, c2-c3 stay >= ~20 for every reader.
     c1, c4, c5 and c6 are all cool and sit 15-18 apart: never let two of them carry a contrast alone (add a label, dash, or shape). */
  --bg:#0a0b0d;--fig:#111316;--surf:#171a1d;--surf2:#21252a;--line:#56616b;--line-dim:#2a3036;--grid:#21262b;
  --ink:#f0fbff;--muted:#a3b1bb;--dim:#6b7882;--on:#000000;
  --c1:#72c9f5;--c2:#f3a833;--c3:#6bebb6;--c4:#4f91f0;--c5:#c7ebee;--c6:#8f99a4;--mix:20%;
}
[data-palette=blockframe][data-theme=dark]{   /* preset "blockframe" (the v4.0 default): Block Frame pastels (frontend-slides, MIT) on black.
     c2 and c5 are both warm and light: never let them carry a contrast alone. */
  --bg:#0b0b0c;--fig:#121214;--surf:#18181b;--surf2:#232327;--line:#5a5a63;--line-dim:#2c2c31;--grid:#232327;
  --ink:#fffdf5;--muted:#a9a9b2;--dim:#6e6e76;--on:#000000;
  --c1:#8feaf7;--c2:#f5c030;--c3:#fe90e8;--c4:#99e885;--c5:#ffdc8b;--c6:#b7b4c7;--mix:20%;
}
[data-palette=lab][data-theme=dark]{   /* preset "lab": Okabe-Ito hues */
  --bg:#0e1116;--fig:#12161c;--surf:#171c23;--surf2:#1e242d;--line:#e8ecf2;--line-dim:#343c48;--grid:#222934;
  --ink:#eef2f7;--muted:#9aa5b5;--dim:#6a7584;--on:#0e1116;
  --c1:#5cb8f0;--c2:#f0b43c;--c3:#f2694a;--c4:#3ccf9e;--c5:#c98ae6;--c6:#cfdc5a;--mix:22%;
}
/* palette "neon" (the original proff look): Proff.page({palette:'neon'}) */
[data-palette=neon][data-theme=dark]{--bg:#0a0a0b;--fig:#111113;--surf:#161618;--surf2:#1d1d20;--line:#ececee;--line-dim:#3a3a3f;--grid:#26262b;
  --ink:#f4f4f5;--muted:#a1a1aa;--dim:#6b6b72;--on:#0a0a0b;--c1:#56c2ff;--c2:#ffc531;--c3:#ff6363;--c4:#59d499;--c5:#b98cff;--c6:#ff8f4a}
/* soft fills are mixed where data-theme is set, so they follow the live palette (a :root-only rule would freeze them to dark) */
:root,[data-theme]{--f-disp:'Inter',system-ui,-apple-system,sans-serif;--f-mono:ui-monospace,Menlo,monospace;
  --f1:color-mix(in srgb,var(--c1) var(--mix),var(--fig));--f2:color-mix(in srgb,var(--c2) var(--mix),var(--fig));
  --f3:color-mix(in srgb,var(--c3) var(--mix),var(--fig));--f4:color-mix(in srgb,var(--c4) var(--mix),var(--fig));
  --f5:color-mix(in srgb,var(--c5) var(--mix),var(--fig));--f6:color-mix(in srgb,var(--c6) var(--mix),var(--fig));
  --acc:var(--muted);--tint:var(--ink);--tint-hi:var(--ink);--tint-lo:var(--line);--stage-w:min(1250px,calc(100vw - 32px))}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:var(--f-disp);font-size:18px;line-height:1.55;-webkit-font-smoothing:antialiased;
  padding:28px 16px 64px;transition:background .2s,color .2s}
b,strong{font-weight:700}
code{font-family:var(--f-mono);font-size:.92em}
.mono{font-family:var(--f-mono)}
a{color:var(--c1)}

/* header: compact so the stage owns the screen */
.top{max-width:var(--stage-w);margin:0 auto 22px;display:flex;align-items:flex-end;gap:20px;flex-wrap:wrap;
  border-bottom:3px solid var(--line);padding-bottom:16px}
.top .tx{flex:1;min-width:260px}
.eyebrow{display:inline-block;font-family:var(--f-mono);font-weight:700;font-size:12px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink);background:var(--surf2);border:2px solid var(--line);box-shadow:3px 3px 0 var(--line);padding:3px 10px;margin-bottom:12px}
h1{color:var(--tint);font-size:clamp(26px,3.4vw,40px);font-weight:900;text-transform:uppercase;letter-spacing:-.025em;line-height:1}
.sub{font-family:var(--f-mono);font-size:14px;color:var(--muted);margin-top:8px}.sub::before{content:"// ";color:var(--acc)}

/* the stage card: the figure is the hero */
.card{position:relative;max-width:var(--stage-w);margin:0 auto 40px;background:var(--surf);border:3px solid var(--line);
  box-shadow:8px 8px 0 var(--line-dim);padding:20px 22px 18px}
.head{display:flex;align-items:baseline;gap:14px;min-height:34px;padding-right:44px;margin-bottom:12px}
.phase{font:700 11px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink);background:var(--surf2);border:2px solid var(--line);padding:2px 8px;white-space:nowrap}
.stitle{font-size:38px;font-weight:800;letter-spacing:-.01em;line-height:1.15}
.fig{position:relative;background:var(--fig);border:0;overflow:hidden}
.fig svg,.fig canvas{display:block;width:100%;height:auto;max-height:none;margin:0 auto}
.fig svg text{font-family:var(--f-disp)}
.fig svg .mono{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace}
.ib{position:absolute;top:16px;right:18px;width:32px;height:32px;border:2px solid var(--line);background:var(--surf2);color:var(--ink);
  font:900 15px var(--f-mono);cursor:pointer;box-shadow:3px 3px 0 var(--line)}
.ib[aria-expanded=true]{background:var(--line);color:var(--bg)}

/* figure + step strip: the strip is the figure's bottom edge; chevrons appear on the figure's sides on hover */
.figwrap{position:relative}
.strip{position:relative;display:flex;gap:10px;margin-top:6px;height:14px;align-items:flex-start}
.sg{display:flex;gap:3px;min-width:0}
.seg{flex:1;min-width:6px;height:6px;padding:0;border:0;background:var(--line-dim);cursor:pointer;position:relative;transition:height .15s}
.seg::after{content:"";position:absolute;inset:-6px 0}   /* bigger hit area */
.seg i{display:block;height:100%;width:0;background:var(--tint)}
.strip:hover .seg{height:8px}
.seg[aria-selected=true]{box-shadow:0 0 0 1px var(--acc)}
.seg:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
.tip{position:absolute;bottom:18px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .12s;
  font:700 11px var(--f-mono);letter-spacing:.04em;color:var(--ink);background:var(--surf2);border:1px solid var(--line-dim);padding:3px 8px}
.tip.on{opacity:1}
.gh{position:absolute;top:calc(50% - 40px);width:44px;height:64px;border:0;background:color-mix(in srgb,var(--surf) 70%,transparent);color:var(--ink);
  font:900 26px var(--f-mono);cursor:pointer;opacity:0;transition:opacity .15s}
.gh.prev{left:0}.gh.next{right:0}
.figwrap:hover .gh:not(:disabled),.gh:focus-visible{opacity:.85}
.gh:disabled{display:none}
@media (hover:none){.gh:not(:disabled){opacity:.55}}

/* controls: one quiet line; drag the value sideways, or use the thin track that shows on hover */
.ctl{display:flex;flex-wrap:wrap;align-items:center;gap:8px 30px;margin:12px 0 0;padding:0 2px}
.kn{position:relative;display:inline-flex;align-items:baseline;gap:9px;font:700 15px var(--f-mono);letter-spacing:.02em;text-transform:uppercase;color:var(--muted);padding-bottom:8px}
.kv{font:700 18px var(--f-mono);letter-spacing:0;text-transform:none;color:var(--ink);border-bottom:2px dotted var(--muted);cursor:ew-resize;user-select:none;touch-action:none;min-width:2ch}
.kn input{position:absolute;left:0;right:0;bottom:-6px;width:100%;height:14px;margin:0;opacity:0;accent-color:var(--muted);cursor:pointer;transition:opacity .15s}
.kn:hover input,.kn.drag input,.kn input:focus-visible{opacity:1}
.kn.drag .kv{color:var(--ink)}
.kb{margin-left:auto;display:inline-flex;align-items:center;gap:7px;font:700 15px var(--f-mono);letter-spacing:.02em;text-transform:uppercase;color:var(--muted);
  background:none;border:0;border-bottom:2px dotted var(--line-dim);padding:2px 0 6px;cursor:pointer}
.kb span{font-size:16px;color:var(--acc);transition:transform .3s}
.kb:hover{color:var(--ink)}.kb:active span{transform:rotate(-180deg)}

/* info sidebar: 30% of the screen on the right; the page shifts left so nothing is hidden */
.side{position:fixed;top:0;right:0;z-index:50;height:100vh;width:clamp(360px,32vw,500px);overflow-y:auto;background:var(--surf);
  border-left:3px solid var(--tint-lo);padding:24px 32px 56px;transform:translateX(102%);transition:transform .22s ease;font-size:17px;line-height:1.6}
.side.open{transform:none}
.side .lead{font-size:19px;line-height:1.6;color:var(--ink);margin:0 0 24px;border-left:3px solid var(--tint);padding:2px 0 2px 14px}
.side .phase{color:var(--tint);border-color:var(--tint-lo);background:none}
.side strong{color:var(--tint-hi)}
.side li::marker{color:var(--tint)}
.side .sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.side .sx{width:32px;height:32px;border:2px solid var(--line);background:var(--surf2);color:var(--ink);font:900 18px var(--f-mono);cursor:pointer}
.side .st{font-size:23px;font-weight:850;line-height:1.25;margin-bottom:18px}
.side section{padding:24px 0;border-top:1px solid var(--tint-lo)}
.side h4{font:700 12px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--acc);margin-bottom:14px}
.side ul{padding-left:1.1em}.side li{margin:.7em 0;line-height:1.6}.side p+p{margin-top:.8em}
/* notation: "symbol : meaning" on one line, the example under it */
.side .nts{display:grid;grid-template-columns:max-content auto 1fr;column-gap:10px;align-items:baseline}
.side .nt,.side .nk{display:contents}
.side .sym{grid-column:1;font-weight:700;color:var(--acc);white-space:nowrap;line-height:1.55}
.side .col{grid-column:2;color:var(--dim)}
.side .ne{grid-column:3;color:var(--ink);line-height:1.55}
.side .eg{grid-column:3;margin:6px 0 22px;font:15px/1.55 var(--f-mono);color:var(--muted)}
.side .nt:last-child .eg{margin-bottom:4px}
.side .eg strong{color:var(--tint-hi)}
.side .wx{font:16px/1.6 var(--f-mono);color:var(--ink);background:color-mix(in srgb,var(--tint) 9%,var(--surf2));border-left:3px solid var(--acc);padding:12px 16px}
.side details{margin-top:12px;border-top:2px solid var(--line-dim);padding-top:10px}.side summary{cursor:pointer;font:700 11px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
@media (min-width:1000px){body.side-on{--stage-w:min(1250px,calc(100vw - clamp(360px,32vw,500px) - 48px));padding-right:calc(clamp(360px,32vw,500px) + 16px)}}
@media (max-width:1399px){.side{width:340px;padding:22px 26px 48px}body.side-on{--stage-w:calc(100vw - 340px - 48px);padding-right:356px}}   /* laptops: keep the figure big enough that 16-unit labels stay ≥ 12 px */
@media (max-width:999px){.side{width:min(92vw,460px);box-shadow:-12px 0 0 rgba(0,0,0,.35)}}

/* article layout: short prose between wide figures */
.prose{max-width:68ch;margin:0 auto 26px;font-size:19px}
.prose p+p{margin-top:.8em}
.prose h2{font-size:clamp(22px,2.6vw,30px);font-weight:900;text-transform:uppercase;letter-spacing:-.02em;margin:46px 0 14px;line-height:1.05}
.prose ul{padding-left:1.2em}.prose li{margin:.25em 0}
.acc1,.acc2,.acc3,.acc4,.acc5,.acc6{--acc:var(--muted)}

/* study page blocks */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:22px;max-width:var(--stage-w);margin:0 auto 34px}
.tile{background:var(--surf);border:3px solid var(--line);box-shadow:6px 6px 0 var(--acc);padding:18px 20px}
.tile h3{font-size:17px;font-weight:850;text-transform:uppercase;letter-spacing:-.01em;margin-bottom:8px;line-height:1.15}
.tile p,.tile li{font-size:16px}.tile ul{padding-left:1.1em}
.tile .tag{font:700 11px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:6px}
.big{font-size:44px;font-weight:900;letter-spacing:-.03em;line-height:1;color:var(--acc)}
.flip{cursor:pointer}.flip .a{display:none;margin-top:10px;padding-top:10px;border-top:2px dashed var(--line-dim)}.flip.on .a{display:block}
.flip .hint{font:700 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin-top:8px}
.flip.on .hint{display:none}
table.cmp{width:100%;max-width:var(--stage-w);margin:0 auto 34px;border-collapse:collapse;background:var(--surf);border:3px solid var(--line);box-shadow:6px 6px 0 var(--acc)}
table.cmp th,table.cmp td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line-dim);font-size:16px;vertical-align:top}
table.cmp th{font:700 12px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sec{display:block;max-width:var(--stage-w);margin:40px auto 16px;font:700 13px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);border-bottom:2px solid var(--line-dim);padding-bottom:6px}

/* calc engine extras */
.fig .katex{font-size:1em}
.fig .katex svg{height:inherit;max-height:none;margin:0}  /* KaTeX draws radicals with inner SVGs; the stage rule above must not resize them */
.fig foreignObject div{color:var(--ink);font-family:var(--f-disp);line-height:1.2}
.foot{max-width:var(--stage-w);margin:30px auto 0;font:500 12px var(--f-mono);color:var(--dim)}

@media (max-width:700px){
  body{padding:18px 12px 48px;font-size:17px}
  .card{padding:14px 12px;box-shadow:5px 5px 0 var(--acc)}
  .fig.pan{overflow-x:auto}.fig.pan svg{min-width:720px;max-height:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.fig svg text{font-variant-numeric:tabular-nums}
</style></head>

      if (Tin.cols && geo.headerH) g.rect(tileX + 10, yIn - 8, geo.cw - GP - 20, 3, { fill: 'c2', r: 1.5, stroke: 'none', free: true, deco: true });
      if (spec.kind === 'stack' && geo.part !== 'in') { const yOut = yOp + geo.opH + geo.block + geo.outTop; band(bx, yOut - 6, bw, geo.Ro * geo.ch + 8); }
    }
    paintMatrix(g, Tin, spec.inn.t, x, yIn, geo, st, s, { rows: Tin.rows, cols: Tin.cols, title: titleOf(Tin), colFill: col != null ? j => j === col ? 'c2' : 'muted' : null }, TS);
    const yOp = yIn + geo.R * geo.ch + geo.gap;
    if (geo.mode === 'tensor') {
      const B = TS[spec.below];
      if (spec.glyph) g.text(x - 24, yOp + (geo.ch - GP) / 2, spec.glyph, { size: 30, boost: false, anchor: 'end', weight: 500, fill: 'muted', mono: true });
      paintMatrix(g, B, spec.below, x, yOp, geo, st, s, { small: true, cell: (i, j) => spec.below === st.out ? cellLook(st, TS, spec.below, i, j, s) : (live && live.out[1] === j && s.showRead > .1 ? { state: 'read' } : { state: 'input' }) }, TS);
    } else if (geo.mode === 'scalar') {
      if (spec.glyph) g.text(x - 24, yOp + (geo.ch - GP) / 2, spec.glyph, { size: 30, boost: false, anchor: 'end', weight: 500, fill: 'muted', mono: true });
      const row = [Array.from({ length: geo.C }, () => spec.scalar)];
      g.matrix(x, yOp, row, { cw: geo.cw, ch: geo.ch, lock: true, chMin: 36, sizeMin: 20, size: geo.size - 2, fmt: v => v, heat: true, values: row.map(r => r.map(t => Number(String(t).replace(/,/g, '')))),
        cell: (i, j) => live && live.out[1] === j && s.showRead > .1 ? { state: 'read' } : { state: 'input' } });
    }
    if (spec.kind === 'stack' && geo.part !== 'in') {
      const yAfter = yOp + geo.opH, yRule = yAfter + geo.block / 2 - 2, yOut = yAfter + geo.block + geo.outTop;
      g.line(x, yRule, x + geo.C * geo.cw - GP, yRule, { stroke: 'ink', sw: 2, op: .5, free: true });
      const Tout = TS[spec.outItem.t];
      paintMatrix(g, Tout, spec.outItem.t, x, yOut, geo, st, s, { title: titleOf(Tout) }, TS);
    }
    drawFormula(g, geo, live, TS, s.heroOp);
  }
  function drawGrid(g, st, s, TS, geo) {
    const { ox, ch, cw } = geo, cellTop = geo.y0 + geo.maxTop, first = geo.parts.find(p => p.t);
    for (const p of geo.parts) {
      if (p.op != null) { if (p.op) g.text(ox + p.x, cellTop + (first.R * ch - GP) / 2, p.op, { ...opStyle(p.op), fill: 'muted', anchor: 'middle' }); continue; }
      const T = TS[p.t];
      // Same read-column cue as the stacked layout: orange header and a bar under it, when this table is read down one column.
      const rd = s.showRead > .1 && s.live ? (s.live.reads || []).filter(r => r[0] === p.t) : [], cols = new Set(rd.map(r => r[2]));
      const col = rd.length && cols.size === 1 && T.data[0].length > 1 ? rd[0][2] : null;
      if (col != null) g.rect(ox + p.x + col * cw + 10, cellTop - 8, cw - GP - 20, 3, { fill: 'c2', r: 1.5, stroke: 'none', free: true, deco: true });
      paintMatrix(g, T, p.t, ox + p.x, cellTop, geo, st, s, { rows: p.rows, cols: T.cols, title: titleOf(T), colFill: col != null ? j => j === col ? 'c2' : 'muted' : null }, TS);
    }
    if (geo.out) { const o = geo.out, T = TS[o.t], yAfter = cellTop + geo.Rmax * ch;
      g.line(ox + Math.min(geo.L0, o.x), yAfter + 22, ox + Math.max(geo.R0, o.x + o.C * cw - GP), yAfter + 22, { stroke: 'ink', sw: 2, op: .5, free: true });
      paintMatrix(g, T, o.t, ox + o.x, yAfter + 48 + o.m.top, geo, st, s, { rows: o.rows, cols: T.cols, title: titleOf(T) }, TS); }
    if (st.op !== 'show') drawFormula(g, geo, s.live, TS, s.heroOp);
  }

  // ---------- one operation ----------
  function drawOp(g, st, pl, t, TS, sc) {
    const dk = deckGeo(g); let geo = dk.geo.get(st);
    if (geo && geo.split) geo = pl.rest != null ? geo.out : geo.in;   // split step: first click(s) inputs, the wave the output
    if (!geo) { if (st.title && !P.calcFallback.includes(st.title)) P.calcFallback.push(st.title); return; }
    const s = stateOf(st, pl, t, sc);
    if (geo.kind === 'gd') drawGD(g, st, s, TS, stackSpec(st, TS) || columnSpec(st, TS), geo); else drawGrid(g, st, s, TS, geo);
  }

  // ---------- where a statistic falls on its distribution ----------
  function drawDist(g, st, pl, t, TS) {
    const prm = st.params, x = st.x, disc = ['pois', 'nb', 'binom'].includes(st.dist);
    const left = st.src ? 420 : 90;
    if (st.src) { const [nm, i, j] = st.src, T = TS[nm], cw = 66, ch = 40;
      const R = T.data.length, C = T.data[0].length, mx = 60 + (T.rows ? 70 : 0), my = (g.H - R * ch) / 2;
      g.text(mx + C * cw / 2, my - 48, T.label, { size: 18, anchor: 'middle', weight: 750, fill: T.color });
      g.matrix(mx, my, T.disp, { cw, ch, rows: T.rows, cols: T.cols, fmt: v => v, size: 18, cell: (a, b) => a === i && b === j ? { fill: fcol(T.color), stroke: T.color, sw: 3, color: T.color } : { op: .5, top: .5 } }); }
    let pdf, lo, hi;
    if (st.dist === 'norm') { const m = prm.mu ?? 0, s = prm.sd ?? 1; pdf = v => ST.normPdf(v, m, s); lo = Math.min(m - 4 * s, x - s); hi = Math.max(m + 4 * s, x + s); }
    else if (st.dist === 't') { pdf = v => ST.tPdf(v, prm.df); lo = Math.min(-5, x - 1); hi = Math.max(5, x + 1); }
    else if (st.dist === 'chi2') { const k = prm.df; pdf = v => ST.gammaPdf(v, k / 2, .5); lo = 0; hi = Math.max(k + 5 * Math.sqrt(2 * k), x * 1.15); }
    else { const pm = st.dist === 'pois' ? k => ST.poisPmf(k, prm.lam) : st.dist === 'nb' ? k => ST.nbPmf(k, prm.mu, prm.phi) : k => ST.binomPmf(k, prm.n, prm.p);
      pdf = pm; const mu = prm.lam ?? prm.mu ?? prm.n * prm.p; lo = 0; hi = Math.max(Math.ceil(mu * 2.6 + 6), x + 3); if (st.dist === 'binom') hi = prm.n; }
    const ymax = disc ? Math.max(...P.range(lo, hi, hi - lo + 1).map(k => pdf(Math.round(k)))) : Math.max(...P.range(lo, hi, 200).map(pdf));
    const ax = g.axes({ x: left, y: 120, w: g.W - left - 80, h: 380, xd: [lo, hi], yd: [0, ymax * 1.15], xt: 6, yt: 3, xl: st.xlabel || 'value', yl: disc ? 'probability' : 'density', size: 17 });
    const sh = P.seg(t, .3, 1), inTail = v => st.tail === 'upper' ? v >= x : st.tail === 'lower' ? v <= x : Math.abs(v) >= Math.abs(x);
    if (disc) { const ks = []; for (let k = Math.ceil(lo); k <= hi; k++) ks.push(k);
      g.bars(ks.map(k => [k, pdf(k)]), ax, { bw: .8, fill: (k) => inTail(k) && sh > 0 ? 'f3' : 'f1', stroke: 'c1' }); }
    else {
      g.area(pdf, ax, lo, hi, { fill: 'f1' });
      if (sh > 0) { if (st.tail !== 'lower') g.area(pdf, ax, st.tail === 'two' ? Math.abs(x) : x, hi, { fill: 'c3', op: .55 * sh });
        if (st.tail !== 'upper') g.area(pdf, ax, lo, st.tail === 'two' ? -Math.abs(x) : x, { fill: 'c3', op: .55 * sh }); }
      g.curve(pdf, ax, lo, hi, { stroke: 'c1', sw: 3, free: true }); }
    const X = ax.sx(x);
    g.line(X, ax.y - 6, X, ax.y + ax.h, { stroke: 'c3', sw: 3, free: true });
    g.text(X, ax.y - 22, `observed ${P.fmt(x)}`, { size: 20, anchor: X > g.W - 180 ? 'end' : 'middle', fill: 'c3', weight: 750 });
    if (sh > .5) g.text(ax.x + ax.w, ax.y + 30, `p = ${P.fmt(st.p, 3)}`, { size: 28, anchor: 'end', weight: 800, fill: 'c3', mono: true });
    if (st.tex) g.tex(g.W / 2, 50, st.tex, { size: 28, w: 900, h: 60 });
  }
})();
</script>
<script>
'use strict';
const D = PROFF_DATA.mle;
const P = PROFF_DATA.perm_eff;
Proff.page({ title: 'MAGeCK-MLE, count by count', sub: 'The same toy guides, fitted together. Counts → treatment effect → uncertainty.', eyebrow: 'MAGeCK 0.5.9.5 · simulated teaching data', palette: 'mono', foot: 'Sources: data/mle.json + data/perm_eff.json; values rounded for display. Arrows step; i explains.' });
function chapter(n, name, input, output) {
  const active = [0,0,1,2,2,2,2,3,5,2,7][n];
  Proff.scene({title: name,phase: `${n} · ${['Map','Input','Depth','Model','Dispersion','Likelihood','Fit','Wald','Permutation','Efficiency','Compare'][n]}`,
    steps:[{cap:`In: ${input}. Out: ${output}.`,info:{read:['Follow the outlined stage. Each box changes the shape or meaning of the data.'],more:'Maximum likelihood estimation (MLE) fits a probability model to guide counts. Source: MAGeCK 0.5.9.5, mleinstanceio.py and mleem.py. The JSON contains a simulated library’s selected guides.'}}],
    draw(g){
      const names=['Counts + design','Size factors','Count model','Effect + error','Wald p','Permutation p','False discovery','Gene output'];
      const small=['guide × sample','sample depth','guide × sample','gene','gene','gene','gene','gene_summary.txt'];
      names.forEach((s,i)=>{const x=80+(i%4)*280,y=110+Math.floor(i/4)*225,on=i===active;
        g.rect(x,y,210,135,{fill:on?'f2':'surf2',stroke:on?'c2':'line',sw:on?3:1,r:12});
        g.text(x+105,y+42,s,{size:20,anchor:'middle',weight:600});
        g.text(x+105,y+95,small[i],{size:17,anchor:'middle',fill:on?'ink':'muted'});
        if(i%4<3)g.arrow(x+225,y+65,x+260,y+65,{stroke:'muted',sw:2});
      });
      g.text(80,580,input,{size:20});
      g.arrow(540,572,660,572,{stroke:'c2',sw:3});
      g.text(710,580,output,{size:20});
    }});
}
chapter(0,'Counts become a gene effect','count table + design','gene effects + p-values');
chapter(1,'The design links samples to treatment','guides × samples','samples × design columns');
Proff.calc(PROFF_DATA.input,{phase:'1 · Input'});
Proff.calc(PROFF_DATA.design,{phase:'1 · Input'});
const E = PROFF_DATA.derived;
const A = D.fits.GeneA;
const gs = Object.keys(D.counts);
const f = (v,d=3) => Number(v).toFixed(d).replace(/^-/, '−');
const sci = v => Number(v).toPrecision(4).replace(/^-/, '−');
const info = (text,notation={},more='')=>({text,notation,more});
const centred=(g,data,o,y)=>{const M=Proff.matrixMetrics(data,o);const x=(g.W-(M.lab+M.w))/2+M.lab;return g.matrix(x,y??(g.H-(M.top+M.h))/2+M.top,data,o);};
const dims = () => ({...Proff.calcRungs().use, fmt:v=>v, heat:false});
function calc(name,phase){ Proff.calc(PROFF_DATA[name],{phase}); }
function one(title,phase,cap,explain,draw){Proff.scene({title,phase,steps:[{cap,info:explain}],draw});}

chapter(2,'Depth enters the expected count','counts + one','sample depth factors');
calc('pseudocount','2 · Depth');
calc('factors','2 · Depth');
one('One depth correction, two placements','2 · Depth',
  'The test command normalizes observed counts. MLE leaves model counts intact and places the depth factor inside the expected mean.',
  info('Use the MLE factor estimated after adding the pseudocount. The test version is available for comparison, but it does not supply this fit’s offset.',
    {'s':['sample depth factor',`C1: ${f(D.size_factor[0],6)}`],'μ':['expected count including sequencing depth',`GeneA A1 in C1: ${f(A.mu[0][0],2)}`],'a':['abundance before sequencing depth',f(A.mu[0][0]/D.size_factor[0],2)]}),
  g=>{g.note(100,140,'Same correction for depth');
    g.text(100,255,'Observed scale',{size:24,weight:600});
    g.tex(100,330,String.raw`k_{ij}/s_j`,{size:32,anchor:'start',w:400,h:120});
    g.text(650,255,'Model scale',{size:24,weight:600});
    g.tex(650,330,String.raw`\mu=s\times a`,{size:28,anchor:'start',w:450,h:120});
    g.text(100,500,'Divide observations',{size:22});
    g.text(650,500,'Multiply expected counts',{size:22,fill:'c2'});
  });

chapter(3,'Guides share one treatment effect','GeneA counts × design','expected GeneA counts');
one('The design expands across guides','3 · Model',
  'A filled square means one; an empty square means zero. Each sample contributes one row for each GeneA guide.',
  info('The visible count model has one baseline coefficient per guide plus one shared treatment coefficient. Rows run sample first, then A1, A2, A3. The drawing uses the first real-count rows of the supplied extended design.',
    {'X':['extended design: guide identity plus treatment coding',`first row: ${A.X[0].join(', ')}`],'β₀':['guide baseline coefficient',`A1: ${f(A.beta0[0],4)}`],'β':['shared treatment coefficient',f(A.beta,5)]}),
  g=>{
    const cw=70,ch=21,x=370,y=145;
    ['A1','A2','A3','β'].forEach((v,j)=>g.text(x+j*cw+24,y-35,v,{size:18,anchor:'middle'}));
    A.X.slice(0,A.mu.flat().length).forEach((r,i)=>r.forEach((v,j)=>g.rect(x+j*cw,y+i*ch,48,ch-3,{fill:v?(j===3?'c2':'ink'):'surf2',stroke:'line',sw:1,r:2})));
    D.samples.forEach((s,j)=>g.text(x-60,y+j*3*ch+37,s,{size:18,anchor:'end'}));
    g.note(780,230,`${A.mu.flat().length} observed rows`);
    g.note(780,310,`${A.beta0.length+1} coefficients`,{fill:'c2'});
    g.text(780,410,'Same β, every guide',{size:22});
    g.text(100,600,'Guide order repeats: A1, A2, A3',{size:20});
  });
one('The implementation adds mixture rows','3 · Model',
  'MAGeCK keeps an inefficient-guide branch internally, even when efficiency updating is off. These are duplicated rows, not additional samples.',
  info('The first rows represent observed guide-by-sample counts. Extra rows repeat non-first samples with treatment effects switched off. Default efficiency is one, yet numerical weight floors retain small duplicate-row contributions. Those rows affect the stored iteration likelihood and covariance.',
    {'X':['full solver design',`${A.nrows} rows × ${A.X[0].length} coefficients`],'η':['linear predictor without the depth offset','η = Xβ']}),
  g=>{g.rect(140,130,570,220,{fill:'surf2',stroke:'line',r:12});
    g.units(180,175,A.mu.flat().length,{cols:D.samples.length,size:40,gap:12});
    g.text(760,220,'Observed counts',{size:24});
    g.text(760,290,`${A.mu.flat().length} rows`,{size:22});
    g.rect(140,390,570,170,{fill:'f2',stroke:'c2',r:12});
    g.units(180,430,A.nrows-A.mu.flat().length,{cols:D.samples.length-1,size:32,gap:12,highlight:A.nrows-A.mu.flat().length});
    g.text(760,440,'Mixture duplicates',{size:24});
    g.text(760,510,`${A.nrows-A.mu.flat().length} rows`,{size:22});
  });
calc('model','3 · Model');
one('Beta gives a depth-corrected ratio','3 · Model',
  'Exponentiate the natural-log treatment effect. This is the fitted treatment-to-control abundance ratio, shared by the three GeneA guides.',
  info('Beta is not a log₂ fold change. A guide’s own starting abundance is absorbed by its baseline. The model asks how treatment shifts abundance after correcting sequencing depth.',
    {'β':['natural-log treatment effect',f(A.beta,5)],'exp':['undo the natural log',`exp(${f(A.beta,5)}) = ${f(E.effect_ratio,4)}`]}),
  g=>{g.note(120,160,`β = ${f(A.beta,5)}`);g.tex(120,280,String.raw`\text{ratio}=\exp(\beta)`,{size:30,anchor:'start',w:400,h:120});g.hero(700,300,f(E.effect_ratio,3));g.text(120,470,'Expected treatment / control abundance',{size:24});

  });

chapter(4,'Dispersion controls count variation','expected counts','count variances');
calc('dispersion','4 · Dispersion');
one('Optional variance modeling learns a curve','4 · Dispersion',
  'Optional --genes-varmodeling N fits genes first. It then models the squared residuals against observed counts, across the fitted library.',
  info('This branch is off by default. Each dot is a guide-sample observation from the optional first-pass fit. The JSON stores a subset of the scatter and the regression coefficients. Natural logs are used; the response is ln(residual² + 0.01).',
    {'x':['natural log of count plus one',sci(D.varmodel.cloud_x[0])],'y':['natural log of squared residual plus a small constant',sci(D.varmodel.cloud_y[0])],'a':['fitted slope',f(D.varmodel.slope,4)],'b':['fitted intercept',f(D.varmodel.intercept,4)]},
    `Optional branch source: mlemeanvar.py. It filters very small residual responses before fitting. The supplied model used ${D.varmodel.n} eligible observations; ${D.varmodel.cloud_x.length} are stored for drawing. Default fit results elsewhere remain unchanged.`),
  g=>{const xs=D.varmodel.cloud_x,ys=D.varmodel.cloud_y;
    const xmin=Math.floor(Math.min(...xs)),xmax=Math.ceil(Math.max(...xs)),ymin=Math.floor(Math.min(...ys)),ymax=Math.ceil(Math.max(...ys));
    const ax=g.axes({x:120,y:105,w:940,h:425,xd:[xmin,xmax],yd:[ymin,ymax],xl:'ln(count + 1)',yl:'ln(residual² + 0.01)'});
    xs.forEach((x,i)=>ax.pt(x,ys[i],{r:3,fill:'muted',op:.35}));
    g.curve(x=>D.varmodel.slope*x+D.varmodel.intercept,ax,xmin,xmax,{stroke:'c2',sw:3});
    g.note(600,620,`slope ${f(D.varmodel.slope,3)} · intercept ${f(D.varmodel.intercept,3)}`,{anchor:'middle'});
  });
one('The optional branch can change beta','4 · Dispersion',
  'These are recorded MAGeCK runs with fixed dispersion and with variance modeling enabled. The optional model changes both effect and uncertainty.',
  info('This comparison uses the supplied recorded runs. It is separate from the default path taught here. Dispersion estimates are clamped to an implementation-defined lower bound.',{'β':['natural-log treatment coefficient',f(A.beta,5)]},'Source: mle.json mageck and mageck_varmodel. Updated guide efficiencies are not part of this comparison.'),
  g=>centred(g,gs.map(v=>[+D.mageck[v]['treatment|beta'],+D.mageck_varmodel[v]['treatment|beta']]).map(r=>r.map(v=>f(v,5))),
    {...dims(),rows:gs,cols:['fixed β','modeled β'],title:'Recorded treatment coefficients'}));

chapter(5,'Probability scores each model','GeneA counts + means','log likelihood');
one('One count gets one probability','5 · Likelihood',
  'The model assigns probability to the exact observed count. A larger likelihood means the fixed counts fit the proposed means better.',
  info('Negative-binomial probability is the height of a single integer-count bar, not a cumulative tail. Likelihood multiplies the probabilities of the fixed observations as model parameters vary.',
    {'k':['observed model count',D.counts.GeneA[0][0]+1],'μ':['proposed mean count',f(A.mu[0][0],2)],'φ':['fixed dispersion',D.alpha_val],'P':['probability of the exact count',sci(E.nb_pmf)]}),
  g=>{const mu=A.mu[0][0],x=D.counts.GeneA[0][0]+1,sd=Math.sqrt(E.var_first),lo=Math.max(0,Math.floor(mu-4*sd)),hi=Math.ceil(mu+4*sd);
    const ax=g.axes({x:120,y:120,w:850,h:360,xd:[lo,hi],yd:[0,Proff.stat.nbPmf(Math.round(mu),mu,D.alpha_val)*1.25],xl:'model count',yl:'probability of exact count',fmty:v=>v.toFixed(3)});
    g.curve(v=>Proff.stat.nbPmf(Math.round(v),mu,D.alpha_val),ax,lo,hi,{stroke:'muted',sw:3});
    g.line(ax.sx(x),ax.sy(0),ax.sx(x),ax.sy(E.nb_pmf),{stroke:'c2',sw:5});
    g.label(1020,180,`k = ${x}`,{to:[ax.sx(x),ax.sy(E.nb_pmf)],anchor:'middle'});
    g.note(600,620,`P(exact count) = ${sci(E.nb_pmf)}`,{anchor:'middle'});
  });
one('The probability has a count formula','5 · Likelihood',
  'The negative-binomial formula combines the observed integer count, expected mean and fixed dispersion. Logs make its multiplication numerically manageable.',
  info('The gamma function extends factorials. Here r is the reciprocal of dispersion; k is the observed count plus one. μ is the expected count. This probability is evaluated separately for every guide-sample cell.',
    {'Γ':['gamma function, the extension of factorials','Γ(k + 1) = k!'],'k':['observed model count',D.counts.GeneA[0][0]+1],'r':['reciprocal dispersion',1/D.alpha_val],'μ':['expected count',f(A.mu[0][0],2)],'ln':['natural logarithm',f(Math.log(E.nb_pmf),4)]}),
  g=>{g.tex(120,220,String.raw`P(k;\mu,r)=\frac{\Gamma(k+r)}{\Gamma(r)\Gamma(k+1)}\left(\frac{r}{r+\mu}\right)^r\left(\frac{\mu}{r+\mu}\right)^k`,{size:31,anchor:'start',w:980,h:120});
    g.tex(120,390,String.raw`r=1/\phi`,{size:30,anchor:'start',w:980,h:120});g.note(600,530,String.raw`ln P = ${f(Math.log(E.nb_pmf),4)}`,{fill:'c2'});
  });
calc('likelihood','5 · Likelihood');
Proff.scene({title:'Move beta; refit the baselines',phase:'5 · Likelihood',
  controls:[{name:'b',label:'proposed β',min:D.profile.beta[0],max:D.profile.beta.at(-1),step:D.profile.beta[1]-D.profile.beta[0],value:D.profile.beta[E.profile_peak],fmt:v=>f(v,2)}],
  steps:[{cap:'Hold the GeneA counts fixed. At each supplied beta, refit guide baselines and add all real-count log probabilities.',
    info:info('The curve is the supplied profile likelihood, not a fresh browser fit. The highlighted dot snaps to its sampled beta grid. Its peak is close to the recorded ridge fit, but the two objectives differ.',
      {'β':['proposed shared treatment effect',D.profile.beta[E.profile_peak]],'L':['sum of real-count log probabilities with baselines refit',f(D.profile.ll[E.profile_peak],3)]},
      'Source: mle.json profile.beta and profile.ll. No interpolation is presented as a new fit. The profile excludes solver mixture duplicates and ridge.')}],
  draw(g,k,t,p){let ix=0;D.profile.beta.forEach((v,i)=>{if(Math.abs(v-p.b)<Math.abs(D.profile.beta[ix]-p.b))ix=i;});
    const lo=Math.floor(Math.min(...D.profile.ll)/100)*100,hi=Math.ceil(Math.max(...D.profile.ll)/100)*100;
    const ax=g.axes({x:120,y:90,w:900,h:440,xd:[D.profile.beta[0]-.3,D.profile.beta.at(-1)+.3],yd:[lo-100,hi],xt:[-3,-2,-1,0,1],yt:[-1400,-1000,-600,-200],xl:'proposed treatment β',yl:'profile log likelihood'});
    g.poly(D.profile.beta.map((v,i)=>[ax.sx(v),ax.sy(D.profile.ll[i])]),{stroke:'muted',sw:3});
    ax.pt(D.profile.beta[ix],D.profile.ll[ix],{r:9,fill:'c2'});
    g.note(600,620,`β ${f(D.profile.beta[ix],2)} · log L ${f(D.profile.ll[ix],2)}`,{anchor:'middle'});
  }});

chapter(6,'The fit updates a weighted model','current means + residuals','updated coefficients');
calc('irls','6 · Fit');
one('The offset stays outside the solve','6 · Fit',
  'The working response uses the linear predictor after removing depth. Solve the weighted system, then update means and weights.',
  info('The coefficient vector b stacks guide baselines and treatment beta. The first formula defines the predictor without sequencing depth. The second gives the real-count working response. The third is the ridge-weighted update. Inefficient mixture rows receive their branch-specific correction.',
    {'η':['linear predictor without depth','ln(μ) − ln(s)'],'z':['IRLS working response','η + (k − μ)/μ'],'X':['guide and sample predictor matrix',`${A.nrows} rows × ${A.X[0].length} columns`],'W':['diagonal count-weight matrix',f(A.weights[0],3)],'λ':['ridge strength',D.alpha_val],'I':['identity matrix: ones on the diagonal',`${A.X[0].length} × ${A.X[0].length}`]}),
  g=>{g.tex(130,180,String.raw`\eta=\ln\mu-\ln s=Xb`,{size:31,anchor:'start',w:970,h:120});
    g.tex(130,310,String.raw`z=\eta+(k-\mu)/\mu`,{size:31,anchor:'start',w:970,h:120});
    g.tex(130,465,String.raw`(X^T W X+${D.alpha_val}I)b_{\rm new}=X^T Wz`,{size:31,anchor:'start',w:970,h:120});
  });
calc('solve','6 · Fit');
calc('iterations','6 · Fit');

chapter(7,'An effect needs an uncertainty scale','beta + weighted fit','Wald statistic + p');
one('Covariance uses two weight factors','7 · Wald',
  'The implementation uses a sandwich covariance. The inverse weighted normal matrix alone does not reproduce its standard error.',
  info('Read the product from the outside inward. A includes ridge. The center contains squared count weights. Select the treatment coefficient’s diagonal, multiply by the residual factor, then take the square root.',
    {'A':['weighted normal matrix with ridge','XᵀWX + λI'],'C':['unscaled coefficient covariance',`treatment diagonal = ${f(E.covariance_raw.at(-1).at(-1),6)}`],'c':['residual over-dispersion factor',f(A.scale,6)],'SE':['standard error of the treatment coefficient',f(A.se,6)],'T':['transpose: exchange rows and columns','Xᵀ is coefficients × rows'],'−1':['matrix inverse','A⁻¹ reverses the linear solve']},
    'Source: mleem.py:264–276,357–368. The residual factor is sum((residual / mean)²) divided by residual degrees of freedom on the extended system. It can reduce the raw error in this example.'),
  g=>{g.tex(130,170,String.raw`A=X^TWX+\lambda I`,{size:30,anchor:'start',w:970,h:120});
    g.tex(130,310,String.raw`C=A^{-1}X^TW^2XA^{-1}`,{size:30,anchor:'start',w:970,h:120});
    g.tex(130,465,String.raw`\mathrm{SE}_{\beta}=\sqrt{c\,C_{\beta\beta}}`,{size:31,anchor:'start',w:970,h:120});
    g.note(760,580,`scale = ${f(A.scale,4)}`,{fill:'c2'});
  });
calc('wald','7 · Wald');
Proff.scenes.at(-1).draw = (g,k,t) => {
  const pdf=Proff.stat.normPdf,cut=Math.abs(A.z);
  const ax=g.axes({x:130,y:120,w:900,h:380,xd:[-4.5,4.5],yd:[0,.46],xt:[-3,-2,-1,0,1,2,3],yt:[.1,.2,.3,.4],xl:'Wald z',yl:'normal density'});
  g.area(pdf,ax,-4.5,-cut,{fill:'c2',op:.6});
  g.area(pdf,ax,cut,4.5,{fill:'c2',op:.6});
  g.curve(pdf,ax,-4.5,4.5,{stroke:'ink',sw:3});
  g.line(ax.sx(A.z),ax.sy(0),ax.sx(A.z),ax.sy(pdf(A.z)),{stroke:'c2',sw:4});
  g.note(780,180,`p = ${sci(A.wald_p)}`,{fill:'c2'});
  g.note(600,620,`Observed z = ${f(A.z,4)}`,{anchor:'middle'});
};

chapter(8,'Permutation checks the fitted effect','same-size fake genes','permutation p + FDR');
one('Our null puts GeneA far left','8 · Permutation',
  'Our seeded Monte Carlo refits three-guide fake genes with a MAGeCK-matched IRLS port. These are not MAGeCK’s own random draws.',
  info('Whole guide count profiles are regrouped while samples and design stay fixed. Our null contains two rounds of 684 fake genes. The histogram uses the supplied 40 bins with beta clipped to [−2, 2]; tail fractions use the unclipped null.',
    {'M':['number of fitted fake-gene betas',String(P.M)],'β*':['fitted beta of a three-guide fake gene','perm_eff.json null_beta'],'β':['observed gene beta',`GeneA ${f(P.genes.GeneA.beta,5)}; GeneB ${f(P.genes.GeneB.beta,5)}`]},
    'Source: perm_eff.json null_beta, hist, hist_edges; make_extra.py uses seed 11. This is a teaching Monte Carlo port, not MAGeCK’s recorded permutation sample. MAGeCK normally groups by guide count; this supplied null has three guides throughout. Guide C1 and sample C1 are different identifiers.'),
  g=>{const ymax=Math.ceil(Math.max(...P.hist)/100)*100;
    const ax=g.axes({x:125,y:150,w:940,h:380,xd:[-2.1,2.1],yd:[0,ymax],xt:[-1.5,-1,-.5,0,.5,1,1.5],yt:[100,200,300],xl:'fitted β (display clipped)',yl:'fake genes'});
    g.bars(P.hist.map((v,i)=>[(P.hist_edges[i]+P.hist_edges[i+1])/2,v]),ax,{bw:P.hist_edges[1]-P.hist_edges[0],fill:'surf2',stroke:'muted'});
    ['GeneA','GeneB'].forEach((gene,i)=>{const x=ax.sx(P.genes[gene].beta);
      g.line(x,150,x,530,{stroke:i?'ink':'c2',sw:3,dash:!!i});
      g.text(x,105,`${gene} ${f(P.genes[gene].beta,3)}`,{size:22,anchor:'middle',fill:i?'ink':'c2',weight:700});});
    g.note(600,625,`${P.M.toLocaleString('en-US')} fake genes · 2 × 684`,{anchor:'middle'});
  });
one('Count both sides of the null','8 · Permutation',
  'MAGeCK doubles the smaller tail proportion. It does not assume the null is a standard normal distribution.',
  info('The denominator counts fitted fake-gene beta values. The strict inequalities match MAGeCK’s rule. We can replay it using the supplied teaching null.',
    {'p':['two-sided permutation p-value from our draws',sci(P.genes.GeneA.p_two)],'#':['count fitted null betas satisfying the comparison','GeneA: 1,358 above; 10 below'],'M':['number of fitted null beta values',String(P.M)],'min':['choose the smaller tail share','then double it']}),
  g=>{g.tex(110,240,String.raw`p=2\min\left(\frac{\#(\beta^*>\beta)}{M},\frac{\#(\beta^*<\beta)}{M}\right)`,{size:30,anchor:'start',w:990,h:120});
    g.text(120,450,'Our GeneA Monte Carlo p',{size:25});g.hero(770,480,sci(P.genes.GeneA.p_two));
  });
one('Replay the observed tail fractions','8 · Permutation',
  'Each fraction counts strict tail events among our fitted fake genes. Choose the smaller share, then double it.',
  info('GeneA: above = 0.992690, below = 0.007310. GeneB: above = 0.036550, below = 0.963450. Tail counts are recomputed directly from the supplied null_beta array.',
    {'M':['our Monte Carlo denominator',String(P.M)],'pA':['our two-sided GeneA p',sci(P.genes.GeneA.p_two)],'pB':['our two-sided GeneB p',sci(P.genes.GeneB.p_two)]},
    'Sources: perm_eff.json genes.*.frac_above, frac_below, p_two, and null_beta. No normal-tail approximation enters this calculation.'),
  g=>{['GeneA','GeneB'].forEach((gene,i)=>{const y=130+i*280,v=P.genes[gene],above=P.null_beta.filter(b=>b>v.beta).length,below=P.null_beta.filter(b=>b<v.beta).length;
    g.text(120,y,`${gene} β = ${f(v.beta,5)}`,{size:25,weight:600});
    g.tex(120,y+85,String.raw`p=2\min\left(\frac{${above}}{${P.M}},\frac{${below}}{${P.M}}\right)=${f(v.p_two,5)}`,{size:30,anchor:'start',w:980,h:120});});
  });
one('Different random draws give different p','8 · Permutation',
  'Our p-values and MAGeCK’s recorded p-values differ because the random draws differ. GeneC also has two guides; our supplied null always uses three.',
  info('The left column comes from the supplied seeded Monte Carlo IRLS port. The right comes from MAGeCK’s own recorded run. They use the same two-sided strict-tail rule; they do not reuse the same null sample.',{},
    'Sources: perm_eff.json genes.*.p_two; mle.json mageck.* treatment|p-value. The three-guide null is appropriate in size for GeneA and GeneB. GeneC’s two-guide result is shown for completeness, with an additional guide-count mismatch; the discrepancy cannot be attributed solely to random draws for GeneC.'),
  g=>{centred(g,gs.map(gene=>[f(P.genes[gene].p_two,4),f(+D.mageck[gene]['treatment|p-value'],6)]),
    {...dims(),rows:gs,cols:['our Monte Carlo p','MAGeCK p'],title:'Two independently drawn null samples'},235);
    g.text(600,520,'GeneC: two guides; our null: three',{size:24,anchor:'middle'});
  });
one('A neutral gene exposes the difference','8 · Permutation',
  'GeneB is neutral in the simulation. Its normal approximation looks stronger than its guide-shuffling comparison.',
  info('The simulated neutral label is used only to interpret the result. It was never a predictor. The two p-values answer the same zero-effect question with different reference distributions. One neutral example illustrates possible miscalibration; it does not measure a false-positive rate.',{},
    'Source: mle.json mageck.GeneB and fits.GeneB. FDR correction is still required. Neutral status is a property of the supplied teaching simulation.'),
  g=>{g.text(120,140,'GeneB · simulated neutral',{size:25,weight:600});
    g.text(150,300,'Wald p',{size:25});g.text(150,400,sci(+D.mageck.GeneB['treatment|wald-p-value']),{size:34,weight:700});
    g.arrow(500,370,600,370,{stroke:'muted',sw:3});
    g.text(740,300,'Permutation p',{size:25});g.hero(740,420,sci(+D.mageck.GeneB['treatment|p-value']));
  });
calc('bh','8 · Permutation');
calc('output','8 · Permutation');

chapter(9,'Efficiency updating is optional','guide count patterns','efficiency probabilities');
one('The default keeps every guide efficient','9 · Efficiency',
  'A3 was simulated as a dud, yet its efficiency remains one on the default path. Updating requires an explicit option.',
  info('The plot divides counts plus one by supplied size factors so abundance patterns can be compared. Each line follows one GeneA guide across sample order. A3 does not show the depletion expected of a working guide.',
    {'eff':['guide-efficiency probability: off-by-default updating keeps it fixed','A1 = A2 = A3 = 1']},
    'Use --update-efficiency to update these probabilities, or --sgrna-efficiency to provide initial efficiencies. Neither is used in the default results. Source: counts, size_factor, mleem.py. The supplied optional refit is shown next.'),
  g=>{const vals=E.guide_norm,max=Math.ceil(Math.max(...vals.flat())/100)*100;
    const ax=g.axes({x:125,y:105,w:850,h:425,xd:[-.5,D.samples.length-.5],yd:[0,max],xt:D.samples.map((_,i)=>i),fmtx:v=>D.samples[v]||'',xl:'sample',yl:'(count + 1) / depth'});
    vals.forEach((r,i)=>{g.poly(r.map((v,j)=>[ax.sx(j),ax.sy(v)]),{stroke:i===2?'c2':'muted',sw:3,dash:i===1});r.forEach((v,j)=>ax.pt(j,v,{r:6,fill:i===2?'c2':'muted'}));
      g.label(1060,200+i*100,D.sgrnas.GeneA[i],{to:[ax.sx(D.samples.length-1),ax.sy(r.at(-1))],anchor:'middle'});});
    g.note(600,620,'Default guide efficiencies stay at one',{anchor:'middle'});
  });
one('Optional updating compares two count models','9 · Efficiency',
  'Compare the working-guide log probability with the zero-effect version. The most supportive non-first sample determines a guide’s efficiency update.',
  info('This is the source’s update formula. It does not insert an efficiency prior. The code caps each dud-minus-working log difference at 100 before taking the minimum.',
    {'ℓdud':['cell log probability when the treatment effect is zero','keep the guide baseline and depth'],'ℓworks':['cell log probability with the fitted treatment effect','use the current guide baseline and depth'],'min':['take the smallest non-first-sample log difference','C2, C3, T1, T2, T3 for each guide'],'eff':['updated efficiency probability','final A3 value in optional run: 0.5']}),
  g=>{g.tex(110,220,String.raw`\Delta_i=\min_{j\ne 1}\left[\ell_{\rm dud,ij}-\ell_{\rm works,ij}\right]`,{size:31,anchor:'start',w:990,h:120});
    g.tex(110,390,String.raw`\mathrm{eff}_i=\frac{1}{1+\exp(\Delta_i)}`,{size:31,anchor:'start',w:990,h:120});
    g.text(110,555,'Off by default',{size:28,fill:'c2',weight:700});
  });
calc('efficiency','9 · Efficiency');
one('Updating strengthens GeneA’s fitted depletion','9 · Efficiency',
  'With efficiency updating enabled, A3 finishes at 0.5. GeneA’s fitted effect becomes more negative and its Wald p-value decreases.',
  info('These are recorded results of a real MAGeCK 0.5.9.5 --update-efficiency run. The final guide efficiency is a probability of the working-guide component, distinct from the negative-binomial IRLS weight. Truth labels never enter the fit.',
    {'β':['natural-log treatment effect',`default ${f(A.beta,4)} → updated ${f(+P.update_efficiency.genes.GeneA['treatment|beta'],4)}`],'eff':['final efficiency of guide A3',P.update_efficiency.sgrna_eff.A3.eff]},
    'Sources: mle.json fits.GeneA; perm_eff.json update_efficiency.genes.GeneA and sgrna_eff.A3. This result is specific to these counts; updating does not guarantee stronger evidence in other data.'),
  g=>{centred(g,[[f(A.beta,4),sci(A.wald_p)],[f(+P.update_efficiency.genes.GeneA['treatment|beta'],4),sci(+P.update_efficiency.genes.GeneA['treatment|wald-p-value'])]],
    {...dims(),rows:['default','update on'],cols:['β','Wald p'],title:'GeneA in the recorded optional run'},235);
    g.text(600,530,'Efficiency updating: off by default',{size:27,fill:'c2',weight:700,anchor:'middle'});
  });

chapter(10,'Compare evidence on the same guides','same counts, two methods','gene-level evidence');
one('Rank aggregation and count fitting differ','10 · Compare',
  'RRA combines guide ranks. MLE fits counts with a design matrix. Both require calibrated gene evidence and correction across the tested library.',
  info('Robust rank aggregation (RRA) combines guide positions in a ranked library. MLE estimates effects directly from a count model. The p-values below come from recorded runs on the same simulated library. RRA uses its depletion direction; MLE reports two-sided permutation evidence.',{},
    'Use a simple two-group contrast when the comparison is straightforward. A suitable MLE design can express several effects jointly. Design correctness and normalization still determine interpretation. Source: mle.json rra_compare and mageck. This page teaches toy data, not a validated conclusion for the mouse screen.'),
  g=>{const data=gs.map(v=>[sci(D.rra_compare[v].p),sci(+D.mageck[v]['treatment|p-value']),sci(D.rra_compare[v].fdr),sci(+D.mageck[v]['treatment|fdr'])]);
    centred(g,data,{...dims(),rows:gs,cols:['RRA p ↓','MLE p ↔','RRA FDR','MLE FDR'],title:'Same library, different inference'},235);
    g.text(600,560,'Read the direction and reference distribution',{size:23,anchor:'middle'});
  });
one('Effects use different logarithm scales','10 · Compare',
  'RRA reports a median guide log₂ fold change. MLE reports a fitted natural-log coefficient. Convert the coefficient before comparing magnitudes.',
  info('The final column converts beta by dividing by ln(2). The values still estimate different summaries: a median of guide changes versus a shared model coefficient. The default MLE keeps the simulated dud guide in the model.',
    {'β / ln(2)':['natural-log coefficient expressed on a log₂ scale',f(A.beta/Math.log(2),4)]},
    'Source: mle.json rra_compare.*.lfc, fits.*.beta. Default fixed dispersion, ridge, no efficiency updating. Evidence high for these recorded toy outputs; uncertainty lies in model assumptions and permutation randomness. Unknown: independent calibration on the real screen.'),
  g=>{g.matrix(200,210,gs.map(v=>[f(D.rra_compare[v].lfc,4),f(D.fits[v].beta,4),f(D.fits[v].beta/Math.log(2),4)]),
      {...dims(),rows:gs,cols:['RRA log₂ change','MLE β (ln)','MLE β / ln(2)'],title:'Effect sizes from the same guide counts'});
    g.text(140,540,'GeneA treatment / control',{size:25});g.hero(800,575,f(E.effect_ratio,3));
  });

// Give every step its title so the kit audit also detects missing calc layouts.
for (const scene of Proff.scenes) for (const step of scene.steps) step.title ??= scene.title;
