<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Maximum likelihood, from zero</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.css"><script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.js"></script>
<style>/* Proff visual kit. BlockFrame chrome (thick borders, hard offset shadows, heavy Inter, Space Grotesk labels)
   around clean figures. Dark only. Every colour is a token. Authors never edit this file. */
:root,[data-theme=dark]{   /* default palette "cyan": cyan blue and cyan green carry the figure; amber is the one warm highlight.
     Hues picked by search for colour-blind separation (CIEDE2000, Machado 2009 deutan/protan): c1-c3, c1-c2, c2-c3 stay >= ~20 for every reader.
     c1, c4, c5 and c6 are all cool and sit 15-18 apart: never let two of them carry a contrast alone (add a label, dash, or shape). */
  --bg:#0a0b0d;--fig:#111316;--surf:#171a1d;--surf2:#21252a;--line:#56616b;--line-dim:#2a3036;--grid:#21262b;
  --ink:#f0fbff;--muted:#a3b1bb;--dim:#6b7882;--on:#000000;
  --c1:#72c9f5;--c2:#f3a833;--c3:#6bebb6;--c4:#4f91f0;--c5:#c7ebee;--c6:#8f99a4;--mix:20%;
}
[data-palette=blockframe][data-theme=dark]{   /* preset "blockframe" (the v4.0 default): Block Frame pastels (frontend-slides, MIT) on black.
     c2 and c5 are both warm and light: never let them carry a contrast alone. */
  --bg:#0b0b0c;--fig:#121214;--surf:#18181b;--surf2:#232327;--line:#5a5a63;--line-dim:#2c2c31;--grid:#232327;
  --ink:#fffdf5;--muted:#a9a9b2;--dim:#6e6e76;--on:#000000;
  --c1:#8feaf7;--c2:#f5c030;--c3:#fe90e8;--c4:#99e885;--c5:#ffdc8b;--c6:#b7b4c7;--mix:20%;
}
[data-palette=lab][data-theme=dark]{   /* preset "lab": Okabe-Ito hues */
  --bg:#0e1116;--fig:#12161c;--surf:#171c23;--surf2:#1e242d;--line:#e8ecf2;--line-dim:#343c48;--grid:#222934;
  --ink:#eef2f7;--muted:#9aa5b5;--dim:#6a7584;--on:#0e1116;
  --c1:#5cb8f0;--c2:#f0b43c;--c3:#f2694a;--c4:#3ccf9e;--c5:#c98ae6;--c6:#cfdc5a;--mix:22%;
}
/* palette "neon" (the original proff look): Proff.page({palette:'neon'}) */
[data-palette=neon][data-theme=dark]{--bg:#0a0a0b;--fig:#111113;--surf:#161618;--surf2:#1d1d20;--line:#ececee;--line-dim:#3a3a3f;--grid:#26262b;
  --ink:#f4f4f5;--muted:#a1a1aa;--dim:#6b6b72;--on:#0a0a0b;--c1:#56c2ff;--c2:#ffc531;--c3:#ff6363;--c4:#59d499;--c5:#b98cff;--c6:#ff8f4a}
/* soft fills are mixed where data-theme is set, so they follow the live palette (a :root-only rule would freeze them to dark) */
:root,[data-theme]{--f-disp:'Inter',system-ui,-apple-system,sans-serif;--f-mono:'Space Grotesk',ui-monospace,Menlo,monospace;
  --f1:color-mix(in srgb,var(--c1) var(--mix),var(--fig));--f2:color-mix(in srgb,var(--c2) var(--mix),var(--fig));
  --f3:color-mix(in srgb,var(--c3) var(--mix),var(--fig));--f4:color-mix(in srgb,var(--c4) var(--mix),var(--fig));
  --f5:color-mix(in srgb,var(--c5) var(--mix),var(--fig));--f6:color-mix(in srgb,var(--c6) var(--mix),var(--fig));
  --acc:var(--c1);--stage-w:min(1240px,calc(100vw - 32px))}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:var(--f-disp);font-size:18px;line-height:1.55;-webkit-font-smoothing:antialiased;
  padding:28px 16px 64px;transition:background .2s,color .2s}
b,strong{font-weight:700}
code,.mono{font-family:var(--f-mono);font-size:.92em}
a{color:var(--c1)}

/* header: compact so the stage owns the screen */
.top{max-width:var(--stage-w);margin:0 auto 22px;display:flex;align-items:flex-end;gap:20px;flex-wrap:wrap;
  border-bottom:3px solid var(--line);padding-bottom:16px}
.top .tx{flex:1;min-width:260px}
.eyebrow{display:inline-block;font-family:var(--f-mono);font-weight:700;font-size:12px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--on);background:var(--acc);border:2px solid var(--line);box-shadow:3px 3px 0 var(--line);padding:3px 10px;margin-bottom:12px}
h1{font-size:clamp(26px,3.4vw,40px);font-weight:900;text-transform:uppercase;letter-spacing:-.025em;line-height:1}
.sub{font-family:var(--f-mono);font-size:14px;color:var(--muted);margin-top:8px}.sub::before{content:"// ";color:var(--acc)}

/* the stage card: the figure is the hero */
.card{position:relative;max-width:var(--stage-w);margin:0 auto 40px;background:var(--surf);border:3px solid var(--line);
  box-shadow:8px 8px 0 var(--acc);padding:20px 22px 18px}
.head{display:flex;align-items:baseline;gap:14px;min-height:34px;padding-right:44px;margin-bottom:12px}
.phase{font:700 11px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--on);background:var(--acc);border:2px solid var(--line);padding:2px 8px;white-space:nowrap}
.stitle{font-size:clamp(18px,2vw,24px);font-weight:850;letter-spacing:-.01em;line-height:1.15}
.fig{position:relative;background:var(--fig);border:2px solid var(--line);overflow:hidden}
.fig svg,.fig canvas{display:block;width:100%;height:auto;max-height:70vh;margin:0 auto}
.fig svg text{font-family:var(--f-disp)}
.fig svg .mono{font-family:var(--f-mono)}
.ib{position:absolute;top:16px;right:18px;width:32px;height:32px;border:2px solid var(--line);background:var(--acc);color:var(--on);
  font:900 15px var(--f-mono);cursor:pointer;box-shadow:3px 3px 0 var(--line)}
.ib[aria-expanded=true]{background:var(--line);color:var(--bg)}

/* figure + step strip: the strip is the figure's bottom edge; chevrons appear on the figure's sides on hover */
.figwrap{position:relative}
.strip{position:relative;display:flex;gap:10px;margin-top:6px;height:14px;align-items:flex-start}
.sg{display:flex;gap:3px;min-width:0}
.seg{flex:1;min-width:6px;height:4px;padding:0;border:0;background:var(--line-dim);cursor:pointer;position:relative;transition:height .15s}
.seg::after{content:"";position:absolute;inset:-6px 0}   /* bigger hit area */
.seg i{display:block;height:100%;width:0;background:var(--acc)}
.strip:hover .seg{height:8px}
.seg[aria-selected=true]{box-shadow:0 0 0 1px var(--acc)}
.seg:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
.tip{position:absolute;bottom:18px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .12s;
  font:700 11px var(--f-mono);letter-spacing:.04em;color:var(--ink);background:var(--surf2);border:1px solid var(--line-dim);padding:3px 8px}
.tip.on{opacity:1}
.gh{position:absolute;top:calc(50% - 40px);width:44px;height:64px;border:0;background:color-mix(in srgb,var(--surf) 70%,transparent);color:var(--ink);
  font:900 26px var(--f-mono);cursor:pointer;opacity:0;transition:opacity .15s}
.gh.prev{left:0}.gh.next{right:0}
.figwrap:hover .gh:not(:disabled),.gh:focus-visible{opacity:.85}
.gh:disabled{display:none}
@media (hover:none){.gh:not(:disabled){opacity:.55}}

/* controls: one quiet line; drag the value sideways, or use the thin track that shows on hover */
.ctl{display:flex;flex-wrap:wrap;align-items:center;gap:8px 30px;margin:12px 0 0;padding:0 2px}
.kn{position:relative;display:inline-flex;align-items:baseline;gap:9px;font:700 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-bottom:8px}
.kv{font:800 17px var(--f-mono);letter-spacing:0;text-transform:none;color:var(--acc);border-bottom:2px dotted var(--acc);cursor:ew-resize;user-select:none;touch-action:none;min-width:2ch}
.kn input{position:absolute;left:0;right:0;bottom:-6px;width:100%;height:14px;margin:0;opacity:0;accent-color:var(--acc);cursor:pointer;transition:opacity .15s}
.kn:hover input,.kn.drag input,.kn input:focus-visible{opacity:1}
.kn.drag .kv{color:var(--ink)}
.kb{margin-left:auto;display:inline-flex;align-items:center;gap:7px;font:700 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);
  background:none;border:0;border-bottom:2px dotted var(--line-dim);padding:2px 0 6px;cursor:pointer}
.kb span{font-size:16px;color:var(--acc);transition:transform .3s}
.kb:hover{color:var(--ink)}.kb:active span{transform:rotate(-180deg)}

/* info sidebar: 30% of the screen on the right; the page shifts left so nothing is hidden */
.side{position:fixed;top:0;right:0;z-index:50;height:100vh;width:clamp(360px,32vw,500px);overflow-y:auto;background:var(--surf);
  border-left:3px solid var(--line);padding:24px 32px 56px;transform:translateX(102%);transition:transform .22s ease;font-size:17px;line-height:1.6}
.side.open{transform:none}
.side .lead{font-size:19px;line-height:1.6;color:var(--ink);margin:0 0 24px}
.side .sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.side .sx{width:32px;height:32px;border:2px solid var(--line);background:var(--surf2);color:var(--ink);font:900 18px var(--f-mono);cursor:pointer}
.side .st{font-size:23px;font-weight:850;line-height:1.25;margin-bottom:18px}
.side section{padding:24px 0;border-top:1px solid var(--line-dim)}
.side h4{font:700 12px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--acc);margin-bottom:14px}
.side ul{padding-left:1.1em}.side li{margin:.7em 0;line-height:1.6}.side p+p{margin-top:.8em}
/* notation: "symbol : meaning" on one line, the example under it */
.side .nts{display:grid;grid-template-columns:max-content auto 1fr;column-gap:10px;align-items:baseline}
.side .nt,.side .nk{display:contents}
.side .sym{grid-column:1;font-weight:700;color:var(--acc);white-space:nowrap;line-height:1.55}
.side .col{grid-column:2;color:var(--dim)}
.side .ne{grid-column:3;color:var(--ink);line-height:1.55}
.side .eg{grid-column:3;margin:6px 0 22px;font:15px/1.55 var(--f-mono);color:var(--muted)}
.side .nt:last-child .eg{margin-bottom:4px}
.side .eg strong{color:var(--ink)}
.side .wx{font:16px/1.6 var(--f-mono);color:var(--ink);background:var(--surf2);border-left:3px solid var(--acc);padding:12px 16px}
.side details{margin-top:12px;border-top:2px solid var(--line-dim);padding-top:10px}.side summary{cursor:pointer;font:700 11px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
@media (min-width:1000px){body.side-on{--stage-w:min(1240px,calc(100vw - clamp(360px,32vw,500px) - 48px));padding-right:calc(clamp(360px,32vw,500px) + 16px)}}
@media (max-width:1399px){.side{width:340px;padding:22px 26px 48px}body.side-on{--stage-w:calc(100vw - 340px - 48px);padding-right:356px}}   /* laptops: keep the figure big enough that 16-unit labels stay ≥ 12 px */
@media (max-width:999px){.side{width:min(92vw,460px);box-shadow:-12px 0 0 rgba(0,0,0,.35)}}

/* article layout: short prose between wide figures */
.prose{max-width:68ch;margin:0 auto 26px;font-size:19px}
.prose p+p{margin-top:.8em}
.prose h2{font-size:clamp(22px,2.6vw,30px);font-weight:900;text-transform:uppercase;letter-spacing:-.02em;margin:46px 0 14px;line-height:1.05}
.prose ul{padding-left:1.2em}.prose li{margin:.25em 0}
.acc1{--acc:var(--c1)}.acc2{--acc:var(--c2)}.acc3{--acc:var(--c3)}.acc4{--acc:var(--c4)}.acc5{--acc:var(--c5)}.acc6{--acc:var(--c6)}

/* study page blocks */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:22px;max-width:var(--stage-w);margin:0 auto 34px}
.tile{background:var(--surf);border:3px solid var(--line);box-shadow:6px 6px 0 var(--acc);padding:18px 20px}
.tile h3{font-size:17px;font-weight:850;text-transform:uppercase;letter-spacing:-.01em;margin-bottom:8px;line-height:1.15}
.tile p,.tile li{font-size:16px}.tile ul{padding-left:1.1em}
.tile .tag{font:700 11px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:6px}
.big{font-size:44px;font-weight:900;letter-spacing:-.03em;line-height:1;color:var(--acc)}
.flip{cursor:pointer}.flip .a{display:none;margin-top:10px;padding-top:10px;border-top:2px dashed var(--line-dim)}.flip.on .a{display:block}
.flip .hint{font:700 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin-top:8px}
.flip.on .hint{display:none}
table.cmp{width:100%;max-width:var(--stage-w);margin:0 auto 34px;border-collapse:collapse;background:var(--surf);border:3px solid var(--line);box-shadow:6px 6px 0 var(--acc)}
table.cmp th,table.cmp td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line-dim);font-size:16px;vertical-align:top}
table.cmp th{font:700 12px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sec{display:block;max-width:var(--stage-w);margin:40px auto 16px;font:700 13px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);border-bottom:2px solid var(--line-dim);padding-bottom:6px}

/* calc engine extras */
.fig .katex{font-size:1em}
.fig .katex svg{height:inherit;max-height:none;margin:0}  /* KaTeX draws radicals with inner SVGs; the stage rule above must not resize them */
.fig foreignObject div{color:var(--ink);font-family:var(--f-disp);line-height:1.2}
.foot{max-width:var(--stage-w);margin:30px auto 0;font:500 12px var(--f-mono);color:var(--dim)}

@media (max-width:700px){
  body{padding:18px 12px 48px;font-size:17px}
  .card{padding:14px 12px;box-shadow:5px 5px 0 var(--acc)}
  .fig.pan{overflow-x:auto}.fig.pan svg{min-width:720px;max-height:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head>

<script>/* Proff stage runtime: page shell, scenes, steps, controls, drawing kit, self-audit.
   Authors call Proff.page / Proff.scene / Proff.prose in story.js; build.py inlines this file. Do not edit per topic. */
(function () {
  'use strict';
  const P = window.Proff = { scenes: [], blocks: [], opts: {}, errors: [], plugins: {} };
  const TOK = ['ink', 'muted', 'dim', 'line', 'grid', 'fig', 'surf', 'surf2', 'bg', 'on', 'line-dim'];
  const col = c => c == null ? null : /^[cf][1-6]$/.test(c) || TOK.includes(c) ? `var(--${c})` : c;
  const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const md = s => esc(s || '').replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\*(.+?)\*/g, '<i>$1</i>').replace(/`(.+?)`/g, '<code>$1</code>');
  const para = s => String(s || '').split(/\n\s*\n/).map(b => /^\s*- /.test(b)
    ? '<ul>' + b.split('\n').filter(l => l.trim()).map(l => '<li>' + md(l.replace(/^\s*- /, '')) + '</li>').join('') + '</ul>'
    : '<p>' + md(b) + '</p>').join('');
  P.md = para;

  // ---------- maths helpers ----------
  P.lerp = (a, b, t) => a + (b - a) * t;
  P.ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  P.seg = (t, a, b) => Math.max(0, Math.min(1, (t - a) / (b - a)));   // progress of t inside [a,b]
  P.clamp = (x, a, b) => Math.max(a, Math.min(b, x));
  P.range = (a, b, n) => Array.from({ length: n }, (_, i) => a + (b - a) * i / (n - 1));
  P.fmt = (v, d) => v == null || isNaN(v) ? '–' : Math.abs(v) >= 1e5 || (Math.abs(v) < 1e-3 && v !== 0) ? v.toExponential(d ?? 1).replace('e+', 'e')
    : (+v.toFixed(d ?? (Number.isInteger(v) ? 0 : 2))).toLocaleString('en-US', { maximumFractionDigits: d ?? 2 });
  P.rng = seed => () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const lgamma = x => { const c = [76.18009172947146, -86.50532032941677, 24.01409824083091, -1.231739572450155, .1208650973866179e-2, -.5395239384953e-5];
    let y = x, t = x + 5.5; t -= (x + .5) * Math.log(t); let s = 1.000000000190015; for (const k of c) s += k / ++y; return -t + Math.log(2.5066282746310005 * s / x); };
  const erf = x => { const s = Math.sign(x); x = Math.abs(x); const t = 1 / (1 + .3275911 * x);
    return s * (1 - (((((1.061405429 * t - 1.453152027) * t) + 1.421413741) * t - .284496736) * t + .254829592) * t * Math.exp(-x * x)); };
  P.stat = {
    lgamma, erf,
    normPdf: (x, m = 0, s = 1) => Math.exp(-.5 * ((x - m) / s) ** 2) / (s * Math.sqrt(2 * Math.PI)),
    normCdf: (x, m = 0, s = 1) => .5 * (1 + erf((x - m) / (s * Math.SQRT2))),
    tPdf: (x, v) => Math.exp(lgamma((v + 1) / 2) - lgamma(v / 2)) / Math.sqrt(v * Math.PI) * (1 + x * x / v) ** (-(v + 1) / 2),
    binomPmf: (k, n, p) => Math.exp(lgamma(n + 1) - lgamma(k + 1) - lgamma(n - k + 1) + k * Math.log(p) + (n - k) * Math.log(1 - p)),
    poisPmf: (k, l) => Math.exp(k * Math.log(l) - l - lgamma(k + 1)),
    nbPmf: (k, mu, phi) => { const r = 1 / phi; return Math.exp(lgamma(k + r) - lgamma(r) - lgamma(k + 1) + r * Math.log(r / (r + mu)) + k * Math.log(mu / (r + mu))); },
    gammaPdf: (x, a, b) => x <= 0 ? 0 : Math.exp(a * Math.log(b) - lgamma(a) + (a - 1) * Math.log(x) - b * x),
    betaPdf: (x, a, b) => x <= 0 || x >= 1 ? 0 : Math.exp(lgamma(a + b) - lgamma(a) - lgamma(b) + (a - 1) * Math.log(x) + (b - 1) * Math.log(1 - x)),
    normal: r => () => Math.sqrt(-2 * Math.log(1 - r())) * Math.cos(2 * Math.PI * r()),
    mean: a => a.reduce((s, x) => s + x, 0) / a.length,
    sd: a => { const m = P.stat.mean(a); return Math.sqrt(a.reduce((s, x) => s + (x - m) ** 2, 0) / (a.length - 1)); },
  };

  // ---------- text measuring (shared by both backends and the audit) ----------
  const mctx = document.createElement('canvas').getContext('2d');
  const font = o => `${o.italic ? 'italic ' : ''}${o.weight || 500} ${o.size}px ${o.mono ? "'Space Grotesk',monospace" : "Inter,system-ui,sans-serif"}`;
  const runs = s => { const out = []; const re = /([_^])\{([^}]*)\}/g; let i = 0, m;   // x_{ij}, x^{2}
    while ((m = re.exec(s))) { if (m.index > i) out.push([s.slice(i, m.index), 0]); out.push([m[2], m[1] === '_' ? 1 : -1]); i = re.lastIndex; }
    if (i < s.length) out.push([s.slice(i), 0]); return out; };
  const measure = (s, o) => { mctx.font = font(o); let w = 0; for (const [t, sh] of runs(s)) { mctx.font = font({ ...o, size: sh ? o.size * .7 : o.size }); w += mctx.measureText(t).width; } return w; };

  // ---------- drawing kit: identical API on SVG and Canvas ----------
  function Kit(W, H, backend, rng) {
    const g = { W, H, rng, texts: [], boxes: [], segs: [], plots: [], words: 0 };
    let out = [], ctx = backend.ctx, alpha = [1], xf = [[0, 0, 1]];
    const vars = backend.vars || (k => k);
    const X = (x, y) => { const [tx, ty, s] = xf[xf.length - 1]; return [tx + x * s, ty + y * s]; };   // to stage units, for the audit
    const S = () => xf[xf.length - 1][2];
    const A = () => alpha[alpha.length - 1];
    const C = c => ctx ? vars(c) : col(c);
    const reg = (kind, a) => (A() > .05) && g[kind].push(a);
    const box = (x, y, w, h, solid) => { const [a, b] = X(x, y), s = S(); reg('boxes', { x0: a, y0: b, x1: a + w * s, y1: b + h * s, solid }); };
    const seg = (x1, y1, x2, y2) => { const [a, b] = X(x1, y1), [c, d] = X(x2, y2); reg('segs', [a, b, c, d]); };
    const style = o => { const f = o.fill === undefined ? 'none' : col(o.fill), st = o.stroke === undefined ? (o.fill === undefined ? 'var(--ink)' : 'none') : col(o.stroke);
      return `fill="${f}" stroke="${st}" stroke-width="${o.sw ?? 2}"${o.dash ? ` stroke-dasharray="${o.dash === true ? '7 6' : o.dash}"` : ''}${o.op != null ? ` opacity="${o.op}"` : ''} stroke-linecap="round" stroke-linejoin="round"${o.cls ? ` class="${o.cls}"` : ''}`; };
    const cv = (o, path) => {  // canvas paint
      ctx.save(); ctx.globalAlpha = A() * (o.op ?? 1);
      if (o.fill !== undefined && o.fill !== 'none') { ctx.fillStyle = C(o.fill); ctx.fill(path); }
      const st = o.stroke === undefined ? (o.fill === undefined ? 'ink' : null) : o.stroke;
      if (st && st !== 'none') { ctx.strokeStyle = C(st); ctx.lineWidth = o.sw ?? 2; ctx.lineCap = ctx.lineJoin = 'round'; ctx.setLineDash(o.dash ? (o.dash === true ? [7, 6] : String(o.dash).split(/\s+/).map(Number)) : []); ctx.stroke(path); }
      ctx.restore(); };
    g.path = (d, o = {}) => { if (ctx) cv(o, new Path2D(d)); else out.push(`<path d="${d}" ${style(o)}/>`); if (o.reg) o.reg.forEach(p => seg(...p)); return g; };
    g.rect = (x, y, w, h, o = {}) => { const r = o.r || 0;
      if (ctx) { const p = new Path2D(); r ? p.roundRect(x, y, w, h, r) : p.rect(x, y, w, h); cv(o, p); }
      else out.push(`<rect x="${x}" y="${y}" width="${w}" height="${h}"${r ? ` rx="${r}"` : ''} ${style(o)}/>`);
      if (!o.free) box(x, y, w, h, o.fill !== undefined && o.fill !== 'none'); return g; };
    g.circle = (cx, cy, r, o = {}) => { if (ctx) { const p = new Path2D(); p.arc(cx, cy, r, 0, 7); cv(o, p); } else out.push(`<circle cx="${cx}" cy="${cy}" r="${r}" ${style(o)}/>`);
      if (!o.free && r > 6) box(cx - r * .7, cy - r * .7, r * 1.4, r * 1.4, o.fill !== undefined && o.fill !== 'none'); return g; };
    g.ellipse = (cx, cy, rx, ry, o = {}) => { if (ctx) { const p = new Path2D(); p.ellipse(cx, cy, rx, ry, 0, 0, 7); cv(o, p); } else out.push(`<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" ${style(o)}/>`); return g; };

const withCtx = (spec, c) => {

      'P(h \\mid p)': ['probability of h heads in 10 flips, if the bias is p', `P(7 | 0.50) = ${f3(L5(7, .5))}`],

    try: 'Set **heads seen** to 3. Every likelihood changes, and the peak moves to 0.30.' },
  steps: [
    { cap: '**Probability** looks forward: you know the coin and predict the data. A fair coin (p = 0.50) gives these chances for 10 flips.',
      info: { see: ['One bar per head count'], read: ['Question: if the coin is p, what data will I see?'] } },
    { cap: 'Science runs backwards: you saw 7 heads and do not know p. Only one bar matters now, the one for 7 heads.',
      info: { see: ['Filled bar: the count you saw', 'Number: its height for your p'], read: ['Question now: which p makes 7 heads easy to get?'] } },
    { cap: 'Try different coins. For each p, read the height of the 7-heads bar and plot it above that p.',

    { cap: 'Do it for every p and you get a curve: the **likelihood** L(p). It scores how well each p explains the data you saw.',

    { cap: 'The top of the curve is the **maximum likelihood estimate** (MLE), written p̂. For a coin it is the share of heads: 7 ÷ 10.',
      info: { see: ['Dashed line: the peak', 'Ratio: how many times better p̂ explains the data than your p'], read: ['The hat ˆ always means "estimated from data"'] } }],
  draw(g, k, t, p) {
    const ph = p.h / 10;
    g.panel('fwd', D => {
      const A = g.axes({ ...D, xd: [-.6, 10.6], yd: [0, .7], xt: [0, 2, 4, 6, 8, 10], yt: [0, .2, .4, .6], grid: true, xl: 'number of heads in 10 flips', yl: `probability, coin p = ${f2(p.p)}` });
      const bw = (A.sx(1) - A.sx(0)) * .7;
      for (let h = 0; h <= 10; h++) { const y = A.sy(L5(h, p.p)), hit = k >= 1 && h === p.h;

      if (k >= 1) g.fade(on(k, 1, t), g => g.text(A.sx(p.h), A.sy(L5(p.h, p.p)) - 22, f3(L5(p.h, p.p)), { size: 26, anchor: 'middle', weight: 800, mono: true, fill: 'c1' }));
    });
    g.panel('trace', D => {
      const A = g.axes({ ...D, xd: [0, 1], yd: [0, .5], xt: [0, .2, .4, .6, .8, 1], yt: [0, .1, .2, .3, .4, .5], grid: true, xl: 'coin bias p', yl: `likelihood of ${p.h} heads in 10` });
      const L = q => L5(p.h, q);

      for (let i = 1; i <= 9; i++) { const q = i / 10;
        g.circle(A.sx(q), A.sy(L(q)), 7, { fill: 'c6', stroke: 'fig', sw: 1.5, free: true });
        if (k === 2) g.text(A.sx(q), A.sy(L(q)) - 24, f3(L(q)), { size: 18, anchor: 'middle', weight: 700, mono: true, fill: 'muted' }); }
      if (k >= 4) g.fade(on(k, 4, t), g => {
        g.line(A.sx(ph), A.sy(L(ph)), A.sx(ph), A.y + A.h, { stroke: 'c3', sw: 3, dash: true, free: true });
        g.label(A.sx(ph) + (ph > .5 ? -150 : 150), A.sy(L(ph)) - 16, `p̂ = ${f2(ph)}`, { to: [A.sx(ph), A.sy(L(ph))], size: 24, weight: 800, fill: 'c3', lc: 'c3' });
        g.text(A.sx(ph > .5 ? .22 : .78), A.sy(.38), `L(p̂) ÷ L(p) = ${fr(L(ph) / L(p.p))}`, { size: 24, anchor: 'middle', weight: 800, mono: true, fill: 'ink' });
      });
      const y = A.sy(L(p.p));
      g.line(A.sx(p.p), y, A.sx(p.p), A.y + A.h, { stroke: 'c2', sw: 2, free: true });
      g.circle(A.sx(p.p), y, 10, { fill: 'c2', stroke: 'fig', sw: 2, free: true });
      g.text(A.sx(ph > .5 ? .22 : .78), A.sy(.46), `L(${f2(p.p)}) = ${f3(L(p.p))}`, { size: 26, anchor: 'middle', weight: 800, mono: true, fill: 'c2' });
    });
  }
});

// ---------------- scene 6: one table, read two ways ----------------
Proff.scene({
  title: 'One table, read two ways: probability across, likelihood down', phase: 'part 2 · likelihood', acc: 3, h: 640,
  panels: [{ id: 'grid', from: 0 }],
  controls: [
    { name: 'r', label: 'row: coin bias p', min: .1, max: .9, step: .1, value: .5 },
    { name: 'c', label: 'column: heads seen h', min: 0, max: 10, step: 1, value: 7 }],
  info: {
    notation: {
      'P(h \\mid p)': ['one cell: chance of h heads in 10 flips, if the bias is p', `row p = 0.5, column h = 7: ${f3(L5(7, .5))}`],
      'L(p)': ['the same cell, read as a score for p, with h fixed', `L(0.7) = ${f3(L5(7, .7))} for h = 7`],
      '\\sum': ['add up', `row p = 0.5: 0.001 + 0.010 + … = 1.000`] },
    try: 'Move **column: heads seen** to 0. The column sum changes; every row sum stays 1.000.' },
  steps: [
    { cap: 'Each cell: the chance of h heads in 10 flips, if the coin is p. **Across a row**, p is fixed: a distribution, adding to 1.',
      info: { see: ['Stronger shading: higher chance', 'Highlighted row: your p, with its sum'], read: ['This is the probability question from part 1'] } },
    { cap: 'Read **down a column**: data fixed, p varies. That is the likelihood. Nothing forces these numbers to add to 1.',
      info: { see: ['Highlighted column: your h, with its sum'], read: [`Over every p from 0 to 1, the area under L is ${f3(1 / 11)} for any h, not 1`] } },
    { cap: 'So L(0.7) = 0.267 does not mean "27% chance that p is 0.7". Compare likelihoods only as ratios: how many times better one p explains the data.',
      info: { see: ['Ratio: best cell in the column ÷ your row'], read: ['A probability for p itself needs extra assumptions (a prior; that is Bayes)'] } }],
  draw(g, k, t, p) {
    const ps = Proff.range(.1, .9, 9), ri = Math.round(p.r * 10) - 1, c = p.c, M = ps.map(q => Array.from({ length: 11 }, (_, h) => L5(h, q)));
    g.panel('grid', D => {
      const cw = 76, ch = 38, x0 = D.x + (D.w - cw * 11) / 2 - 20, y0 = D.y + 52;
      const showRow = k !== 1, showCol = k >= 1;
      g.matrix(x0, y0, M, { cw, ch, size: 21, title: 'h = heads seen in 10 flips',
        rows: ps.map(q => `p = ${q.toFixed(1)}`), cols: Array.from({ length: 11 }, (_, h) => String(h)),
        cell: (i, j, v) => { const inR = showRow && i === ri, inC = showCol && j === c;
          return { fill: inR ? 'f2' : inC ? 'f1' : 'c6', op: inR || inC ? 1 : .05 + .55 * Math.min(1, v / .35), text: inR || inC ? f3(v) : '', color: 'ink', weight: inR && inC ? 900 : 600 }; } });
      const rs = M[ri].reduce((a, b) => a + b, 0), cs = M.reduce((a, row) => a + row[c], 0);
      if (showRow) g.text(x0 + cw * 11 + 16, y0 + (ri + .5) * ch, `sum ${f3(rs)}`, { size: 20, weight: 800, mono: true, fill: 'c2' });
      if (showCol) g.fade(on(k, 1, t), g => g.text(x0 + (c + .5) * cw, y0 + 9 * ch + 26, `sum ${cs.toFixed(2)}`, { size: 20, anchor: 'middle', weight: 800, mono: true, fill: 'c1' }));
      if (k >= 2) g.fade(on(k, 2, t), g => { let bi = 0; M.forEach((row, i) => { if (row[c] > M[bi][c]) bi = i; });
        g.text(D.x + D.w / 2, y0 + 9 * ch + 72, `L(${ps[bi].toFixed(1)}) ÷ L(${ps[ri].toFixed(1)}) = ${fr(M[bi][c] / M[ri][c])}`, { size: 26, anchor: 'middle', weight: 800, mono: true, fill: 'c3' }); });
    });

// =============== PART 3 · MANY POINTS, AND WHY LOGS ===============
Proff.section('part 3 · many data points, and why logs');
Proff.prose('A count of heads hides a step. Real data come one point at a time: one flip, one cell, one patient. Part 3 builds the likelihood point by point, hits a problem, and uses the log tool from part 1 to fix it.');

// ---------------- scene 7: one factor per point; the product collapses ----------------
const SEQ = (() => { const r = Proff.rng(21), a = []; for (let i = 0; i < 2000; i++) a.push(r() < .7 ? 1 : 0); return a; })();
Proff.scene({
  title: 'The likelihood of many points is a product, and products collapse', phase: 'part 3 · many points', acc: 5, h: 640,
  panels: [{ id: 'decode', from: 0 }, { id: 'each', from: 1 }, { id: 'prod', from: 2 }],
  controls: [
    { name: 'p', label: 'coin bias p', min: .05, max: .95, step: .01, value: .6 },
    { name: 'n', label: 'flips used', min: 30, max: 100, step: 10, value: 100 }],
  info: {
    notation: {
      x_i: ['flip number i, as a number: 1 for heads, 0 for tails', 'x₁ = 1: the first flip was heads'],
      'P(x_i \\mid p)': ['chance of flip i, if the bias is p', 'p = 0.60 for a head, 0.40 for a tail'],
      '\\prod_i': ['multiply over every flip i = 1 … n', '0.60 × 0.40 × 0.60 × … (100 factors)'],
      'L(p)': ['likelihood of all flips together', `L(0.60), 100 flips: ${sci(Math.exp(SEQ.slice(0, 100).reduce((a, x) => a + ln(x ? .6 : .4), 0)))}`] },
    try: 'Slide **flips used** from 30 to 100. The product drops by more than 10 powers of ten.' },
  steps: [
    { cap: 'Write each flip as a number: xᵢ = 1 for heads, 0 for tails. Then one formula gives the chance of either outcome.',
      info: { see: ['Top: the formula', 'Rows: what it gives for heads and for tails'], read: ['The power 0 switches a factor off: anything to the power 0 is 1'] } },
    { cap: '100 real flips (simulated, true bias 0.7). Each bar is P(xᵢ | p): the chance your guess p gives that one flip.',
      info: { see: ['Tall filled bars: heads, chance p', 'Short open bars: tails, chance 1 − p'] } },
    { cap: 'The flips are independent, so multiply all the bars. The running product falls toward 0 with every flip.',
      info: { see: ['Line: product of the first i bars', 'Formula: the product over all flips used'], read: ['Every factor is below 1, so each flip shrinks the total'] } },
    { cap: 'With 2,000 flips the computer stores the product as exactly 0. This is **underflow**. Every p then scores 0, and you cannot compare them.',
      info: { see: ['Number in the middle: the 2,000-flip product, as the computer stores it'], read: ['The smallest number a computer double holds is about 10⁻³²⁴', 'A single-cell dataset has millions of points'] } }],
  draw(g, k, t, p) {
    const xs = SEQ.slice(0, p.n), h = xs.reduce((a, b) => a + b, 0), q = x => x ? p.p : 1 - p.p;
    g.panel('decode', D => {
      const cx = D.x + D.w / 2;
      g.tex(cx, D.y + 50, 'P(x_i \\mid p) = p^{\\,x_i}\\,(1-p)^{\\,1-x_i}', { size: 34, w: 600 });
      [[1, D.y + D.h * .45], [0, D.y + D.h * .72]].forEach(([x, y]) => {
        g.circle(D.x + 170, y, 32, { fill: x ? 'f1' : 'f6', stroke: x ? 'c1' : 'c6', sw: 3, free: true });
        g.text(D.x + 170, y, x ? 'H' : 'T', { size: 26, anchor: 'middle', weight: 800, fill: x ? 'c1' : 'ink' });
        g.tex(D.x + 290, y, `x_i = ${x}`, { size: 28, w: 120 });
        g.tex(D.x + 700, y, x ? `p^{1}\\,(1-p)^{0} = p \\times 1 = ${f2(p.p)}` : `p^{0}\\,(1-p)^{1} = 1 \\times (1-p) = ${f2(1 - p.p)}`, { size: 30, w: 560 }); });
      g.text(cx, D.y + D.h * .93, 'anything to the power 0 is 1', { size: 20, anchor: 'middle', weight: 700, fill: 'muted' });
    });
    g.panel('each', D => {
      const A = g.axes({ ...D, xd: [0, 101], yd: [0, 1.15], xt: [1, 20, 40, 60, 80, 100], yt: [0, .5, 1], grid: true, xl: 'flip number i', yl: 'P(xᵢ | p): chance of this flip' });
      const bw = Math.max(2, (A.sx(1) - A.sx(0)) * .7);
      xs.forEach((x, i) => { const y = A.sy(q(x)); g.rect(A.sx(i + 1) - bw / 2, y, bw, A.y + A.h - y, { fill: x ? 'c1' : 'fig', stroke: x ? 'c1' : 'c6', sw: 1.5, free: true }); });
      g.text(A.x + A.w - 10, A.sy(1.08), `${h} heads · ${p.n - h} tails`, { size: 24, anchor: 'end', weight: 800, fill: 'c1' });
    });
    g.panel('prod', D => {
      const A = g.axes({ ...D, xd: [0, 101], yd: [0, 1.15], xt: [1, 20, 40, 60, 80, 100], yt: [0, .5, 1], grid: true, xl: 'flip number i', yl: 'running product' });
      let pr = 1; const pts = [[A.sx(0), A.sy(1)]]; xs.forEach((x, i) => { pr *= q(x); pts.push([A.sx(i + 1), A.sy(pr)]); });
      g.poly(pts, { stroke: 'c2', sw: 3 });
      g.tex(A.x + A.w * .6, A.sy(.98), `L(p) = \\prod_i P(x_i \\mid p) = ${texSci(pr)}`, { size: 28, w: 560 });
      if (k >= 3) g.fade(on(k, 3, t), g => {
        let big = 1; for (const x of SEQ) big *= q(x);
        g.text(A.x + A.w * .6, A.sy(.62), `2,000 flips: L = ${big === 0 ? '0' : sci(big)}`, { size: 30, anchor: 'middle', weight: 900, mono: true, fill: 'c3' });
      });
    });
  }
});

// ---------------- scene 8: logs rescue ----------------
Proff.scene({
  title: 'Logs turn the product into a sum and keep the same peak', phase: 'part 3 · many points', acc: 4, h: 640,
  panels: [{ id: 'run', from: 0 }, { id: 'split', from: 1 }, { id: 'peak', from: 2 }],
  controls: [
    { name: 'p', label: 'coin bias p', min: .05, max: .95, step: .01, value: .6 },
    { name: 'n', label: 'flips used', min: 30, max: 100, step: 10, value: 100 }],
  info: {
    notation: {
      '\\log P(x_i \\mid p)': ['log of the chance of flip i', `log 0.60 = ${ln(.6).toFixed(2)} for a head`],
      '\\sum_i': ['add up over every flip i = 1 … n', 'a head adds log p, a tail adds log(1 − p)'],
      '\\log L(p)': ['log-likelihood: one score for the guess p', `100 flips, p = 0.60: ${SEQ.slice(0, 100).reduce((a, x) => a + ln(x ? .6 : .4), 0).toFixed(1)}`] },
    try: 'Drag **coin bias p** across the range. The log score is highest at the share of heads.' },
  steps: [
    { cap: 'Take the log of each bar and add instead of multiplying. Log turns × into +, so the total stays a readable number.',
      info: { see: ['Line: running sum of logs', 'Every step goes down: the log of a number below 1 is negative'], read: ['The 2,000-flip total is an ordinary number, not 0'] } },
    { cap: 'Group the terms. Every head adds the same log p; every tail adds log(1 − p). So log L = h·log p + (n − h)·log(1 − p).',
      info: { see: ['Left block: all the tails', 'Right block: all the heads', 'Total: where the bar ends'] } },
    { cap: 'Log never changes which number is bigger. So log L peaks at exactly the same p as L. Both say p̂ = h ÷ n.',
      info: { see: ['Solid curve: log L for every p', 'Dashed curve: L itself, rescaled to fit', 'Dashed line: the shared peak'], read: ['Maximising log L gives the same answer as maximising L', 'This is why every method works with log-likelihood'] } }],
  draw(g, k, t, p) {
    const xs = SEQ.slice(0, p.n), h = xs.reduce((a, b) => a + b, 0), q = x => x ? p.p : 1 - p.p;
    const logL = pp => h * ln(pp) + (p.n - h) * ln(1 - pp);
    g.panel('run', D => {
      const A = g.axes({ ...D, xd: [0, 101], yd: [-140, 0], xt: [1, 20, 40, 60, 80, 100], yt: [-140, -100, -60, -20, 0], grid: true, xl: 'flip number i', yl: 'running sum of log chances' });
      let s = 0; const pts = [[A.sx(0), A.sy(0)]]; xs.forEach((x, i) => { s += ln(q(x)); pts.push([A.sx(i + 1), A.sy(Math.max(-140, s))]); });
      g.poly(pts, { stroke: 'c4', sw: 3 });
      g.tex(A.x + A.w * .66, A.sy(-8), `\\log L = \\sum_i \\log P(x_i\\mid p) = ${s.toFixed(1)}`, { size: 28, w: 540 });
      const big = SEQ.reduce((a, x) => a + ln(q(x)), 0);
      g.text(A.x + A.w * .66, A.sy(-22), `2,000 flips: log L = ${big.toFixed(1)}`, { size: 24, anchor: 'middle', weight: 800, mono: true, fill: 'c4' });
    });
    g.panel('split', D => {
      const A = g.axes({ ...D, xd: [-240, 0], yd: [0, 1], xt: [-240, -200, -160, -120, -80, -40, 0], yt: [], xl: 'log L (adds up to the left)', yl: '' });
      const hv = h * ln(p.p), tv = (p.n - h) * ln(1 - p.p), cy = A.sy(.45), bh = 70;
      g.rect(A.sx(hv), cy - bh / 2, A.sx(0) - A.sx(hv), bh, { fill: 'f1', stroke: 'c1', sw: 2.5 });
      g.rect(A.sx(Math.max(-240, hv + tv)), cy - bh / 2, A.sx(hv) - A.sx(Math.max(-240, hv + tv)), bh, { fill: 'f6', stroke: 'c6', sw: 2.5 });
      g.label(A.x + A.w, A.sy(.88), `${h} heads × log ${f2(p.p)} = ${hv.toFixed(1)}`, { to: [A.sx(hv / 2), cy - bh / 2], size: 22, weight: 800, fill: 'c1', anchor: 'end' });
      g.label(A.x, A.sy(.88), `${p.n - h} tails × log ${f2(1 - p.p)} = ${tv.toFixed(1)}`, { to: [A.sx(Math.max(-240, hv + tv / 2)), cy - bh / 2], size: 22, weight: 800, fill: 'ink', anchor: 'start' });
      g.tex(A.sx(-120), A.sy(.12), `\\log L = ${h}\\log ${f2(p.p)} + ${p.n - h}\\log ${f2(1 - p.p)} = ${(hv + tv).toFixed(1)}`, { size: 28, w: 640 });
    });
    g.panel('peak', D => {
      const A = g.axes({ ...D, xd: [0, 1], yd: [-140, 0], xt: [0, .2, .4, .6, .8, 1], yt: [-140, -100, -60, -20, 0], grid: true, xl: 'coin bias p', yl: 'log L' });
      const ph = h / p.n, top = logL(ph), lo = -140;
      g.curve(pp => Math.max(lo, logL(pp)), A, .005, .995, { stroke: 'c4', sw: 3 });
      g.curve(pp => lo + (-lo) * .8 * Math.exp(logL(pp) - top), A, .005, .995, { stroke: 'muted', sw: 2.5, dash: true });
      g.line(A.sx(ph), A.sy(0), A.sx(ph), A.y + A.h, { stroke: 'c3', sw: 3, dash: true, free: true });
      g.text(A.sx(ph) + (ph > .5 ? -14 : 14), A.sy(-5), `p̂ = ${h}/${p.n} = ${f2(ph)}`, { size: 24, anchor: ph > .5 ? 'end' : 'start', weight: 800, mono: true, fill: 'c3' });
      { const q = Proff.clamp(ph - 1.2 * Math.sqrt(ph * (1 - ph) / p.n), .03, .97), yq = lo + 112 * Math.exp(logL(q) - top); g.label(A.sx(q) - 120, A.sy(yq) - 10, 'L, rescaled', { to: [A.sx(q), A.sy(yq)], size: 20, fill: 'muted' }); }
      g.circle(A.sx(p.p), A.sy(Math.max(lo, logL(p.p))), 9, { fill: 'c2', stroke: 'fig', sw: 2, free: true });
      g.text(A.sx(ph > .5 ? .04 : .96), A.sy(-20), `log L(${f2(p.p)}) = ${logL(p.p).toFixed(1)}`, { size: 22, anchor: ph > .5 ? 'start' : 'end', weight: 800, mono: true, fill: 'c2' });
    });
  }
});

  draw(g, k, t, p) {

// =============== PART 5 · CONTINUOUS MEASUREMENTS ===============
Proff.section('part 5 · continuous measurements');
Proff.prose('Coins give yes or no. Most biology measurements are numbers on a scale: expression, weight, intensity. The usual model for them is the bell curve. The recipe stays the same: score each point, take logs, add, find the top.');

// ---------------- scene 10: the normal distribution ----------------
const XN = (() => { const r = Proff.rng(5), z = S.normal(r), a = []; for (let i = 0; i < 12; i++) a.push(+(6 + 1.5 * z()).toFixed(2)); return a; })();
const xbar = S.mean(XN), sMLE = Math.sqrt(XN.reduce((a, x) => a + (x - xbar) ** 2, 0) / XN.length);
const llN = (mu, sg) => XN.reduce((a, x) => a + ln(S.normPdf(x, mu, sg)), 0);
Proff.scene({
  title: 'A bell curve has two knobs; the data pick them', phase: 'part 5 · continuous data', acc: 3, h: 640,

    { cap: 'Measurements can take any value. A **normal distribution** gives chances as areas under its curve: the shaded area is the chance of a value from 5 to 7.',

    { cap: 'Same recipe as the coin: take the log of every height and add them. Drag μ and σ to push the total up.',

    { cap: 'Hold σ and sweep μ. The peak always sits at the plain **average** of the data, x̄.',
      info: { see: ['Curve: log L for every μ, with σ held at your value', 'Dashed line: the peak, at x̄'], read: ['Setting the slope to 0 gives μ̂ = x̄ for any σ'] } },

  draw(g, k, t, p) {
    const fitAxes = D => g.axes({ ...D, xd: [0, 12], yd: [0, .95], xt: [0, 2, 4, 6, 8, 10, 12], yt: [0, .2, .4, .6, .8], grid: true, xl: 'log₂ expression', yl: 'density' });

      if (k === 2) g.fade(t, g => { g.label(A.sx(xm) - 40, A.sy(fm) - 150, `f(${xm.toFixed(2)}) = ${f3(fm)}`, { to: [A.sx(xm), A.sy(fm)], size: 22, weight: 800, fill: 'c1' });
        g.tex(A.x + A.w * (p.mu < 6 ? .72 : .3), A.sy(.86), 'f(x\\mid\\mu,\\sigma) = \\frac{1}{\\sigma\\sqrt{2\\pi}}\\,e^{-(x-\\mu)^2/2\\sigma^2}', { size: 28, w: 440 }); });

      g.text(A.sx(xbar) - 14, A.sy(-13), `best μ = ${xbar.toFixed(2)}`, { size: 24, anchor: 'end', weight: 800, mono: true, fill: 'c3' });

    });

      g.line(A.sx(sMLE), A.sy(hi), A.sx(sMLE), A.y + A.h, { stroke: 'c3', sw: 3, dash: true, free: true });

// =============== PART 6 · MODELS ===============
Proff.section('part 6 · models: regression, classification, deep learning');
Proff.prose('So far the knobs described one distribution. In a model, the knobs set how the distribution **changes** with an input: dose, marker level, an image. Machine learning also flips the hill upside down. It minimises −log L and calls it the **loss**. Same top, now a bottom.');

// ---------------- scene 11: least squares = Gaussian MLE ----------------
const XY = (() => { const r = Proff.rng(9), z = S.normal(r), a = []; for (let i = 0; i < 15; i++) { const x = +(r() * 10).toFixed(2); a.push([x, 2 + .6 * x + z()]); } return a; })();
const xm5 = S.mean(XY.map(d => d[0])), ym5 = S.mean(XY.map(d => d[1]));
const sse = b => XY.reduce((a, [x, y]) => a + (y - (ym5 + b * (x - xm5))) ** 2, 0);
const bHat = XY.reduce((a, [x, y]) => a + (x - xm5) * (y - ym5), 0) / XY.reduce((a, [x]) => a + (x - xm5) ** 2, 0);
const c5 = XY.length / 2 * ln(2 * Math.PI), nll5 = b => sse(b) / 2 + c5;
Proff.scene(withCtx({
  title: 'Least squares is maximum likelihood with bell-curve noise', phase: 'part 6 · regression', acc: 5, h: 640,
  panels: [{ id: 'line', from: 0 }, { id: 'loss', from: 3 }],
  controls: [{ name: 'b', label: 'slope b', min: -.4, max: 1.4, step: .01, value: 1.1 }],
  info: {
    notation: {
      'x_i, y_i': ['dose and response of sample i', `sample 1: x = ${XY[0][0].toFixed(2)}, y = ${XY[0][1].toFixed(2)}`],
      b: ['slope of the line: response change per unit dose', 'b = 1.10 at the start'],
      r_i: ['residual: y_i minus the line at x_i', 'a vertical gap on the plot'],
      '\\sum_i r_i^2': ['sum of squared residuals', `${sse(1.1).toFixed(1)} at b = 1.10`],
      '\\sigma': ['noise width, set to 1 here', 'it scales the loss but never moves its lowest point'] },
    try: `Drag **slope b** to the dashed line at ${bHat.toFixed(2)}. The squared gaps and −log L both hit their lowest value there.` },
  steps: [
    { cap: 'Fifteen samples: drug dose against response (simulated). The line is the model\'s guess for the average response; drag its slope.',
      info: { see: ['Dots: the samples', 'Line: y = a + b·x for your b; a keeps it through the average point'] } },
    { cap: 'The model says: response = line + bell-curve noise. So each point gets its own bell, centred on the line at its dose.',
      info: { see: ['Sideways bells: the noise model at three doses, σ = 1'], read: ['This is part 5 again, with μ set by the line'] } },
    { cap: 'Vertical gaps are **residuals** rᵢ. A point far from the line sits in its bell\'s thin tail: low height, low likelihood.',
      info: { see: ['Vertical segments: residuals', 'Formula: their squares, added up'] } },
    { cap: 'Flip to −log L, the loss. With σ = 1, each point adds r²/2 + 0.92. So the loss is half the squared residuals, plus a constant.',
      info: { see: ['Curve: −log L for every slope', 'Dashed line: the best slope b̂'], read: ['The log undoes the e in the bell formula', `The constant ${c5.toFixed(1)} = (15/2)·log 2π does not depend on b`] } },
    { cap: 'Divide the squared residuals by n and you get **MSE** (mean squared error), the default regression loss in machine learning.',
      info: { read: ['Minimising MSE = maximising a normal likelihood', 'Heavy-tailed noise breaks this: a few outliers dominate MSE'] } }],
  draw(g, k, t, p) {
    const a = ym5 - p.b * xm5, line = x => a + p.b * x;
    g.panel('line', D => {
      const A = g.axes({ ...D, xd: [0, 10], yd: [0, 12], xt: [0, 2, 4, 6, 8, 10], yt: [0, 4, 8, 12], grid: true, xl: 'dose (mg)', yl: 'response' });
      const y0 = Proff.clamp(line(0), -2, 14), y1 = Proff.clamp(line(10), -2, 14);
      if (k >= 1) g.fade(on(k, 1, t), g => [2, 5, 8].forEach(x0 => { const c = line(x0); if (c < 2.6 || c > 9.4) return;
        const pts = Proff.range(-2.5, 2.5, 40).map(v => [A.sx(x0) + S.normPdf(v) * 150, A.sy(c + v)]);
        g.poly(pts, { stroke: 'c6', sw: 2.5 }); g.line(A.sx(x0), A.sy(c - 2.5), A.sx(x0), A.sy(c + 2.5), { stroke: 'c6', sw: 1.5, dash: true, free: true }); }));
      g.line(A.sx(0), A.sy(Math.max(0, Math.min(12, y0))), A.sx(10), A.sy(Math.max(0, Math.min(12, y1))), { stroke: 'c2', sw: 3.5, free: true });
      if (k >= 2) g.fade(on(k, 2, t), g => { XY.forEach(([x, y]) => g.line(A.sx(x), A.sy(y), A.sx(x), A.sy(Proff.clamp(line(x), 0, 12)), { stroke: 'c5', sw: 2.5, free: true }));
        g.tex(A.x + A.w * .25, A.sy(11), `\\textstyle\\sum_i r_i^2 = ${sse(p.b).toFixed(1)}`, { size: 28, w: 260 }); });
      XY.forEach(([x, y]) => g.circle(A.sx(x), A.sy(y), 8, { fill: 'c1', stroke: 'fig', sw: 1.5, free: true }));

      const A = g.axes({ ...D, xd: [-.4, 1.4], yd: [0, 80], xt: [0, .4, .8, 1.2], yt: [0, 20, 40, 60, 80], grid: true, xl: 'slope b', yl: '−log L (the loss)' });

      g.text(A.sx(bHat) + 14, A.sy(6), `b̂ = ${bHat.toFixed(2)}`, { size: 24, weight: 800, mono: true, fill: 'c3' });

      g.tex(A.x + A.w * .5, A.sy(72), `-\\log L = \\tfrac{1}{2}\\textstyle\\sum_i r_i^2 + ${c5.toFixed(1)} = ${nll5(p.b).toFixed(1)}`, { size: 28, w: 500 });
      if (k >= 4) g.fade(on(k, 4, t), g => g.tex(A.x + A.w * .5, A.sy(58), `\\text{MSE} = \\tfrac{1}{15}\\textstyle\\sum_i r_i^2 = ${(sse(p.b) / XY.length).toFixed(2)}`, { size: 28, w: 420 }));

  }
}, { img: 'plate.jpg', cap: 'A dose experiment: each well gets a higher dose, and we measure one response per sample. The question is how response changes with dose.', info: { see: ['Pale to deep cyan: low to high dose'], read: ['Next step: 15 simulated samples, dose against response'] }, labels: [[.37, .52, .14, .3, 'low dose', 'c1'], [.62, .55, .86, .36, 'high dose', 'c1']] }));

// ---------------- scene 12: classification, cross-entropy, gradient descent ----------------
const CELLS = (() => { const r = Proff.rng(13), a = []; for (let i = 0; i < 16; i++) { const x = r() * 10, pt = 1 / (1 + Math.exp(-1.2 * (x - 5))); a.push([x, r() < pt ? 1 : 0]); } return a.sort((u, v) => u[0] - v[0]); })();
const sig = v => 1 / (1 + Math.exp(-v)), pTrue = (w, [x, y]) => { const q = sig(w * (x - 5)); return y ? q : 1 - q; };

const wHat = (() => { let b = 0, v = 1e9; for (let w = 0; w <= 3; w += .005) { const l = nll6(w); if (l < v) { v = l; b = w; } } return b; })();

    { cap: `The log punishes confident mistakes hardest. A chance of 0.5 costs ${(-ln(.5)).toFixed(2)}; a chance of 0.05 costs ${(-ln(.05)).toFixed(2)}.`,
      info: { see: ['Label: the worst cell'], read: ['−log p grows without limit as p goes to 0', 'One badly wrong cell can outweigh many right ones'] } },
    { cap: 'Training = walking downhill on −log L: new w = old w − η × slope. This is **gradient descent**, part 4 upside down.',

    { cap: 'A deep network only changes how pᵢ is computed: millions of weights instead of one. The loss and the downhill steps stay the same.',

  draw(g, k, t, p) {

    g.panel('fit', D => {
